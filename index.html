tak určitě nevynechejte vojenskou pevnost v městečku Cát Bà. Nachází se na strategickém místě 177 m.n.m. a byla postavena v roce 1942, kdy jí používali Japonci za 2. světové války a později vietnamci během vietnamské války. Pevnost je celkem rozlehlá a nabízí spoustu k prozkoumání včetně místních tunelů. Dalším a pro někoho nejhlavnějším lákadlem však může být krásný výhled na místní zátoku Lan Ha. Dá se odsud sledovat krásný západ slunce. Doporučuji se sem vydat dříve a zabrat si tak dobré místo.","Začátkem roku 2026 byl po několika letech výstavby dokončen obrovský projekt jedné z největší vietnamské developerské společnosti Sun Group. Jedná se o zcela novou turistickou čtvrť vytvořenou umělým nánosem půdy a to přímo v centru města na místě původní promenády a pobřeží. Místní oblast se tak zásadně rozšířila směrem do moře a vznikla zde moderní čtvrť s obchody, restauracemi, kulturními aktivitami a novou pláží Cát Bà. Pro některé (především Vietnamce) jsou podobné projekty přínosem a symbolem rozvoje. Pro ostatní (většinou západní turisty) naopak ukázkou ničení přírody a přirozeného prostředí. Ať už máte názor jakýkoliv, tak tento trend je ve Vietnamu a např. Číně daný a zdá se být už normou místního moderního turismu.","Za městečkem se nachází i 3 hlavní přírodní pláže Cát Cò 1,2 a 3. Pokud budete mít chuť, tak je jistě můžete prozkoumat."],"food":["Na ostrově bohužel neznám žádné vyloženě autentické a unikátní lokální jídelny nebo restaurace, jelikož se zde nachází primárně turistické s pestrým výběrem z vietnamského i západního jídla. V mapě jsem vyznačil centrum města s restauracemi a bary, kde jich je opravdu spoustu. Obecně po celém ostrově se nachází mnoho restaurací a tak o jídlo není nikdy nouze. Jelikož jste u moře, tak jistě všude budou velmi dobré mořské plody."],"stay":["Přímo ve městě doporučuji tyto ubytování s výborným poměrem cena/kvalita:","Manh Vuong Hotel - dobrý hotel přímo na hlavní promenádě s pokoji s výhledem na moře. Booking/Agoda","New Ho áže Cát Cò 1,2 a 3. Pokud budete mít chuť, tak je jistě můžete prozkoumat."],"food":["Na ostrově bohužel neznám žádné vyloženě autentické a unikátní lokální jídelny nebo restaurace, jelikož se zde nachází primárně turistické s pestrým výběrem z vietnamského i západního jídla. V mapě jsem vyznačil centrum města s restauracemi a bary, kde jich je opravdu spoustu. Obecně po celém ostrově se nachází mnoho restaurací a tak o jídlo není nikdy nouze. Jelikož jste u moře, tak jistě všude budou velmi dobré mořské plody."],"stay":["Přímo ve městě doporučuji tyto ubytování s výborným poměrem cena/kvalita:","Manh Vuong Hotel - dobrý hotel přímo na hlavní promenádě s pokoji s výhledem na moře. Booking/Agoda","New Horizon Hotel - hezký kvalitní hotel za dobrou cenu. Booking/Agoda","TOMMY HOTEL - hezký čistý hotel za dobrou cenu. Booking/Agoda","Na ostrově se také nachází krásná ubytování mimo město uprostřed přírody a hor:","Cat Ba Eco Lodge - Menší poměrně skromné ubytování spíše ve stylu typického homestay a pár bungalowů mezi stromy. Má bazén. Booking/Agoda","Cat Ba Holiday Retreat - Hezké větší ubytování uprostřed krásného údolí blízko skalnatým horám a lesům. Bazén a profesionálnější služby. Booking/Agoda","YEN Hidden Valley - Krásné, na místní poměry spíše luxusnější ubytování v tzv. Motýlím údolí ve vesnici Liên Minh. Toto je opravdu skrytý klenot ve větším izolovaném údolí nabízející travnatou planinu, v období dešťů se i částečně zaplavuje a vytváří přírodní jezírko, na místních skalách i možnost horolezectví. Booking/Agoda","Vyhledal jsem také 5 možných ubytování, které se nacházejí na přilehlých malých ostrůvcích a měly by tak nabízet klid, větší soukromí a vlastní pláž. Žádné z nich však nemá nijak závratně vysoké hodnocení (kromě Vạn Bội Ecolux Resort). Resorty se zdají být již lehce starší. Nečekejte tak vyloženě luxus. Jde zde především o místo.","Monkey Island Resort - hezký resort s dřevěnými bungalowy a hezkou pláží. Zdá se být klidným místem k odpočinku. Trochu starší vybavení. Hodnocení 7,4. Booking/Agoda","Cat Ong Beach Cottages - oproti ostatním hezky vybavené pokoje, hezká soukromá pláž. Výhled na hlavní ostrov Cát Bà a tak možný provoz lodí ve výhledu. Hodnocení 6,5. Booking/Agoda","Namcat Island Resort - poměrně hezké dřevěné bungalowy a chaty nad vodou. Pravděpodobně spíše pro backpackery. Hodnocení 6,9. Booking/Agoda","Cat Ba Sandy Beach Resort - resort hned vedle Namcat Island Resort výše. Zdá se být hezčí a kvalitnější. Odpovídají tomu i ceny. Hodnocení 6,5. Booking/Agoda","Vạn Bội Ecolux Resort - nejluxusnější volba z nabídky. Nové, hezké pokoje. Malý bazén na břehu s výhledem na moře. Hodnocení 9,1. Booking/Agoda","Pro vyhledání dalších ubytování na hlavním ostrově a celé oblasti klikněte na odkaz níže."],"budget":{"jidlo":null,"ubytovani":null,"benzin":null,"ostatni":null,"celkem":850000,"pozn":"podle celkového plánu"},"synth":true,"brief":"Odpočinek u moře. Případně prozkoumávání ostrova a místní zátoky.","phase":"more","from":"Cát Bà","to":"Cát Bà","vasek":"3 denní pobyt na ostrově dle libosti. Osobně bych jeden udělal kompletně relaxační u moře/ve městě, druhý průzkumem ostrova a Národního parku a třetí samozřejmě v známé přilehlé zátoce Lan Hạ na lodi."},{"n":22,"weekday":"neděle","date":"1. 11. 2026","theme":"NÁVRAT DO HANOJE","fromto":"Cát Bà Hà Nội","km":"151 km","time":"3h 41m","profile":"hlavní široké silnice","pois_pdf":[{"n":"MOST LONG BIÊN","d":"Historický most přes Rudou řeku postavený v roce 1902 Francouzi. Během války jediným mostem přes řeku a stěžejní dopravní tepnou mezi Hanojí a přístavem Hải Phòng. Vede přes něj železnice a dále na něj můžou skútry a chodci. Na jaře 2026 byl částečně zrekonstruován."},{"n":"TIGIT MOTORBIKES","d":"Kancelář Tigit Motorbikes, pro vrácení motorek."}],"program":["Poslední den na motorkách před vámi a čeká vás návrat do Hanoje! Upřímně cesta není cestovatelsky nijak zajímavá a v obrovsky hustě zalidněné a zastavěné aglomeraci delty Rudé řeky to ani jinak prakticky vymyslet nejde. Největší „zajímavostí“ tak můžou být maximálně velká města, široké silnice, hustý provoz a obří industriální zóny. I to je však autentický Vietnam, respektive ten, který zemi ekonomicky táhne dopředu.","Z ostrova se samozřejmě nejdříve musíte dostat na pevninu, což lze jednoduše uskutečnit trajektem a to z přístavu Cái Viềng na druhou stranu do přístavu Gót. Do přístavu se z městečka Cast Bà dostanete velmi rychle za zhruba 20 km a 30 minut. Následná plavba trajektem je na zhruba 15 minut.","Na druhé straně začne již zmíněná jen a pouze hustě zalidněná aglomerace. Za přístavem přejedete přes obrovský most přes místní námořní přístav a následně přímo do města Hải Phòng. Hải Phòng je a vždy bylo právě hlavním přístupem k moři pro Hanoj. Již Francouzi zde na přelomu 19. a 20. století postavili železniční trať do hlavního města a Hải Phòng byl samozřejmě významný a také velmi bombardovaný během vietnamsko-americké války. Dnes je město jedno z nejrozvinutějších a díky přístavu a obchodu na své poměry také nejbohatších měst v severním Vietnamu.","Za městem se napojíte na tzv. starou dálnici do Hanoje - silnici AH14, která vás dovede až do úplného cíle. Ač dnes do Hanoje vede již nová hezká dálnice přístupná pouze pro dvoustopá vozidla (pozor, nenechte se tam navést navigací!), tak AH14 je stále rušná, jelikož se podél ní nachází mnoho továren a industriálních zón obecně, což je speci fikum prakticky celé nížiny a delty Rudé řeky na východ od Hanoje. Budete tak prakticky neustále míjet kamióny, takže buďte velmi obezřetní, čtěte a předvídejte provoz. Za normálních okolností se zde však dá jet plynule, cesta mezi přístavem Gót a Hanojí je 130 km a 3 hodiny jízdy a cesta do Hanoje tak uteče velmi rychle. Až těsně před Hanojí projedete obří kruhový objezd z kterého odbočíte 3. výjezdem „doleva na západ“. Navigujte se podle mapy až na poslední bod z kterého se dostanete přímo rovně na slavný a historický most Long Biên, který vás dostane rovnou do centra města. Gratuluji! Vítejte v cíli! Vaše cesta velká cesta po severním Vietnamu je úspěšně za vámi!","Chci vám upřímně a z celého srdce mockrát poděkovat, že jste si ode mě nechali vytvořit plán cesty! Pevně doufám, že se vám vše na co jste narazili líbilo, Vietnam vás uhranul a odnášíte si tak úžasné zážitky na celý život.","Závěrem bych vás chtěl moc poprosit, dokud máte všechny zážitky ještě čerstvé, o vyplnění dotazníku se zpětnou vazbou na Individuální plán a celou cestu, kterou jste díky němu zažili. Dotazník najdete po kliknutí zde. Budu opravdu moc vděčný za jeho vyplnění.","Ještě jednou díky, užijte si zbylý čas v Hanoji a šťastnou cestu domů!"],"food":["V městě Hải Phòng můžete zastavit na místní vyhlášený styl baget bánh mỳ. Nejsou to klasické bagety, jak je již jistě znáte, ale spíše takové tenké variace a pouze s paštikou. Je to tak velmi dobrý a pro místní klasický snack. Velmi slavným místem je Bánh Mỳ Cay Bà Già Lợi.","Město Hải Dương se většinou nabízí k zastavení na oběd. Přímo na hlavní silnici se zde nachází 2 velké a dobré restaurace:","Nhà Hàng 559 - velký „motorest“ klasicky pro autobusy, kde se dá dobře najíst a případně také zakoupit některé lokální produkty.","Cơm Niêu Tài Lộc - velká dobrá restaurace s klasickými pokrmy cơm a rýží pečenou v hliněných miskách."],"stay":["V Hanoji vám doporučím 4 druhy ubytování v centru od základní až po ultra luxusní úroveň:","Serenity Diamond Hotel - levná, ale naprosto dostatečná úroveň ubytování. Booking/Agoda","Blue Hanoi Inn Hotel - střední kategorie hotelu s neuvěřitelně milým personálem. Booking/Agoda","Sap Hotel by Connek - výborný 4 hvězdičkový hotel a spa. Booking/Agoda","Sofitel Legend Metropole Hotel - 5 hvězdičkový ultra luxusní hotel. Je to první luxusní hotel v koloniálním stylu otevřený již v roce 1901. Toto je místní legenda, kde se od jakživa ubytovávají slavní lidé z celého světa jako např. Charlie Chaplin, američtí prezidenti nebo Angelina Jolie s Bradem Pittem. V nedávné době se zde konal summit mezi prezidenty USA a Severní Koreje. Booking/Agoda","Kategorie luxusních hotelů s výjimečnou lokalitou a vybaveností:","Rex Hanoi Hotel - 4 hvězdičkový hotel přímo v srdci Staré čtvrti s úžasným výhledem z terasy, baru a bazénu na centrum a jezero Navráceného meče. Booking/Agoda","San Grand Hotel - 4 hvězdičkový hotel stejně jako Rex Hotel leží v centru Staré čtvrti a nabízí úžasný výhled na město a jezero. Booking/ Agoda","V poslední době také využívám Airbnb, které nabízí krásné byty za podobné ceny hotelových pokojů. Nezapomeňte však klást důraz na to, aby byty měly své vlastní parkovací prostory.","Pro vyhledání z široké nabídky všech druhů ubytování klikněte na jeden z odkazů níže."],"budget":{"jidlo":400000,"ubytovani":300000,"benzin":300000,"ostatni":45000,"celkem":1045000,"pozn":"trajekt"},"brief":"Poslední den na motorkách a návrat do Hanoje. Vrácení motorek.","phase":"more","from":"Cát Bà","to":"Hà Nội","vasek":"Delší, ale rychlý a upřímně kromě obrovských industriálních zón a postupně hustších vietnamských aglomerací ničím již extra zajímavým. Prostě návrat do metropole. :)"},{"n":23,"weekday":"pondělí","date":"2. 11. 2026","theme":"HLAVNÍ MĚSTO","fromto":"Hà Nội Hà Nội","km":"","time":"","profile":"","pois_pdf":[{"n":"STARÁ ČTVRŤ","d":"Absolutní centrum města, kde Hanoj v roce 1010 n.l. byla založena."},{"n":"JEZERO NAVRÁCENÉHO MEČE","d":"Ikona Hanoje - centrální jezero Navráceného meče."},{"n":"OMAMORI SPA","d":"Výborné masážní spa, kde pracují lidé s postižením zraku. V centru města má 2 pobočky."},{"n":"CHRÁM LITERATURY","d":"První hanojská univerzita."},{"n":"HO CHI MINOVO MAUZOLEUM","d":"Mauzoleum ve kterém se nachází balzamované tělo prezidenta Ho Chi Mina."},{"n":"ZÁPADNÍ JEZERO","d":"Obrovské městské jezero je klidnou oblastí ideální k “útěku” z rušného města."},{"n":"MUZEA","d":"Etnologické muzeum, muzeum umění, muzeum vietnamských žen."},{"n":"HANOJSKÁ PLÁŽ","d":"Unikátní “hippie” místo na ostrově pod mostem Long Biên může být dobrým místem k odpočinku a nahlédnutí do lokální subkultury."}],"program":["Poslední celý den v Hanoji před odletem – podle Vaška „čas na poslední jídla, nákupy, kávy, apod.“ a zvolnění před návratem domů. Motorky jste vrátili včera v kanceláři Tigit Motorbikes (rezervace končí 1. 11. v 16:00).","Vašek v úvodním mailu poznamenal, že tento den by teoreticky šlo obětovat a protáhnout začátek cesty, ale neočekával to: „to většinou bývá závěrečný čas na poslední jídla, nákupy a zvolnění před návratem domů“.","Pokud jste na začátku cesty nestihli něco z programu 1. a 2. dne (Chrám literatury, Ho Chi Minovo mauzoleum, Západní jezero, muzea, „hanojská pláž“ pod mostem Long Biên), dnes je na to prostor. Vašek u 2. dne píše: „Pokud si místa budete chtít rozložit i na poslední dny v Hanoji po cestě na motorkách, tak doporučuji dnes navštívit Vietnamské muzeum etnologie.“","Tipy na jídlo, kavárny a ubytování jsou stejné jako 1. a 2. den – všechny body jsou v hanojské mapě.","Večer si připravte věci na ranní odjezd: zítra odlet v 8:45, odjezd z hotelu nejpozději v 6:00."],"food":["V mapě je vyznačeno opravdu spoustu míst. Seznam níže jsou místa, která jsou absolutní hanojské klasiky. Vždy se ale můžete rozhodnout přímo podle mapy a toho, kde se zrovna nacházíte. Věřím, že žádné uvedené místo nezklame.","Phở 10 Lý Quốc Sư - jedno z nejznámějších hovězích phở bò v centru.","Phở Gia truyền Bát Đàn - další velmi staré a tradiční phở bò.","Phở xào Phú Mỹ - výborné smažené rýžové nudle phở s hovězím masem.","Phở trộn Hạnh - jedno z mých nejoblíbenějších jídel - rýžové nudle phở s trhaným slepičím vařeným masem, bylinkami, arašídy a omáčkou. Otevřeno mají pouze večer a je to typický streetfood na malých plastových židličkách na ulici. Objednejte si konkrétně jídlo phở trộn. Mají tu ale také i výborné kuřecí phở gà.","Bún bò Nam Bộ Bách Phương - klasika velmi známá z ČR - rýžové nudle bún s restovaným hovězím masem, bylinkami, zeleninou, arašídy, smaženou cibulkou a zálivkou.","Bánh cuốn gia truyền Thanh Vân - slané “palačinky” z rýžového těsta plněné mletým vepřovým masem a houbami. Namáčí se do rybí omáčky. Velmi typické severské jídlo. Ideální především k snídani nebo lehké večeři.","Bánh mì 25 - slavná vietnamská bageta s mnoha variacemi náplní.","Chả Cá Thăng Long - typicky hanojské vyhlášené jídlo oceněné v Michelin BIB Gourmand - grilované kusy ryby podávané s jarní cibulkou, koprem a dalšími bylinkami dohromady grilované na horké pánvi přímo na stole. Podávané s rýžovými nudlemi bún, arašídy a omáčkou.","Sinh tố Hoa Béo - na tomto místě dělají proslavené hoa quả dậm - miska se sezónním ovocem, kousky želé, ledovou tříští a vše zalité směsí kondenzovaného a kokosového mléka. Výborný osvěžující dezert. Mají více variací např. se zmrzlinou, v kokosu, topingem, atd.","Kem Tràng Tiền - nejznámější hanojská zmrzlina založena roku 1958.","Bún Chả 41 Cửa Đông - další velmi typické severské jídlo - nudle bún, grilované marinované kousky vepřového bůčku, směs bylinek a zálivka. Často se podává se smaženými krabími závitky.","Bún chả Duy Diễm - výborné bún chả, ale mimo centrum.","Bún cá Hồng Phúc - tradiční rybí polévka bún cá. Toto místo je otevřené 24 hodin denně a je nejlepší pro noční zahnání hladu nebo po propařeném večeru.","Phở cuốn Chinh Thắng - hanojské závitky phở cuốn z tlustšího rýžového těsta plněné kousky restovaného hovězího masa, salátu a koriandru. Namáčí se do rybí omáčky. Objednejte si zde také smažené taštičky phở chiên phồng s hovězím masem a vietnamským zelím pak choi. Jedno z mých nejoblíbenějších jídel. Nachází se kousek od Západního jezera.","Bò Nướng Xuân Xuân - populární hovězí gril za lidové ceny.","Sumo BBQ - all you can eat bufet konceptu grilu na stole a plátcích všech druhů syrových mas. Vyšší úroveň, výborné chutě, velký zážitek.","Cafe Nola - krásná kavárna přímo uprostřed centra.","Cộng Cà Phê - velmi známý řetězec kaváren v starém komunistickém stylu. Výborná káva, kvalitní servis a úroveň.","Oldtown Garden Café - známá kavárna v posledním patře úzké budovy kousek od jezera Navráceného meče. Hlavním lákadlem je právě terasa na střeše s výhledem na město a jezero. Vstup do kavárny je celkem úzkým nenápadným průchodem mezi domy, tak hledejte pozorně. Dělají zde hanojskou specialitu - kávu s našlehaným žloutkem.","Manzi Art Space - umělecký prostor Manzi s kavárnou nabízí příjemné prostředí pro poznání lokální současné umělecké scény.","Tranquil Books & Coffee - velmi klidná a hezká kavárna kousek od centra. Mnoho lidí si sem chodí spíše číst, pracovat a odpočívat. Nabízí výbornou kávu a 3 patra, kdy každé je vhodné k jiné aktivitě.","Oriberry coffee - kavárna u Západního jezera s nádherným výhledem na jezero z terasy ve 3. patře."],"stay":["V Hanoji vám doporučím 4 druhy ubytování v centru od základní až po ultra luxusní úroveň:","Serenity Diamond Hotel - levná, ale naprosto dostatečná úroveň ubytování. Booking/Agoda","Blue Hanoi Inn Hotel - střední kategorie hotelu s neuvěřitelně milým personálem. Booking/Agoda","Sap Hotel by Connek - výborný 4 hvězdičkový hotel a spa. Booking/Agoda","Sofitel Legend Metropole Hotel - 5 hvězdičkový ultra luxusní hotel. Je to první luxusní hotel v koloniálním stylu otevřený již v roce 1901. Toto je místní legenda, kde se od jakživa ubytovávají slavní lidé z celého světa jako např. Charlie Chaplin, američtí prezidenti nebo Angelina Jolie s Bradem Pittem. V nedávné době se zde konal summit mezi prezidenty USA a Severní Koreje. Booking/Agoda","Kategorie luxusních hotelů s výjimečnou lokalitou a vybaveností:","Rex Hanoi Hotel - 4 hvězdičkový hotel přímo v srdci Staré čtvrti s úžasným výhledem z terasy, baru a bazénu na centrum a jezero Navráceného meče. Booking/Agoda","San Grand Hotel - 4 hvězdičkový hotel stejně jako Rex Hotel leží v centru Staré čtvrti a nabízí úžasný výhled na město a jezero. Booking/ Agoda","V poslední době také využívám Airbnb, které nabízí krásné byty za podobné ceny hotelových pokojů. Nezapomeňte však klást důraz na to, aby byty měly své vlastní parkovací prostory.","Pro vyhledání z široké nabídky všech druhů ubytování klikněte na jeden z odkazů níže."],"budget":{"jidlo":400000,"ubytovani":300000,"benzin":0,"ostatni":0,"celkem":700000,"pozn":""},"synth":true,"brief":"Poslední celý den v Hanoji – nákupy, poslední jídla, kávy, atd.","phase":"mesta","from":"Hà Nội","to":"Hà Nội","vasek":"Celý den v Hanoji před odletem, čas na poslední jídla, nákupy, apod."},{"n":24,"weekday":"úterý","date":"3. 11. 2026","theme":"ŠŤASTNOU CESTU DOMŮ!","fromto":"Hà Nội Praha","km":"","time":"","profile":"","pois_pdf":[],"program":["Ranní odlet z Hanoje v 8:45 (VietJet VJ031, Nội Bài → Almaty 13:20, dále VJ031 Almaty 14:50 → Praha 18:30). Vašek: „což znamená nejpozději v 6:00 odjezd z hotelu na letiště, abyste byli 2 hodiny před odletem na letišti.“","Letiště Nội Bài je 25 km od centra, cesta trvá 30–60 minut podle dopravy (ranní špička 7–9 h). Objednejte Grab (cca 350 000 VND za 4místné auto do/z centra) nebo taxi předem přes hotel.","Nezapomeňte: online check-in 24 h předem na vietjetair.com, pas, zbytek VND utratit nebo směnit – mimo Vietnam se dong prakticky nedá vyměnit.","Vaškova závěrečná prosba z 22. dne: dokud máte zážitky čerstvé, vyplňte dotazník se zpětnou vazbou na individuální plán (odkaz v sekci Praktické)."],"food":[],"stay":[],"budget":{"jidlo":150000,"ubytovani":0,"benzin":0,"ostatni":0,"celkem":150000,"pozn":""},"synth":true,"brief":"Odlet do Prahy v 8:45.","phase":"mesta","from":"Hà Nội","to":"Praha","vasek":"Ranní odlet z Hanoje v 8:45, což znamená nejpozději v 6:00 odjezd z hotelu na letiště, abyste byli 2 hodiny před odletem na letišti."}],"kml":{"1":{"title":"HÀ NỘI","pois":[{"n":"Stará čtvrť","c":"kultura","lat":21.03406,"lng":105.85064,"vn":"Phố Cổ","i":"1546"},{"n":"Jezero navráceného meče","c":"kultura","lat":21.02867,"lng":105.85215,"vn":"","i":"1697"},{"n":"Tháp Rùa","c":"kultura","lat":21.02782,"lng":105.85226,"vn":"","i":"1598"},{"n":"Pagoda Ngọc Sơn","c":"kultura","lat":21.03073,"lng n":"Bến phà Cái Viềng, Đường tỉnh 356, Cat Hai, Hai Phòng","lat":20.81821,"lng":106.91351},{"n":"Bến phà Gót, Cat Hai, Hai Phòng","lat":20.79784,"lng":106.89318},{"n":"43 P. Long Biên 1, Bồ Đề, Hà Nội, Vietnam","lat":21.04586,"lng":105.86773}]},"guides":[{"id":"jak","title":"Jak pracovat s denním itinerářem","src":"0.2 JAK PRACOVAT S DENNÍM ITINERÁŘEM.pdf","secs":[{"h":"","blocks":[{"t":"p","x":"Doporučuji si projít všechny itineráře dopředu, abyste věděli, co Vás čeká, co bude lepší zařídit předem (např. ubytování, jízdenky, apod.) anebo kdy a jak si můžete dovolit zkracovat/prodlužovat volitelně cestu vůči plánu."},{"t":"p","x":"Hlavička každého dne obsahuje číslo dne ve Vietnamu, den a datum. Dále téma dne, které charakterizuje konkrétní den. V zeleném obdélníku je název města/vesnice/místa ze kterého budete podle plánu vyrážet a v červeném vaše cílová destinace. Vzdálenost a doba jízdy vychází z výpočtu trasy podle Google mapy."},{"t":"p","x":"Vzdálenost reprezentuje trasu, kterou je nutné ujet, abyste se dostali do plánovaného cíle. V některých dnech však nabízím alternativní trasy včetně informací o jejich vzdálenostech a čase."},{"t":"p","x":"Čas je hodnota čisté doby jízdy a nezahrnuje tak přestávky, jídla a dobu strávenou na místech po trase."},{"t":"p","x":"Snažte se tak podle profilu aktuální trasy a vlastních zkušeností odhadovat, kolik Vám daný den reálně zabere času. Plány jsou obecně sestaveny tak, aby zabraly celý den a zároveň bylo reálné vše stihnout. Je však nutné zohlednit Vaše schopnosti a rychlost jízdy a především styl/tempo cestování. Někteří nemají problém ujet za den 200 km s pár krátkými zastávkami. Někteří naopak chtějí stavět více a trávit na místech déle."},{"t":"p","x":"Doporučuji první dny vyrážet brzy ráno pro ověření si funkčnosti Vašeho tempa vůči plánu."},{"t":"p","x":"Profil trasy stručně popisuje profil silnic a cest, které Vás čekají. Slouží k obecné jízdní představě o konkrétním dni. Mapa Vás odkáže na mnou vytvořenou Google mapu se všemi zadanými body zájmu, jídly, ubytováním a trasou na konkrétní den. Lze se podle ní snadno navigovat v mobilní aplikaci Google Maps výběrem konkrétního bodu a navigací na něj."},{"t":"p","x":"Při reálné jízdě si kontrolujte, zda Vás navigace do daného bodu opravdu vede podle trasy, kterou jsem vyznačil v mapě. Při vytváření jsem zohledňoval vlastní zkušenosti a trasu někdy vedl objížďkami nebo přes konkrétní body zájmu, kam by Vás Google přirozeně nevedl."},{"t":"p","x":"Cíl je na mapě zadaný většinou do centra města. Před vjezdem do něj si tak změňte navigaci na konkrétní ubytování. Body zájmu jsou přírodní⚑ a kulturní místa⚑, zajímavé cesty a oblasti⚑, možné aktivity⚑, konkrétní tipy na jídla⚑ a ubytování⚑ a ostatní orientační body⚑."},{"t":"p","x":"Všechny jsou stručně popsané pro obecný přehled a očekávání, co daný den můžete navštívit."},{"t":"p","x":"Všechny jsou stejným názvem zadané v Google mapě konkrétního dne a označené stejnou barvou dané kategorie."},{"t":"p","x":"Většina z nich vychází z reálných bodů zadané Googlem v jejich mapách, takže si je můžete najít, otevřít a prohlédnout si fotky a hodnocení sdílené dalšími uživateli. Získáte si tak ještě podrobnější a reálnější představu o daném místě. U jídla a ubytování to jsou především adresy a telefonní čísla."},{"t":"p","x":"Vše to jsou místa, která stojí za to navštívit a drtivou většinu z nich znám z vlastní zkušenosti a jsou zohledněny v celkovém plánu a reálnosti trasy."},{"t":"p","x":"Pokud některé místo osobně neznám, tak je to vždy uvedené jako \"Nemám prozkoumáno”."},{"t":"p","x":"Často v mapě naleznete označení průsmyku, což primárně bývá hezký zatáčkovitý úsek s dobrým povrchem a krásným výhledem, kde si užijete jízdu na maximum."},{"t":"p","x":"V mapách občas najdete i tipy na jiná ubytování po cestě do cílové destinace, které mohou pomoci při individuální změně plánu např. v případě zpoždění vůči plánu."},{"t":"p","x":"Některé plánované dny se dají spojit v jeden a získat tak den navíc nebo naopak dohnat ztrátu. Plánujte si to ale více dopředu s ohledem na následující dny a vzdálenosti. Ne vždy je možné plánovanou trasu zkrátit nebo zrychlit."},{"t":"p","x":"Program Vám podrobně popíše, jak konkrétní den bude probíhat, co navštívíte, projedete, co je např. třeba udělat. Je propojený s body zájmu, které jsou označeny vždy tučně, korespondují s názvem v Google mapě a je označený vlaječkou v barvě příslušné kategorie."},{"t":"p","x":"V tipech na jídlo se dozvíte, kde konkrétně se během dne nejlépe a nejpraktičtěji vůči plánu najíst."},{"t":"p","x":"Většinou zde najdete názvy a lokace konkrétních restaurací nebo jídel, které stojí za to vyzkoušet v dané oblasti. Tipy a ubytování fungují stejně, jako tipy na jídlo. Konkrétní doporučení jsou na mnou vyzkoušená místa a jejich cena je také zahrnuta v celkovém rozpočtu."},{"t":"p","x":"V mapě uvádím i jiné tipy na ubytování, které třeba vyzkoušené nemám, ale zdají se být vhodná."},{"t":"p","x":"Denní rozpočet na osobu se skládá z kalkulace odhadu nákladů každého dne na jídlo a pití, ubytování, benzín, ostatní a celkový rozpočet na den."},{"t":"p","x":"Stejně jako u vzdálenosti a doby jízdy je dobré rozpočet srovnávat s reálnou útratou a mít tak přehled, jak moc se Vám daří dodržovat předem stanovený rozpočet na celý výlet."}]}]},{"id":"provoz","title":"Provoz ve Vietnamu","sub":"Pravidla, rady a triky, jak přežít ve vietnamské dopravě","src":"PROVOZ VE VIETNAMU.pdf","secs":[{"h":"Úvod","blocks":[{"t":"p","x":"Následující doporučení primárně popisují možné situace, které se ve vietnamském provozu mohou stát a pravděpodobně na ně nebudete zvyklí. Neslouží k tomu, aby Vás vystrašily, ale naopak k tomu, abyste s nimi počítali předem. Hodně z nich se Vám ani nikdy nemusí stát, avšak štěstí přeje připraveným."},{"t":"p","x":"Ta nejzákladnější rada, kterou by si každý měl vzít k srdci je: chladná hlava, respekt k ostatním účastníkům provozu, selský rozum a koukat kolem sebe."},{"t":"p","x":"Drtivá většina lidí své počáteční obavy odbourá po prvních pár kilometrech a mnoho z nich si vietnamskou dopravu dokonce i zamilují."}]},{"h":"POHYB V PROVOZU","blocks":[{"t":"ul","items":["Provoz ve Vietnamu funguje na principu “proudu” a “organizovaného chaosu”.","Vozidla vyloženě nedodržují jeden směr/pruh a jezdí na první pohled velmi zmatkovitě.","Tam, kde je místo, tam jedou. Provoz jako celek je ale neustále v pohybu v jednom “houfu” a ve finále bezpečný. Osobně ho přirovnávám k velkému hejnu ryb.","Každý řidič je zodpovědný za to, co se děje primárně před ním, ale i vedle něho.","V provozu funguje právo většího/silnějšího. Přednost má vždy větší vozidlo. Tzn.: kamión->autobus->náklaďák->auto->skútr->kolo- >chodec.","Platí to ve všech případech. Tzn. že vám protější auto klidně vjede do cesty, aby odbočil i když si myslíte, že jedete první a máte tak přednost. Ve Vietnamu musíte zastavit a nechat ho projet, nebo se mu vyhnout/ objet ho, aby mohl projet. I když občas někdo “přednost” dá, tak je lepší vždy počítat s tím, že pojede a vy tomu tak přizpůsobíte jízdu.","Musíte tak zapomenout na pravidla z Čech a západních zemí. Je chybou očekávat, že máte na něco právo. Tam kam si “prorazíte” cestu, tam pojedete. Nezapomeňte ale na právo většího.","I když vám mnoho dopravních situací můžou připadat zmatené a bezohledné, je důležité nepanikařit, zachovat klid a chladnou hlavu. V složitějších situacích je vždy nejlepší zpomalit nebo rovnou zastavit.","Pokud si na provoz zvyknete, je pravděpodobné, že se v něm nakonec budete cítit velmi bezpečně.","Řidiči se ve finále navzájem respektují a nejezdí ani moc rychle. Hustý provoz jim to ani nedovolí. V případě nutnosti se tak dá manévrovat nebo zabrzdit velmi rychle.","Vždy si mezi sebou udržujte dostatečně bezpečný rozestup! Platí to především při vyšších rychlostech 40km/h a výš.","Pokud možno, tak na vozovce jezděte přehledně, plynule a předvídatelně tak, abyste neohrožovali ostatní účastníky provozu a především svou skupinu. Nedělejte zbrklé pohyby ze strany na stranu!","Je naprosto běžné používat klakson. Klakson neznamená “Hej ty vole, uhni!”, ale “Pozor jsem tady, jedu za tebou nebo proti tobě, tak na mě ber prosím ohled”.","Vždy při odbočování používejte blinkr.","Při předjíždění např. auta každý sám za sebe musí vyhodnotit, jestli manévr zvládne včas! To, že jezdec před vámi začne předjíždět neznamená, že vy to stihnete bezpečně také. Silnice jsou ve Vietnamu mnohdy úzké a zatáčkovité.","Za autem udržujte dostatečný rozestup a nelepte se na něj. Na silnici může být např. nečekaná díra, která vás překvapí a vy se leknete nebo nestihnete zareagovat. Velmi snadno tak může dojít k pádu.","Pokud se budete chtít otočit do protisměru, zajeďte na pravý kraj silnice, zastavte, dejte blinkr a podívejte se za sebe. V moment, kdy vám to provoz z obou stran umožní, přejeďte do protisměru.","Pokud odbočujete na křižovatce, přesuňte se na rozmezí vašeho a protějšího pruhu a tam počkejte, než protější vozidla přejedou a budete mít volnou cestu odbočit. Při tomto “manévru” se formujte do svislé řady vedle sebe, abyste v provozu zabírali co nejméně místa.","Vozidla z protější strany, které odbočují však většinou jedou jako první.","Na kruhovém objezdu signalizujte směr, kam budete odbočovat. Pokud budete vyjíždět 3. výjezdem, tak při vjezdu dáte blinkr doleva. Stále platí právo většího. Je běžné, že uprostřed objezdu jednoduše zastavíte, abyste pustili auto projet.","Sledujte chodníky a vedlejší cesty, jestli z nich někdo nenajíždí do vašeho pruhu. Většinou najedou aniž by se podívali doleva, jestli jedete nebo ne (stále sledují to, co se děje před nimi). Pokud někoho takového uvidíte, pro jistotu na něj zatrubte, abyste mu dali vědět, že jedete a udělejte mu místo.","Snažte se předvídat jejich jízdu (rychlost, směr) a buďte raději opatrnější a přibrzděte si. Zbytečně se nikam netlačte, pokud si nejste 100% jistí.","V horách trubte při vjezdu do slepých zatáček. Auta do nich vjíždějí i do protisměru. Držte se proto spíše vpravo.","Pozor na psy (nic neřeší) a slepice/kohouty (jejich reflex je před vámi utéct a to často přímo vám přes cestu na druhou stranu). Na potenciálně nebezpečná zvířata vždy trubte.","Pozor také na místní autobusy a Transity. Jezdí rychle, kvůli konkurenci. Mimo města neexistují zastávky a lidi “sbírají” po cestě na zamávání a tak z ničeho nic prudce brzdí ke krajnici. Počítejte s tím.","Je běžné předjíždět zprava. Obecně platí, že skútry jezdí v pravé části vozovky a automobily v levé. Pozor však na zmíněné autobusy.","Důrazně nedoporučuji jezdit večer za tmy. Skútry ani motorky moc dobře nesvítí a tak často můžete nečekaně najet do díry nebo do nezpevněného povrchu. Provoz je řidčí a auta tak jezdí o to rychleji. Navíc spoustu lidí svítí bezohledně dálkovými světly a oslepují. Vždy se snažte dojet do 18. hodiny před západem slunce.","Vždy se snažte parkovat motorky před podnik ve kterém budeme tak, aby na ně bylo vidět.","Snažte se je parkovat úhledně a blízko vedle sebe a nezabírat tak zbytečně moc místa ostatním.","Dávejte pozor na jaký povrch a sklon skútr opíráte. Na bahně nebo písku se stojánek může propadnout a skútr pak spadne!","Pokud budete od skútru dále, zamkněte si řízení a helmu pod sedadlo."]}]},{"h":"OVLÁDÁNÍ SKÚTRU PRO ÚPLNÉ ZAČÁTEČNÍKY","blocks":[{"t":"ul","items":["Ovládejte plyn i brzdu citlivě a plynule. Plynulá jízda je dobrá jízda.","Snažte se nejezdit se ztuhlýma rukama. Mějte ruce uvolněné v ramenou i lopatkách. Lokty je dobré mít trochu ze široka pro lepší manévrování s řídítky..","Zkoušejte a naučte se během jízdy ovládat směr skútru i pohyby kyčlí. Skútr a jeho těžiště na to bude reagovat. Obecně platí, že kam jde tělo, tam jde motorka.","Ve většině situací vám bude stačit brzdit přední brzdou.","Myslete na princip, že když příliš zamáčknete přední brzdu, tak se vám sekne přední kolo a odstředivá síla pošle zadní část skútru dopředu a vy můžete přeletět nebo vám skútr spadne.","Když příliš zamáčknete zadní brzdu, tak se vám zadní kolo může seknout a půjde do smyku. Smyk se však dá regulovat a zachránit např. pohybem boků.","V situaci, kdy potřebujete zabrzdit prudce se naučte mačkat obě brzdy zároveň. Budete mít vyšší efektivitu brždění.","Vždy si dobrzděte a podřaďte do zatáčky takovou rychlostí, kterou jí můžete bezpečně projet.","Nepodřazujte ani nebrzděte v zatáčce.","Do zatáčky se naklánějte do vnitřku zatáčky.","V momentě, kdy dosáhnete vrcholu zatáčky můžete začít přidávat plyn a vynese vás to krásně ven. O tom obecně motorkářství je. :-)","Pozor na reflex přidání plynu v krizové situaci! Vždy musíte zápěstím povolit plyn a začít brzdit.","Pokud jedete z kopce, brzděte motorem."]}]},{"h":"NEBEZPEČNÉ POVRCHY","blocks":[{"t":"ul","items":["Na písku a štěrku jezděte pomalu, s co nejméně možným poloměrem zatáčení, plynule a opatrně. V moment, kdy pneumatika ztratí kontakt s povrchem se zvyšuje riziko smyku a pádu.","Na tomto povrchu vždy musíte přizpůsobit a dbát na citlivost plynu a brždění více, než na suchém povrchu.","Nejeďte však příliš pomalu, jelikož ztratíte odstředivou sílu a spadnete tak i tak.","Na mokru jezděte stejně opatrně a hlavně buďte opatrnější se zadní brzdou. Smykne se vám mnohem snadněji.","Na mokru do zatáčky jeďte pomalu pod menším úhlem, než na suchém povrchu."]}]},{"h":"JEŽDĚNÍ VE VLÁČKU","blocks":[{"t":"ul","items":["Držte si mezi sebou vždy bezpečný rozestup. Při pomalé rychlosti stačí 5 metrů, při rychlosti nad 40km/h aspoň 15 metrů. Nikdy nevíte, co se stane jezdci před vámi, tak ať máte prostor včas zareagovat.","Sledujte jezdce za sebou a berte za něj zodpovědnost, že se drží ve vláčku. V hustém provozu je velká pravděpodobnost, že se rozdělíte a část se tak může ztratit.","Vždy používám domluvený signál pro zastavení ve formě 3x dlouhého zatroubení, který je i v provozu ve kterém se troubí hodně, nepravděpodobné zaslechnout od jiných lidí.","Pokud za vámi někdo tak signalizuje a vypozorujete, že před vámi to nezaregistrovali, přidejte se k troubení, aby se signál dostal až k prvnímu jezdci."]}]},{"h":"POLICEJNÍ KONTROLY","blocks":[{"t":"ul","items":["Mějte na cestování ve Vietnamu vystavený mezinárodní řidičský průkaz na motorku.","Pozor! Zákon, který řidiče s ŘP skupiny B opravňuje řídit automatické skútry do 125cc platí jen na území ČR.","Pokud ŘP nemáte, tak se budete pohybovat mimo zákon, ale praxe je taková, že drtivá většina cestovatelů ve Vietnamu ho nemá.","Pokud vás zastaví policejní hlídka, tak první, co uděláte je, že vypnete motor, klíče vyndáte ze zapalování a dáte si je do kapsy. Policie má oprávnění vám vozidlo zabavit.","Pokud se chcete vyhnout jakékoliv komunikaci, nemluvte jazykem, kterému by mohla druhá strana rozumět. Tzn. ani anglicky! Mluvte Česky, avšak vždy slušně a dělejte jednoduše blbý. Slušnost a neverbální komunikace je základ úspěchu.","Nedávejte žádné doklady. Nic, co by mohlo být použito proti Vám. Na vše reagujte, jako byste nerozuměli.","Policie západní cestovatele obecně moc nestaví. Neumí jazyk. Jsou pouze 2 známá místa ve Vietnamu, kde policie turisty ve velkém staví záměrně a to v Mui Ne a okolo Saigonu. V poslední době se objevují cílené kontroly proti cizincům např. v Da Nangu, kde místní expati i turisté často porušují předpisy a chovají se bezohledně.","Pokud vyloženě neporušíte zákon, tak policie obecně nestaví kvůli kontrolám a prevenci, ale aby jednoduše vybrali úplatek. A vždy si k němu nějaký důvod najdou.","Pokud by opravdu došlo na “lámání chleba”, zkuste je uplatit. 200 tisíc VND je běžný úplatek pro Vietnamce. Vás, jako turistu, to bude stát pravděpodobně více - 500-1000 tisíc VND. Smlouvání a “hraní” je běžné.","Celá situace s policí se samozřejmě mění, pokud zaviníte dopravní nehodu. To je třeba řešit velmi individuálně."]}]}]},{"id":"jidlo","title":"Jídlo ve Vietnamu","sub":"Průvodce hlavními jídly + slovník & pro tipy","src":"JÍDLO VE VIETNAMU.pdf","secs":[{"h":"Úvod","blocks":[{"t":"p","x":"Vietnamská kuchyně je velmi rozmanitá a nabízí více typů způsobů přípravy jídel a konceptů stolování. Obecně prvním krokem je se rozhodnout, na jaký koncept máte momentálně chuť a až poté si podle toho vybrat konkrétní jídla podle preferovaných surovin a typu způsobu přípravy."}]},{"h":"TYPY JÍDEL","blocks":[{"t":"p","x":"Níže naleznete popsány ty nejhlavnější a také nejzajímavější typy vietnamských jídel. Na cestě obecně sledujte, co je napsáno na cedulích restaurací a rychle tak poznáte, co v daném místě můžete očekávat za jídlo."}]},{"h":"CƠM","blocks":[{"t":"p","x":"Obecně používaný výraz pro jídlo a v doslovném překladu rýže. Tento koncept znamená, že si objednáte více talířů různých druhů jídel dle libosti a k tomu vždy bude podávaná rýže jako příloha. Můžete si například objednat talíř restovaného hovězího, vepřového, tofu, zeleniny, polévky dohromady. Fantazii se meze nekladou."},{"t":"p","x":"Toto je naprosto nejběžnější koncept stolování pro vietnamskou (ale i asijskou) kulturu a takto jí tradičně lidé doma. Každý má svou vlastní misku do které si libovolně nabírá jídlo ze stolu. Je to tzv. “sharing”"},{"t":"p","x":"umožňující - především ve více lidech - vyzkoušet mnoho jídel najednou."},{"t":"p","x":"Restaurace nabízející cơm se většinou nazývají “NHÀ HÀNG” nebo “QUÁN” + konkrétní název. Často na cedulích také najdete pouze název “CƠM”."},{"t":"p","x":"Slovník Jak si mám cơm správně objednat, když možných variant je mnoho a neumím vietnamsky? Žádný stres. Připravil jsem pro vás jednoduchý slovník základních surovin a přímo ukázku, jak si objednat."},{"t":"p","x":"Takto mohou vypadat konkrétní názvy jídel složené z druhu suroviny a způsobu přípravy. Je to jednoduché, že? :)"},{"t":"p","x":"Používejte ze začátku tyto tabulky jako slovník. Časem se naučíte si objednávat sami."},{"t":"p","x":"PRO TIP! Je také dobré se podívat, co jedí místní u vedlejších stolů a případně si obsluze ukázat, co chcete. Nemusíte se vůbec stydět. Místní budou potěšeni. Naopak se vám může stát, že budete pozváni k jejich vlastnímu stolu!"}]},{"h":"CƠM BÌNH DÂN","blocks":[{"t":"p","x":"Tzv. “lidová rýže” je nejlevnější způsob stravování, který funguje všude po Vietnamu především přes obědy. Jsou to doslova bufety, které navaří spoustu druhů jídel a vy si vyberete přesně to na co máte chuť a v jakém množství. Podává se jednoduše na talíř s rýží. Vždy se k tomu podává i malá miska vývaru, která se k jídlu přisrkuje nebo jí na konci. Vietnamci obecně jedí polévky až na konec, aby tím celé jídlo v žaludku “spláchli”."},{"t":"p","x":"Tyto bufetové talíře stojí mezi 20 - 40 tisíci VND. Levné, chutné, pestré, rychlé."},{"t":"p","x":"PRO TIP! Doporučuji jíst mezi 11. a 12. hodinou dopoledne pro největší čerstvost. “Restaurace” vždy navaří ráno a mají otevřeno, dokud jídlo nevyprodají. V pozdějších hodinách tak můžete často mít jídlo studené."},{"t":"p","x":"PHỞ, BÚN, MIẾN, MÌ, APOD."},{"t":"p","x":"Nudlové pokrmy podávané většinou v jedné velké misce s vývarem. Sem patří samozřejmě i nejznámější vietnamská polévka phở. Jsou to nudle s určitým druhem masa a zeleniny podle lokálního stylu přípravy."},{"t":"p","x":"Nejdůležitějším prvkem jídla je vždy kvalitní a chutný vývar!"},{"t":"p","x":"Tyto nudle jdou udělat i v “suché” verzi smažené s masem nebo zeleninou. Potom se budou jmenovat např. PHỞ XÀO, BÚN XÀO BÒ, atd."}]},{"h":"LẨU","blocks":[{"t":"p","x":"Tzv. “hot pot” je koncept, kdy dostanete plynovou nebo elektrickou plotýnku a na něm velký hrnec s vývarem. K tomu syrové suroviny dle druhu hotpotu a vlastního výběru. Např. syrové hovězí, kuřecí, mořské plody, nebo třeba vše dohromady. K tomu vždy mnoho čerstvé zeleniny, tofu, houby, nudle, apod. Vše si vaříte v hrnci sami a vše je tak absolutně čerstvé a uvařené dle vlastní chuti. Ke konci má vývar dokonalou chuť a sílu."},{"t":"p","x":"Toto je především velmi společenská záležitost, kterou Vietnamci jedí ve větších skupinách při různých slavnostnějších příležitostech. Často si u toho dlouze povídají a popijí. Díky tomu také jedí poměrně pomalu a u jednoho hrnce dokáží strávit i několik hodin! Dá se ale běžně jíst i ve dvou. Obecně počítejte s vyšší cenou oproti ostatním běžným jídlům."}]},{"h":"NƯỚNG","blocks":[{"t":"p","x":"Tzv. “grill” je stejný druh stolování, jako hotpot, akorát syrové suroviny nevaříte, ale grilujete na uhlí. Stejně delikatesní, jen jinak upravené."}]},{"h":"CƠM RANG (CƠM CHIÊN), MÌ XÀO","blocks":[{"t":"p","x":"Smažená rýže, smažené nudle. Velmi rychlá a jednoduchá jídla."},{"t":"p","x":"Především na cestách po horách severního Vietnamu na ně narazíte všude."},{"t":"p","x":"PRO TIP! V opuštěných oblastech především v horách se snažte obědvat kolem poledne a večeřet mezi 18. a 19. hodinou, kdy jedí i ostatní."},{"t":"p","x":"Později mohou restaurace zavřít a nebudete tak mít možnost se najíst."}]},{"h":"BÁNH MÌ","blocks":[{"t":"p","x":"Obecně známá vietnamská bageta plněná masem, paštikou, salámem, párkem, zeleninou, vajíčkem. Záleží vždy na konkrétní oblasti a místním stylu. Na severu jsou bagety velmi obyčejné a naopak ve středu a jihu plné a pestré. Všude však dobré. Jsou jistotou rychlé svačiny."}]},{"h":"CHÁO","blocks":[{"t":"p","x":"Hustá rýžová polévka. Spíše takový nákyp/kaše vařený z určitého druhu masa. Velmi tradiční pokrm, který se jí především jako “ranní startovač”"},{"t":"p","x":"dne. Vietnamci ho také jedí, když jsou nemocní."}]},{"h":"CHAY","blocks":[{"t":"p","x":"Na závěr jsem nezapomněl ani na vegetariány a vegany. Připravte se, že jídla ve Vietnamu nenajdete jen tak snadno a výběr zásadně omezenější."},{"t":"p","x":"Jako vegetariáni můžete jíst hodně ryby. Vůbec základem vietnamské kuchyně je rybí omáčka nước mắm, takže veganství je ještě těžší."},{"t":"p","x":"Pro vegetariány/vegany bude jídlo pravděpodobně velmi monotónní skládající se z rýže, nudlí, tofu a vařené zeleniny. Případně vajíčka a baget. Někdy je nejlepší si říct konkrétní suroviny a jak je chcete připravit."},{"t":"p","x":"Slovní spojení, že chcete jíst vegetariánsky a každý mu bude rozumět je:"},{"t":"p","x":"“ĂN CHAY”."}]}]},{"id":"ubytovani","title":"Ubytování ve Vietnamu","sub":"Základní dělení + slovník","src":"UBYTOVÁNÍ VE VIETNAMU.pdf","secs":[{"h":"Úvod","blocks":[{"t":"p","x":"Ubytování je ve Vietnamu dostupné v podstatě všude. Obecně se dá řící, že kdekoliv po Vietnamu se v dojezdové vzdálenosti v poloměru 50 km nachází minimálně malé okresní město, kde se nachází minimálně levná ubytovna."},{"t":"p","x":"Co se týče kvality, tak je škála služeb extrémně široká. Můžete spát ve opráskaném špinavém pokoji za 80 Kč/noc nebo super luxusním pětihvězdičkovém hotelu za několik tisíc za noc. Pokud máte malé zkušenosti s cestováním ve Vietnamu a JV Asii obecně, je nutné být buď připraven na všechno, nebo si ubytování vybírat chytře."}]},{"h":"ZÁKLADNÍ DĚLENÍ","blocks":[{"t":"p","x":"Ve Vietnamu existují 3 typy ubytování:"},{"t":"p","x":"V hotelech se vám dostane standardní úrovně služeb i vybavení, které byste očekávali v jakémkoliv jiném hotelu ve světě. Co se týče obecné úrovně kvality, tak samozřejmě je stále třeba myslet na to, že jste ve Vietnamu a JV Asii, avšak i levnější hotely jsou dostačující."},{"t":"p","x":"Na druhou stranu nhà nghỉ je koncept levnějších ubytoven všech různých úrovní s cenou 100-200 tisíc VND za pokoj. Najdete je doslova všude ve Vietnamu často i v totálně odlehlých městečkách a vesnicích a jsou to vyloženě rodinné byznysy. Majitelé jsou zároveň pracovníci a v objektu tak bydlí. Nhà nghỉ tak dokáží udělat vaší cestu po Vietnamu velmi levnou."},{"t":"p","x":"Homestay je koncept dostávající svému anglickému názvu. V obecné praxi je nejvíce najdete v horách Severního Vietnamu, kde je ve svých tradičních dřevěných domech na kůlech provozují místní etnické skupiny."},{"t":"p","x":"Nabízí tak velmi autentický zážitek a společně s levnou cenou zhruba 100 Kč/osoba/noc i velmi levným řešením. Neočekávejte však výrazný luxus."},{"t":"p","x":"Spát a jíst budete více méně právě jako místní a v drtivé většině ve velkých společných místnostech na matracích oddělených plentami před dalšími zákazníky."},{"t":"p","x":"PRO TIP! Obecně vybírejte ubytování “očima”. Nhà nghỉ jsou někdy lepší, než hotely, ale někdy to jsou opravdu “špíny”. Kvalita vždy odpovídá ceně. Je naprosto běžné přijít na recepci, zeptat se na pokoj a podívat se do něho, než se ubytujete. Je takhle možné projíždět lokalitu, ve které chcete přespat, a obhlédnout více ubytování, než si vyberete vámi preferovaný."},{"t":"table","cols":["Typ","Co to je"],"rows":[["KHÁCH SẠN","hotel"],["NHÀ NGHỈ","motel / ubytovna"],["HOMESTAY","ubytování doma, většinou u etnických menšin v severním Vietnamu"]]}]},{"h":"ZÁKLADNÍ FRÁZE","blocks":[{"t":"p","x":"Standartně je ve Vietnamu check-in v 14:00 hod a check-out ve 12:00 hod."},{"t":"p","x":"Ve větších městech nebo turistických oblastech je normální vyhledávat ubytování na internetu. Ve velkých městech při vyhledávání ubytování nezapomeňte zadat do parametru podmínku parkování přímo v ubytování! Např. v Hanoji ve Staré čtvrti spoustu hotelů tuto možnost nemá."},{"t":"p","x":"Pokud budete někde mimo tyto oblasti, tak jednoduše do Google mapy zadejte khách sạn, nhà nghỉ nebo homestay a něco vám to v okolí určitě najde."},{"t":"p","x":"V případě, že máte v plánu se ubytovat na místě, které nejde zarezervovat online, ale pouze např. po telefonu, tak doporučuji poprosit na recepci aktuálního ubytování, aby Vám tam zavolali a pomohli vše domluvit."},{"t":"table","cols":["Česky","Vietnamsky"],"rows":[["Máte volný pokoj?","CÒN CÓ PHÒNG KHÔNG?"],["Pokoj s manželskou postelí (double room)","PHÒNG ĐƠN"],["Pokoj s dvěma oddělenými postelemi (twin room)","PHÒNG ĐÔI"],["Kolik stojí jedna noc?","MỘT ĐÊM GIÁ BAO NHIÊU?"],["1 noc","MỘT ĐÊM"],["2 noci","HAI ĐÊM"],["Chci se podívat na pokoj.","CHO TÔI XEM PHÒNG"]]}]}]},{"id":"opravy","title":"Opravy motorky","sub":"Jak vyřešit nejběžnější defekty + slovník","src":"OPRAVY MOTORKY.pdf","secs":[{"h":"Úvod","blocks":[{"t":"p","x":"Stalo se vám něco s motorkou? Naštěstí jste ve Vietnamu - zemi, kde každý jezdí na skútru/motorce a tím pádem vám v podstatě všude drtivou většinu závad opraví."},{"t":"p","x":"Servisy poznáte podle nápisů na ceduli SỬA XE (servis vozidel) nebo VÁ LỐP (lepení píchlých gum). Nejlíp ale vždy podle vzhledu."},{"t":"p","x":"Nejběžnější opravou, kterou budete řešit, bude píchlá guma. Pokud se vám to stane, dostaňte se do nejbližší vesnice, kde určitě bude někdo, kdo vám kolo opraví. Jeďte každopádně pomalu a co nejméně zatěžujte píchlé kolo, aby se nezkřivilo. Ve většině případů píchnete kolo zadní."},{"t":"p","x":"Pokud nejbližší servis bude opravdu daleko, je možné vyslat parťáka s fotkou a slovníkem a zkusit se domluvit, aby opravář nasedl na motorku a dojel s vámi na místo závady. Ne každý je ale svolný zavřít servis a bude chtít také peníze navíc za cestu."}]},{"h":"ZÁKLADNÍ FRÁZE","blocks":[{"t":"p","x":"Další věci, které budete moci řešit:"},{"t":"p","x":"Honda Blade 110cc má pneumatiky s duší. Duše se dá zalepit za cca 30 tisíc VND, případně koupit nová za cca 80 tisíc VND. Vše včetně práce."},{"t":"table","cols":["Česky","Vietnamsky"],"rows":[["Duše","RUỘT"],["Pneumatika","LỐP"],["Opravit píchlé kolo","VÁ LỐP"],["Zalepit duši","VÁ RUỘT"],["Vyměnit duši","THAY RUỘT"],["Nafouknout pneumatiku","BƠM LỐP"],["Utáhnout řetěz","TĂNG DÂY XÍCH / TĂNG DÂY SÊN"],["Utáhnout brzdu","TĂNG PHANH / TĂNG DÂY THẮNG"],["Vyměnit olej","THAY DẦU"],["Zkontrolovat motorku","KIỂM TRA XE"]]}]}]},{"id":"slovnik","title":"Slovník","sub":"Základní vietnamská slovíčka a fráze + výslovnost","src":"SLOVNÍK.pdf","secs":[{"h":"Úvod","blocks":[{"t":"p","x":"Vietnamština je fonetický jazyk. Používá 6 různých přízvuku, které navíc kombinuje dohromady. Vietnamci tak mají na výslovnost velmi citlivý sluch a vyslovovat opravdu správně je pro začátečníky běh na dlouhou trať."},{"t":"p","x":"V této příručce najdete především základní fráze, které během cesty budete moci velmi pravděpodobně použít. Oproti ostatním příručkám přidávám i výslovnosti pro ty, kteří se dané fráze chtějí naučit říkat."},{"t":"p","x":"V praxi můžete nejdříve daná slova ukazovat a poprosit druhou stranu, aby je vyslovovala správně. S pomocí psané výslovnosti si je tak budete moci zamemorovat a časem naučit říkat."},{"t":"p","x":"Vietnam má opravdu mnoho dialektů i různorodou slovní zásobu napříč provinciemi. Co se např. naučíte vyslovovat na jihu Vám na severu může často být k ničemu."}]},{"h":"ZÁKLADNÍ FRÁZE","blocks":[{"t":"table","cols":["Česky","Vietnamsky","Výslovnost"],"rows":[["Dobrý den","XIN CHÀO","si:n čao"],["Na shledanou","TẠM BIẾT","tam bjet"],["Děkuji","CẢM ƠN","ka:m o:n"],["Není zač","KHÔNG CÓ GÌ","chong kó zi:"],["Omlouvám se","XIN LỖI","si:n lój"],["Ano","VÂNG","væng"],["Ne","KHÔNG","choung"],["Já","TÔI","to:j"],["Vy","BẠN","ba:n"],["Muž","NAM","na:m"],["Žena","NỮ","nu:"],["Jak se máš?","BẠN CÓ KHOẺ KHÔNG?","ba:n kó chœ chong?"],["Já se mám dobře","TÔI KHOẺ","to:j chœ"],["Jak se jmenuješ?","TÊN BẠN LÀ GÌ?","te:n ba:n la zi?"],["Moje jméno je…","TÊN TÔI LÀ…","te:n to:j la…"],["Kolik ti je let?","BẠN BAO NHIÊU TUỔI?","ba:n ba:u ňjeu tuo:j?"],["Mně je… let","TÔI… TUỔI","to:j… tuo:j"],["Česká republika","CỘNG HOÀ SÉC","kong hoa sék"],["Jsem Čech","TÔI LÀ NGƯỜI SÉC","to:j la nguoj sék"],["Evropa","CHÂU ÂU","ťou ou"],["Zaplatit","TÍNH TIỀN","tý:ng tjen"]]}]},{"h":"ČÍSLOVKY","blocks":[{"t":"table","cols":["Česky","Vietnamsky","Výslovnost"],"rows":[["Jedna","MỘT","mot"],["Dva","HAI","ha:j"],["Tři","BA","ba:"],["Čtyři","BỐN","bó:n"],["Pět","NĂM","nam"],["Šest","SÁU","sá:u"],["Sedm","BẢY","baj"],["Osm","TÁM","tá:m"],["Devět","CHÍN","tí:n"],["Deset","MƯỜI","mœj"],["Jedenáct","MƯỜI MỘT","mœj mot"],["Dvacet jedna","HAI MƯƠI MỘT","ha:j mœj mot"],["Třicet jedna","BA MƯƠI MỘT","ba: mœj mot"],["Sto","MỘT TRĂM","mot čam"],["Dvě stě","HAI TRĂM","ha:j čam"],["Jeden tisíc","MỘT NGHÌN","mot ngi:n"]]}]},{"h":"OSTATNÍ","blocks":[{"t":"table","cols":["Česky","Vietnamsky","Výslovnost"],"rows":[["Benzín","XĂNG","sang"],["Benzínová pumpa","CÂY XĂNG","kej sang"],["Plnou (nádrž)","ĐẦY","dej"],["Nemocnice","BỆNH VIỆN","beng vjen"],["Pohotovost","CẤP CỨU","kap kjů"],["Jsem vegetarián","TÔI ĂN CHAY","to:j an čaj"],["Bez cukru","KHÔNG ĐƯỜNG","chong dœng"],["Vyprat oblečení","GIẶT QUẦN ÁO","zat kuon áu"]]}]}]}],"packing":[{"h":"Základní Věci","items":["Pas","Kopie pasu pro ubytování","Vytisknuté e-vízum","Platební karta","Hotovost v USD/VND","50l nepromokavý duffle bag nebo krosna s pláštěnkou (krosna se vozí přivázaná gumicuky za zády na sedle spolujezdce; pláštěnka je velmi důležitá kvůli dešti a také prachu)"]},{"h":"Oblečení","items":["4x tričko","1x mikina","2x kraťasy","1x džíny","1x plavky","5x spodní prádlo","2x dlouhé teplé ponožky","4x kotníkové ponožky","1x boty (nemusíte mít vyloženě speciální obuv, stačí trekové nízké boty nebo pevnější tenisky)","1x žabky/sandále","1x malý rychle schnoucí ručník (na ubytování vždy je, ale 1 malý pro jistotu nebo na přírodní koupání)","Termo komplet (pro jistotu)"]},{"h":"Vybavení Na Motorku","items":["1x neprofukavá bunda na motorku (nemusí být nutně nepromokavá, na déšť si pořiďte pončo nebo komplet do deště)","Košile nebo triko s dlouhým rukávem proti slunci (je to mnohem praktičtější, než se neustále mazat a pálit se na silném sluníčku, které opravdu hodně pálí. Na silnicích je často také spoustu prachu, který se lepí na kůži. Mimochodem to funguje i proti nerovnoměrnému opálení :-))","1x dlouhé sportovní kalhoty na motorku","1x rukavice na skútr/motorku","Šátek nebo tunel na uvázání přes pusu kvůli prachu, smogu a hmyzu","Sluneční brýle (primárně na skútr/motorku)","Čiré/zesvětlovací brýle na ježdění za horšího světla nebo ve tmě (možné snadno koupit ve Vietnamu)","Pončo nebo nepromokavý komplet na skútr/motorku (možné koupit snadno ve Vietnamu)","Nepromokavé návleky na boty (i když se to nezdá, tak kvalitní návleky na boty se ve Vietnamu shání těžko a mnoho lidí jezdí v igelitových taškách omotaných kolem kotníků…)"]},{"h":"Zdraví","items":["Kompletní osobní hygiena","Opalovací krém, případně krém po opalování pokud se snadno spálíte, protože ten se ve Vietnamu shání těžko. Krém nepodceňte, na sluníčku se budete mazat pořád!","Repelent proti komárům (ozkoušenou mám značku Predátor z DM, nebo prostě s co největším % obsahu ochranné látky DEET)","Lékárnička s první pomocí (především na odřeniny - dezinfekce, polštářky, obvazy, náplasti, Betadine, pinzeta, kalciová mast, Fenistil gel, Panthenol)","Léky dle potřeby - vemte si něco na střevní potíže s čím máte osobní zkušenosti","Cca 1,5-2l slivovice v pet lahvi - funguje jako dezinfekce a u večeře po dni na cestě se bude pít dobře. :-) Z tvrdého alkoholu je ve","Vietnamu nejdostupnější vodka pálená z rýže, která má jenom 29,5% a není vůbec dobrá. Vietnamský běžně dostupný alkohol obecně není moc dobrý a silnější západní se mimo velká města shání těžko)","Špunty do uší např. do hotelu kde může být velký ruch z ulice (autobusy, náklaďáky, zvířata, karaoke :-))"]},{"h":"Ostatní","items":["Foťák","Nabíječky na elektroniku (ve Vietnamu jsou zásuvky stejné jako v ČR)","Power banka (možné nabíjení telefonu s navigací během cesty)","Čelovka","Kapesní nůž","Kartáček/sada na čištění bot (od neustálého prachu nebo třeba bahna po dešti)","Malý látkový batoh/ledvinka (je dobré ho mít, abyste měli na procházky nebo večer v čem nosit doklady a peníze, když budete mít všechny věci na ubytování)"]}]}</script>
<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById("vn26data").textContent);
const DAYS = D.days; const KML = D.kml; const MIDS = D.mids; const STAY = D.stay_links; const STAYS = D.stays||[]; const GAL = D.gallery||{};
const CATS = [['priroda','Příroda'],['kultura','Kultura'],['cesta','Zajímavá cesta / místo / oblast'],['aktivity','Aktivity'],['jidlo','Jídlo a pití'],['ubytovani','Ubytování'],['ostatni','Ostatní orientační body']];
const PHASE = {mesta:'Města',hory:'Hory',more:'Moře'};
const DEST = {}; (D.overall.pois||[]).forEach(p=>{ if(p.c==='destinace') DEST[p.n]=p; });
DEST['Hà Nội'] = DEST['Hanoj']; DEST['Praha'] = null;
const TRIP_START = new Date(2026,9,11);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtVND = v => v==null ? '—' : (Math.round(v/1000)).toLocaleString('cs-CZ') + ' tis.';
const fmtFull = v => v==null ? '—' : v.toLocaleString('cs-CZ') + ' VND';
const ICONS = {
  gmaps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.1 7-12a7 7 0 1 0-14 0c0 4.9 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>',
  read:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l6 2 6-2v14l-6 2-6-2-6 2V6z"/><path d="M9 4v14M15 6v14"/></svg>'
};
const gmapsUrl = (lat,lng) => `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
const gnavUrl = (lat,lng) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
const wazeUrl = (lat,lng) => `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;
const wazeApp = (lat,lng) => `waze://?ll=${lat},${lng}&navigate=yes`;
function openWaze(lat,lng){ const t=Date.now(); const fb=setTimeout(()=>{ if(!document.hidden && Date.now()-t<2500) window.open(wazeUrl(lat,lng),'_blank'); },1600); try{ window.location.href = wazeApp(lat,lng); }catch(e){ clearTimeout(fb); window.open(wazeUrl(lat,lng),'_blank'); } }
document.addEventListener('click', e=>{ const a=e.target.closest('a[data-waze]'); if(!a) return; e.preventDefault(); const [la,ln]=a.dataset.waze.split(','); openWaze(la,ln); });
const mymapsUrl = n => `https://www.google.com/maps/d/viewer?mid=${MIDS[String(n)]}`;

// ---------- toast & clipboard ----------
let toastT; function toast(msg, ms){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),ms||2600); }
async function copy(text, what){ try{ await navigator.clipboard.writeText(text); toast('Zkopírováno: '+text+' – vlož do hledání ve Waze'); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Zkopírováno: '+text);}catch(err){ toast('Nepodařilo se zkopírovat, souřadnice: '+text);} ta.remove(); } }

// ---------- sheet ----------
function openSheet(p, dayN){
  const root=document.getElementById('sheetroot');
  const catName = (CATS.find(c=>c[0]===p.c)||['','Bod'])[1];
  root.innerHTML = `<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-label="${esc(p.n)}">
    <div class="h"><span class="dot" style="--c:var(--c-${p.c||'ostatni'})"></span><div><div class="nm">${esc(p.n)}</div><div class="vn">${esc(catName)}${p.vn?' · '+esc(p.vn):''}</div><div class="ll num">${p.lat}, ${p.lng}</div></div><button class="cl" data-close aria-label="Zavřít">×</button></div>
    <div class="actions">
      <a class="btn primary" href="${gnavUrl(p.lat,p.lng)}" target="_blank" rel="noopener">${ICONS.nav} Navigovat (Google)</a>
      <a class="btn" href="${wazeUrl(p.lat,p.lng)}" data-waze="${String(p.lat)+','+String(p.lng)}" target="_blank" rel="noopener"><b class="w">W</b> Otevřít ve Waze</a>
      <button class="btn" data-copy="${p.lat},${p.lng}">${ICONS.copy} Kopírovat souřadnice</button>
      <a class="btn" href="${gmapsUrl(p.lat,p.lng)}" target="_blank" rel="noopener">${ICONS.gmaps} Ukázat v Mapách</a>
      ${dayN?`<a class="btn wide" href="${mymapsUrl(dayN)}" target="_blank" rel="noopener">${ICONS.map} Otevřít Vaškovu mapu ${dayN}. dne</a>`:''}
    </div></div>`;
  root.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>root.innerHTML=''));
  root.querySelector('[data-copy]').addEventListener('click',e=>copy(e.currentTarget.dataset.copy));
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('sheetroot').innerHTML=''; });

// ---------- mapa (SVG) ----------
const BB = {minLng:103.75, maxLng:107.35, minLat:20.55, maxLat:23.05};
const W=1000, KX = W/(BB.maxLng-BB.minLng)*Math.cos(21.8*Math.PI/180), KY = W/(BB.maxLng-BB.minLng);
const H = Math.round((BB.maxLat-BB.minLat)*KY);
const px = lng => ((lng-BB.minLng)*KX + (W-(BB.maxLng-BB.minLng)*KX)/2).toFixed(1);
const py = lat => ((BB.maxLat-lat)*KY).toFixed(1);
const pathOf = pts => 'M'+pts.map(p=>px(p[0])+' '+py(p[1])).join('L');
function allDayRoutes(){ const out=[]; for(let n=1;n<=24;n++){ const k=KML[String(n)]; if(!k||n===2||n>=23) continue; (k.routes||[]).forEach((r,i)=>out.push({n,i,r})); } return out; }
const ROUTES = allDayRoutes();
function mapSVG(opts){
  const cur = opts.day; const big = !!opts.big;
  let s = `<svg class="${big?'bigmap':'mini'}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa trasy">`;
  // rámeček Vietnam/Čína orientačně: jen obrys hranice řeky? Nekreslíme; pouze trasy.
  ROUTES.forEach(x=>{ const on = x.n===cur; if(on) return; s+=`<path d="${pathOf(x.r.pts)}" fill="none" stroke="${big?'var(--muted)':'var(--line)'}" stroke-opacity="${big?.55:1}" stroke-width="${big?3:4}" stroke-linejoin="round" stroke-linecap="round"/>`; });
  ROUTES.forEach(x=>{ if(x.n!==cur) return; s+=`<path d="${pathOf(x.r.pts)}" fill="none" stroke="var(--accent)" stroke-width="${x.i===0?9:6}" stroke-opacity="${x.i===0?1:.6}" stroke-linejoin="round" stroke-linecap="round" ${x.i>0?'stroke-dasharray="14 10"':''}/>`; });
  // destinace
  const seen={};
  DAYS.forEach(d=>{ const t=DEST[d.to]; if(!t||seen[d.to]) return; seen[d.to]=1; const on = (cur && (d.to===DAYS[cur-1].to||d.to===DAYS[cur-1].from)); const r = big?11:14;
    s+=`<g class="dst" data-day="${d.n}" style="cursor:pointer"><circle cx="${px(t.lng)}" cy="${py(t.lat)}" r="${r}" fill="${on?'var(--accent)':'var(--card)'}" stroke="${on?'var(--accent)':'var(--ink)'}" stroke-width="3"/>`;
    if(big){ const lx=+px(t.lng), ly=+py(t.lat); const right = t.lng<106.4; s+=`<text x="${right?lx+16:lx-16}" y="${ly+5}" text-anchor="${right?'start':'end'}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="600" font-size="24" fill="var(--ink)">${esc(t.n==='Hanoj'?'Hà Nội':t.n)}</text>`; }
    s+='</g>'; });
  s+='</svg>'; return s;
}


function dayMapSVG(n, pois){
  const k = KML[String(n)]||{pois:[],routes:[]}; const routes=k.routes||[];
  let pts=[]; routes.forEach(r=>r.pts.forEach(p=>pts.push([p[0],p[1]]))); pois.forEach(p=>pts.push([p.lng,p.lat]));
  const d=DAYS[n-1]; const dest=DEST[d.to]; if(dest) pts.push([dest.lng,dest.lat]);
  if(pts.length<2) return '';
  let minX=Math.min(...pts.map(p=>p[0])), maxX=Math.max(...pts.map(p=>p[0])), minY=Math.min(...pts.map(p=>p[1])), maxY=Math.max(...pts.map(p=>p[1]));
  const cosL=Math.cos((minY+maxY)/2*Math.PI/180);
  let w=(maxX-minX)*cosL, hgt=(maxY-minY); const W=1000; const pad=0.09;
  if(w<0.02) w=0.02; if(hgt<0.02) hgt=0.02;
  const ratio=Math.max(0.55, Math.min(1.1, hgt/w)); const H=Math.round(W*ratio);
  const sx=W*(1-2*pad)/w, sy=H*(1-2*pad)/hgt, sc=Math.min(sx,sy);
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const X=lng=>(W/2+(lng-cx)*cosL*sc).toFixed(1), Y=lat=>(H/2-(lat-cy)*sc).toFixed(1);
  let s=`<svg class="daymap" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa dne ${n}">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--soft)"/>`;
  routes.forEach((r,i)=>{ s+=`<path d="M${r.pts.map(p=>X(p[0])+' '+Y(p[1])).join('L')}" fill="none" stroke="var(--accent)" stroke-width="${i===0?7:5}" stroke-opacity="${i===0?1:.55}" ${i>0?'stroke-dasharray="14 10"':''} stroke-linejoin="round" stroke-linecap="round"/>`; });
  const label = pois.length<=14;

  pois.map((p,i)=>({p,i})).sort((a,b)=>order.indexOf(a.p.c)-order.indexOf(b.p.c)).forEach(x=>{ const p=x.p; const main=(d.pois_pdf||[]).some(q=>matchPoi(q.n,[p]));
    s+=`<g class="pt" data-p="${x.i}"><circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="${main?17:11}" fill="var(--c-${p.c})" stroke="var(--card)" stroke-width="3"/>`;
    if(label||main) s+=`<text x="${+X(p.lng)+20}" y="${+Y(p.lat)+10}">${esc(p.n.length>34?p.n.slice(0,32)+'…':p.n)}</text>`;
    s+='</g>'; });
  if(dest){ s+=`<g><circle cx="${X(dest.lng)}" cy="${Y(dest.lat)}" r="15" fill="var(--ink)" stroke="var(--card)" stroke-width="3"/><text x="${+X(dest.lng)+20}" y="${+Y(dest.lat)-16}" font-weight="700">${esc(d.to)}</text></g>`; }
  s+='</svg>';
  return s;
}

function sunTimes(lat,lng,date){
  const rad=Math.PI/180; const JD=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000+2440587.5;
  const n=Math.floor(JD-2451545+0.0008); const Js=n-lng/360;
  const M=((357.5291+0.98560028*Js)%360+360)%360; const C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const L=((M+C+180+102.9372)%360+360)%360; const Jt=2451545+Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
  const dec=Math.asin(Math.sin(L*rad)*Math.sin(23.4397*rad));
  const cosw=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
  const w=Math.acos(Math.max(-1,Math.min(1,cosw)))/rad; const toMs=J=>(J-2440587.5)*86400000;
  return {rise:new Date(toMs(Jt-w/360)), set:new Date(toMs(Jt+w/360))};
}
const fmtVN=t=>t.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Ho_Chi_Minh'});

  const dark=new Date(st.set.getTime()+25*60000); const dep=mins?new Date(st.set.getTime()-(45+mins*1.5)*60000):null; return {d,dest,st,dark,dep,mins}; }

let numSeqStop=false;
function speakSeq(items, rate, i){ if(i===undefined){ i=0; numSeqStop=false; if(R.on&&!R.paused) pauseReading(); try{ speechSynthesis.cancel(); }catch(e){} }
  if(numSeqStop||i>=items.length){ document.querySelectorAll('#nums button.on').forEach(b=>b.classList.remove('on')); return; }
  const u=new SpeechSynthesisUtterance(String(items[i]).toLowerCase()); u.lang='vi-VN'; u.rate=rate; const v=viVoice(); if(v&&!/iPhone|iPad/.test(navigator.userAgent)) u.voice=v; window.__vu=u;
  document.querySelectorAll('#nums button').forEach(b=>b.classList.toggle('on', +b.dataset.num===i+1));
  u.onend=()=>setTimeout(()=>speakSeq(items,rate,i+1), rate<0.8?500:250); u.onerror=()=>{ numSeqStop=true; document.querySelectorAll('#nums button.on').forEach(b=>b.classList.remove('on')); };
  setTimeout(()=>speechSynthesis.speak(u), i===0?150:0);
}
const NG={mode:'',qs:[],i:0,score:0,locked:false};

// sdílený stav: Google Apps Script pod Vítovým účtem (slučuje podle času, novější vyhrává); místní kopie v localStorage
const SYNC_URL='https://script.google.com/macros/s/AKfycbyTZQuuzFEMiK4MU4g3l1ecgAicSQE47unchdOJdQofvqn5182F1GX-DO54OVzuFtBf/exec';
let TDONE={}; try{ const raw=JSON.parse(localStorage.getItem('vn26.todo2')||'{}'); TDONE=raw; }catch(e){}
try{ const old=JSON.parse(localStorage.getItem('vn26.todo')||'null'); if(old){ for(const k in old){ if(!TDONE[k]) TDONE[k]={d:!!old[k],at:Date.now()-1}; } localStorage.removeItem('vn26.todo'); } }catch(e){}
const isDone=id=>!!(TDONE[id]&&TDONE[id].d);
let PENDING={}; try{ PENDING=JSON.parse(localStorage.getItem('vn26.todopend')||'{}'); }catch(e){}
const SYNC={state:'', at:0};
function saveLocal(){ try{ localStorage.setItem('vn26.todo2',JSON.stringify(TDONE)); localStorage.setItem('vn26.todopend',JSON.stringify(PENDING)); }catch(e){} }
function mergeIn(items){ let changed=false; for(const k in (items||{})){ const inc=items[k]; if(!inc||typeof inc!=='object') continue; const c=TDONE[k]; if(!c||(inc.at||0)>(c.at||0)){ TDONE[k]={d:!!inc.d,at:inc.at||0}; changed=true; } } return changed; }
function syncStatus(s){ SYNC.state=s; SYNC.at=Date.now(); document.querySelectorAll('[data-syncstate]').forEach(el=>{ el.textContent = s==='ok'?'sdíleno se všemi · aktuální':s==='busy'?'synchronizuji…':s==='off'?'offline – uloženo v telefonu, odešle se po připojení':'server nedostupný – uloženo v telefonu'; el.dataset.st=s; }); }
async function syncTodo(){
  if(!navigator.onLine){ syncStatus('off'); return; }
  syncStatus('busy');
  try{
    let r, data;
    if(Object.keys(PENDING).length){ r=await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({items:PENDING}),redirect:'follow'}); }
    else r=await fetch(SYNC_URL,{redirect:'follow'});
    if(!r.ok) throw new Error(r.status);
    data=await r.json(); if(!data||typeof data!=='object') throw new Error('bad');
    PENDING={}; const changed=mergeIn(data.items); saveLocal(); syncStatus('ok');
    if(changed) refreshTodoUI();

const R = {q:[], i:0, on:false, paused:false, rate:1, day:0, state:'', paras:0};
try{ const r=+localStorage.getItem('vn26.rate'); if(r>=0.5&&r<=2) R.rate=r; }catch(e){}
function csVoice(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/^cs/i.test(v.lang)); return vs.find(v=>!/compact/i.test(v.name)&&/zuzana|iveta/i.test(v.name)) || vs[0] || null; }catch(e){ return null; } }
function speakText(s){ return s.replace(/\bkm\b/g,'kilometrů').replace(/(\d)\s?h\s(\d+)\s?m\b/g,'$1 hodin $2 minut').replace(/\bVND\b/g,'dongů').replace(/→/g,' do ').replace(/[„“"]/g,'').replace(/\s+/g,' ').trim(); }
function dayChunks(n){
  // čte se jen sekce Program; dlouhé odstavce se dělí po větách na úseky do ~250 znaků (Safari na iOS delší úseky utíná)
  const d=DAYS[n-1]; const out=[];
  out.push({t:speakText(`${d.n}. den. ${d.theme}.`), p:0});
  d.program.forEach((para,i)=>{ (para.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[para]).reduce((acc,s)=>{ const c=acc[acc.length-1]; if(c&&(c+s).length<250) acc[acc.length-1]=c+s; else acc.push(s); return acc; },[]).forEach(s=>{ const x=speakText(s); if(x) out.push({t:x, p:i+1}); }); });
  R.paras=d.program.length; return out;
}
function playerUI(){
  let el=document.querySelector('.player');

    el.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;

      else if(b.dataset.a==='next'){ speechSynthesis.cancel(); }
      else if(b.dataset.a==='rate'){ R.rate = R.rate>=1.4?0.8:Math.round((R.rate+0.2)*10)/10; try{localStorage.setItem('vn26.rate',R.rate);}catch(e){} R.i=Math.max(0,R.i-1); speechSynthesis.cancel(); } }); }

function speakNext(){
  if(!R.on||R.paused) return;
  if(R.i>=R.q.length){ stopReading(); return; }
  const c=R.q[R.i++]; const u=new SpeechSynthesisUtterance(c.t); u.lang='cs-CZ'; if(R.rate!==1) u.rate=R.rate;
  const v=csVoice(); const ios=/iPhone|iPad/.test(navigator.userAgent);
  if(v && (!ios || R.attempt>=2)) u.voice=v; // 1. pokus na iOS jen s jazykem, 2. pokus s výslovným hlasem
  R.u=u; // referenci držíme kvůli GC v Chrome
  const log=(m)=>{ R.log.push(new Date().toTimeString().slice(0,8)+' '+m); if(R.log.length>40) R.log.shift(); };
  log(`speak #${R.i} pokus ${R.attempt} voice=${u.voice?u.voice.name:'-'} lang=${u.lang} len=${c.t.length}`);
  u.onstart=()=>{ log('onstart'); R.started=true; R.state='Čte se'; playerUI(); if(/iPhone|iPad/.test(navigator.userAgent)){ let seen=false; try{ seen=localStorage.getItem('vn26.silenthint')==='1'; }catch(e){} if(!seen){ try{ localStorage.setItem('vn26.silenthint','1'); }catch(e){} toast('Nic neslyšíš? Vypni tichý režim (přeškrtnutý zvoneček v Ovládacím centru nebo přepínač na boku) a přidej hlasitost.', 9000); } } };
  u.onend=()=>{ log('onend'); if(R.on&&!R.paused) speakNext(); };
  u.onerror=e=>{ log('onerror '+e.error); if(e.error==='interrupted'||e.error==='canceled'){ if(R.on&&!R.paused) setTimeout(speakNext,50); } else { R.state='Chyba hlasu: '+e.error; playerUI(); } };
  document.querySelectorAll('.speaking').forEach(x=>x.classList.remove('speaking'));
  if(c.p){ const p=document.querySelectorAll('#day .prose')[0]?.querySelectorAll('p')[c.p-1]; if(p) p.classList.add('speaking'); }

function readDay(n){
  if(!('speechSynthesis' in window)){ toast('Tento prohlížeč neumí předčítat.'); return; }
  if(R.on&&R.day===n){ if(R.paused) resumeReading(); else pauseReading(); return; }
  if(R.on) stopReading();
  R.q=dayChunks(n); R.i=0; R.on=true; R.paused=false; R.day=n; R.state=''; R.attempt=1; R.started=false; R.log=R.log||[];
  speakNext(); // musí proběhnout přímo v klepnutí (iOS)
  setTimeout(()=>{ if(R.on&&!R.paused&&!R.started&&R.attempt===1){ R.attempt=2; R.i=0; R.log.push('2. pokus: cancel + výslovný hlas'); try{ speechSynthesis.cancel(); }catch(e){} setTimeout(()=>{ if(R.on&&!R.started) speakNext(); },150); } }, 3000);

function pauseReading(){ if(!R.on) return; R.paused=true; R.i=Math.max(0,R.i-1); speechSynthesis.cancel(); playerUI(); }
function resumeReading(){ if(!R.on) return; R.paused=false; R.state=''; playerUI(); speakNext(); }

function matchPoi(name, pois){ const nn=name.toLowerCase(); let best=null; pois.forEach(p=>{ const pn=p.n.toLowerCase(); if(pn===nn||nn.includes(pn)&&pn.length>5||pn.includes(nn)&&nn.length>5){ if(!best||p.n.length>best.n.length) best=p; } }); return best; }

function fmtIso(iso){ const [y,m,d]=iso.split('-').map(Number); return d+'. '+m+'.'; }
function fmtKc(n){ return Math.round(n).toLocaleString('cs-CZ').replace(/ /g,' ')+' Kč'; }
function satUrl(lat,lng){ const dx=0.0046, dy=0.0021; return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=${(lng-dx).toFixed(5)},${(lat-dy).toFixed(5)},${(lng+dx).toFixed(5)},${(lat+dy).toFixed(5)}&bboxSR=4326&size=480,210&format=jpg&f=image`; }
const VASEK_LIKES = /nejoblíben|vřele|skvěl|nejlep|doporuč|oblíben|krásn|nádhern|top|luxus/i;
function stayRank(s){ let r=0; if(s.closed) r-=100; if(s.avail==='gone') r-=30; if(s.avail==='ok') r+=30; if(s.avail==='full') r-=15; if(s.avail==='unknown') r+=8;
  if(s.price4_own) r+=12; else if(s.twin) r+=8; if(s.score) r+=parseFloat(String(s.score).replace(',','.'))*3; if(VASEK_LIKES.test(s.note||'')) r+=12; if(s.swim) r+=3;
  if(s.price4){ const pp=s.price4/s.nights/4; if(pp>2500) r-=40; else if(pp>1200) r-=20; else if(pp>700) r-=8; else if(pp<250) r+=4; }

function staysForDay(n){ return STAYS.filter(s=>s.days.includes(n)).sort((a,b)=>stayRank(b)-stayRank(a)); }
function stayTop(list){ return list.find(s=>s.avail==='ok'&&(s.price4_own||s.twin)) || list.find(s=>s.avail==='ok') || list.find(s=>!s.closed&&s.avail!=='gone'&&s.avail!=='full') || null; }
function stayWhy(s){ const w=[]; if(s.src==='claude') w.push('tip navíc, ne od Vaška'); if(s.avail==='ok') w.push('volné na náš termín'); if(s.price4_own) w.push('každý vlastní postel'); else if(s.twin) w.push('oddělené postele'); if(s.score) w.push('Booking '+s.score); if(VASEK_LIKES.test(s.note||'')) w.push('Vaškův favorit'); if(s.swim) w.push(s.swim); return w.length?' – '+w.join(', ')+'.':'.'; }
function stayBookingUrl(s){ return `https://www.booking.com/hotel/vn/${s.bk}.cs.html?checkin=${s.ci}&checkout=${s.co}&group_adults=4&no_rooms=2&group_children=0&selected_currency=CZK`; }
function stayAgodaUrl(s){ if(s.ag_url) return s.ag_url; return `https://www.agoda.com/partners/partnersearch.aspx?pcs=1&cid=1828797&hid=${s.ag}&checkIn=${s.ci}&checkOut=${s.co}&adults=4&rooms=2`; }
function stayFbUrl(s){ return /^\d+$/.test(s.fb) ? 'https://www.facebook.com/profile.php?id='+s.fb : 'https://www.facebook.com/'+s.fb; }
function stayMapUrl(s){ if(s.approx) return 'https://www.google.com/maps/@'+s.lat+','+s.lng+',15z'; return 'https://www.google.com/maps/search/'+encodeURIComponent(s.name)+'/@'+s.lat+','+s.lng+',16z'; }
const SWIM_T = {'bazén':'Bazén','řeka':'Řeka – koupání','horké prameny':'Horké prameny','pláž':'Pláž'};
function stayStatus(s){ if(s.closed) return ['bad','Zavřeno']; if(s.src==='airbnb') return ['ok',`Airbnb: volné (${fmtIso(s.ci)}–${fmtIso(s.co)})`]; if(s.avail==='ok') return ['ok',`Volné pro 4 (${fmtIso(s.ci)}–${fmtIso(s.co)})`]; if(s.avail==='full') return ['bad','Na náš termín plné (Booking)']; if(s.avail==='gone') return ['warn','Booking stránka zmizela'];

function stayBeds(s){ if(s.src==='airbnb'&&s.beds&&s.beds.length) return ['', 'podle Airbnb '+s.beds[0].split('·')[0].trim()]; if(s.price4_own) return ['ok','Každý vlastní postel']; if(s.twin) return ['ok','Oddělené postele']; if(s.rooms&&s.rooms.length) return ['warn','Jen manželské postele']; return null; }

function stayPrice(s){ if(!s.price4 && !s.price_min) return ''; let h='<div class="price">';

  return h+'</div>'; }
function dCz(iso){ const [y,m,d]=iso.split('-'); return `${+d}. ${+m}. ${y}`; }

function stayMsg(s){ const n=s.nights;

async function copyText(text, msg){ try{ await navigator.clipboard.writeText(text); toast(msg||'Zkopírováno'); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(msg||'Zkopírováno'); }catch(err){ toast('Nepodařilo se zkopírovat'); } ta.remove(); } }
function galImgs(s){ const n=GAL[s.id]||0; const a=[]; for(let i=1;i<=n;i++) a.push(`img/stay/${s.id}/${i}.jpg`); if(!a.length && s.img) a.push(`img/stay/${s.id}.jpg`); return a; }

// ---------- swipe mezi dny (telefon) ----------
(function(){ let sx=0, sy=0, on=false; const area=document.getElementById('day');
  area.addEventListener('touchstart',e=>{ if(e.target.closest('.strip,.tablewrap,svg')) { on=false; return; } on=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  area.addEventListener('touchend',e=>{ if(!on) return; on=false; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>70 && Math.abs(dy)<50){ go(cur + (dx<0?1:-1)); } },{passive:true});
})();

// ---------- taby ----------
function showTab(id){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===id?'true':'false'));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+id));
  document.getElementById('pager').style.display = id==='dny'?'':'none';
  if(id==='prehled') renderOverview(); if(id==='znalosti') renderKnowledge(); if(id==='prakticke') renderPractical(); if(id==='spani') renderStays();
  try{ localStorage.setItem('vn26.tab', id); }catch(e){}
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{ showTab(b.dataset.tab); window.scrollTo({top:0}); }));

// ---------- start ----------
(function(){
  let start = 1; const todayN = todayNum();
  if(todayN) start = todayN;
  else { try{ const s=+localStorage.getItem('vn26.day'); if(s>=1&&s<=24) start=s; }catch(e){} }
  const m = location.hash.match(/#den(\d+)/); if(m && +m[1]>=1 && +m[1]<=24) start=+m[1];
  autoDay = (start===todayN) ? todayN : 0;
  renderDay(start);
  const tab = location.hash.replace('#','');
  if(['prehled','znalosti','prakticke','spani'].includes(tab)) showTab(tab);
  // aplikace nechaná otevřená přes půlnoc: po návratu do popředí přeskočí na nový den (jen pokud uživatel sám jiný den nevybral)
  const refreshToday = ()=>{ const tn=todayNum(); document.querySelectorAll('#strip button').forEach(b=>b.classList.toggle('today', +b.dataset.n===tn));
    if(tn && autoDay && tn!==autoDay && cur===autoDay){ autoDay=tn; go(tn); } else if(cur!==autoDay) autoDay=0; };
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshToday(); });
  setInterval(refreshToday, 60000);
  setInterval(()=>{ const old=document.getElementById('depalert'); const nh=depAlertHTML(cur); if(old){ if(nh) old.outerHTML=nh; else old.remove(); } else if(nh){ const p=document.querySelector('#day .profile')||document.querySelector('#day .facts'); if(p) p.insertAdjacentHTML('afterend',nh); } }, 60000);
  document.getElementById('pagermid').addEventListener('click', ()=>{ const tn=todayNum(); if(tn){ autoDay=tn; go(tn); } });
})();
})();
</script>
