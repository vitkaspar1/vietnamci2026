<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#F2F4EE; --card:#FFFFFF; --ink:#18201B; --muted:#5E6B63; --line:#D5DBD2; --soft:#E7EBE3;
  --accent:#B9321F; --accent-ink:#FFFFFF; --green:#1E6644; --green-ink:#F3F7F2; --sea:#1D6C8A; --city:#8A6A1E;
  --c-priroda:#5E9E2E; --c-kultura:#C9A800; --c-cesta:#3A3F3B; --c-aktivity:#0288D1; --c-jidlo:#E24B3E; --c-ubytovani:#8E24AA; --c-ostatni:#795548; --c-destinace:#0288D1;
  --warn-bg:#FFF3E0; --warn-ink:#7A3E00; --warn-line:#F3C38B;
  --sheet:#FFFFFF; --shadow:0 12px 32px rgba(20,30,24,.18);
  --fd:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --fb:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --card:#1A211D; --ink:#E8ECE5; --muted:#9AA79E; --line:#2B352E; --soft:#232C26;
    --accent:#E0563F; --accent-ink:#FFFFFF; --green:#2E8A5C; --green-ink:#F0F6F1; --sea:#3D9BC0; --city:#C9A24A;
    --c-priroda:#8BC34A; --c-kultura:#FFD54F; --c-cesta:#CFD5CF; --c-aktivity:#4FC3F7; --c-jidlo:#FF7B6B; --c-ubytovani:#CE93D8; --c-ostatni:#BCAAA4; --c-destinace:#4FC3F7;
    --warn-bg:#3A2A12; --warn-ink:#FFD9A8; --warn-line:#7A5520; --sheet:#1F2823; --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1A211D; --ink:#E8ECE5; --muted:#9AA79E; --line:#2B352E; --soft:#232C26;
  --accent:#E0563F; --accent-ink:#FFFFFF; --green:#2E8A5C; --green-ink:#F0F6F1; --sea:#3D9BC0; --city:#C9A24A;
  --c-priroda:#8BC34A; --c-kultura:#FFD54F; --c-cesta:#CFD5CF; --c-aktivity:#4FC3F7; --c-jidlo:#FF7B6B; --c-ubytovani:#CE93D8; --c-ostatni:#BCAAA4; --c-destinace:#4FC3F7;
  --warn-bg:#3A2A12; --warn-ink:#FFD9A8; --warn-line:#7A5520; --sheet:#1F2823; --shadow:0 12px 32px rgba(0,0,0,.5);
}
/* Leaflet: přepínač vrstev bez externích obrázků (CSS je inline) */
.leaflet-control-layers-toggle{background-image:none!important;display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--fd);letter-spacing:.06em;color:#222}
.leaflet-control-layers-toggle::after{content:"VRSTVY"}
.leaflet-control-layers-toggle,.leaflet-touch .leaflet-control-layers-toggle{width:64px;height:34px}
.leaflet-control-layers-expanded .leaflet-control-layers-toggle{display:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;padding-bottom:84px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.eyebrow{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* --- hlavička + taby --- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 0 6px}
.brand h1{font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.brand h1 span{color:var(--accent)}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;padding-bottom:0}
.tabs button{flex:1;padding:9px 4px 10px;font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;border-radius:0}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.view{display:none}.view.on{display:block}

/* --- pás dnů --- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;scroll-snap-align:center;min-width:52px;padding:6px 8px 5px;border-radius:8px;border:1px solid var(--line);background:var(--card);text-align:center;line-height:1.1}
.strip button b{display:block;font-family:var(--fd);font-size:20px;font-weight:700}
.strip button small{display:block;font-size:11px;color:var(--muted)}
.strip button.p-hory{border-top:3px solid var(--green)}.strip button.p-more{border-top:3px solid var(--sea)}.strip button.p-mesta{border-top:3px solid var(--city)}
.strip button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.strip button[aria-current="true"] small{color:var(--bg);opacity:.75}
.strip button.today{box-shadow:0 0 0 2px var(--accent)}

/* --- karta dne --- */
.sign{background:var(--green);color:var(--green-ink);border-radius:14px;padding:16px 16px 14px;margin-top:6px;position:relative;overflow:hidden}
.sign.p-more{background:var(--sea)}.sign.p-mesta{background:var(--city)}
.sign .dayno{font-family:var(--fd);font-size:14px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.sign h2{font-size:34px;text-transform:uppercase;margin:4px 0 8px;letter-spacing:.02em}
.sign .route{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-size:22px;font-weight:600;flex-wrap:wrap}
.sign .route .arr{opacity:.7;font-size:20px}
.sign .date{font-size:14px;opacity:.9;margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fact .k{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-family:var(--fd);font-weight:600}
.fact .v{font-family:var(--fd);font-size:22px;font-weight:700;line-height:1.1}
.fact .v small{font-size:13px;font-family:var(--fb);font-weight:400;color:var(--muted)}
.profile{margin-top:10px;font-size:14px;color:var(--muted)}
.profile b{color:var(--ink);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;text-decoration:none;text-align:center;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{grid-column:1/-1}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:translateY(1px)}
.todo{margin-top:8px}
.todo .it{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.todo .it input{width:22px;height:22px;margin-top:2px;accent-color:var(--green)}
.todo .it .tt{font-weight:600;font-size:15.5px}
.todo .it .nt{font-size:14px;color:var(--muted);margin-top:2px}
.todo .it .wh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--fd);font-weight:600;margin-top:4px;color:var(--green)}
.todo .it.late .wh{color:var(--accent)}
.todo .it.done .tt{text-decoration:line-through;color:var(--muted)}
.todo .it .lk{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
.todo .it .lk a,.todo .it .lk button{font-size:13px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none;color:var(--ink)}
.todo h4{font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 2px}
.todobox{background:var(--card);border:2px solid var(--green);border-radius:10px;padding:10px 12px;margin-top:12px}
.todobox b.h{display:block;font-family:var(--fd);font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--green);margin-bottom:4px}
.dep{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.dep b{font-family:var(--fd);font-size:20px;letter-spacing:.02em}
.wx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.wx .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;min-height:64px}
.wx .card.one{grid-column:1/-1}
.wx .ico{font-size:32px;line-height:1}
.wx .k{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-family:var(--fd);font-weight:600}
.wx .v{font-family:var(--fd);font-size:20px;font-weight:700;line-height:1.1}
.wx .s{font-size:13px;color:var(--muted)}
.emg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.emg a{display:block;text-align:center;padding:12px 6px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-family:var(--fd);font-weight:700;font-size:26px;line-height:1}
.emg a small{display:block;font-size:12px;font-weight:600;margin-top:5px;letter-spacing:.06em;text-transform:uppercase}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ins input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.phr .grp{margin-top:14px;font-size:16px;text-transform:uppercase;letter-spacing:.06em}
.phr .row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.phr .cs{font-size:15px}
.phr .vn{font-family:var(--fd);font-size:21px;font-weight:700;line-height:1.1}
.phr .pr{color:var(--muted);font-size:13px}
.phr .ico,.emgphr .ico{display:flex;gap:6px}
.phr .ico button,.emgphr .ico button{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:15px;font-family:var(--fd);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.phr .ico button.say,.emgphr .ico button.say{font-size:18px;padding:6px 10px}
.phr input.q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;margin-top:10px}
.showcard{position:fixed;inset:0;z-index:60;background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;cursor:pointer}
.showcard .vn{font-family:var(--fd);font-weight:700;font-size:clamp(40px,12vw,90px);line-height:1.05;text-wrap:balance}
.showcard .cs{margin-top:20px;font-size:20px;color:var(--muted)}
.showcard .hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));font-size:13px;color:var(--muted)}
.showcard .say{position:absolute;top:16px;right:16px;font-size:28px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.nums button{padding:10px 4px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:center;line-height:1.1}
.nums button b{display:block;font-family:var(--fd);font-size:30px;font-weight:700}
.nums button i{display:block;font-family:var(--fd);font-size:15px;font-weight:600;font-style:normal;margin-top:2px}
.nums button small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.nums button.on{border-color:var(--accent);background:var(--soft)}
.numq .big{font-family:var(--fd);font-weight:700;font-size:72px;line-height:1;text-align:center;margin:10px 0}
.numq .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.numq .opts button{padding:12px 4px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-family:var(--fd);font-size:24px;font-weight:700}
.numq .opts button.vn{font-size:17px}
.numq .opts button.ok{border-color:var(--green);background:var(--soft)}.numq .opts button.bad{border-color:var(--accent)}
.game .modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.game .prog{font-family:var(--fd);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.game .prompt{font-family:var(--fd);font-weight:700;font-size:30px;line-height:1.1;margin:10px 0 4px}
.game .prompt small{display:block;font-family:var(--fb);font-weight:400;font-size:14px;color:var(--muted);margin-top:4px}
.game .opt{display:block;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);margin-top:8px;font-size:18px;line-height:1.2}
.game .opt small{display:block;font-size:13px;color:var(--muted)}
.game .opt.ok{border-color:var(--green);background:var(--soft)}
.game .opt.bad{border-color:var(--accent)}
.game .opt:disabled{opacity:.9}
.game .res{font-family:var(--fd);font-size:34px;font-weight:700;margin-top:10px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14.5px}
.warn b{font-weight:700}

.sec{margin-top:22px}
.sec h3{font-size:22px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.sec h3 .readbtn{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;background:var(--card)}
.sec h3 .readbtn svg{width:16px;height:16px}
.sec h3 small{font-family:var(--fb);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;text-transform:none}
.prose p{margin:10px 0;max-width:68ch}
.prose p.lead{font-size:17px}
.prose .tip{border-left:3px solid var(--accent);padding-left:10px;color:var(--ink)}
.poi-link{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
.poi-link::after{content:"⚑";font-size:.8em;margin-left:2px;opacity:.7}
.quote{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:10px;font-style:italic}
.quote .who{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--fd);font-weight:600}
.pdfpois{display:grid;gap:8px;margin-top:10px}
.pdfpoi{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.pdfpoi .n{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15;max-width:32vw;word-break:break-word}
.pdfpoi .d{font-size:14.5px;color:var(--ink)}
.pdfpoi .d .go{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.mini{width:100%;height:auto;display:block;border-radius:12px;background:var(--soft);margin-top:12px;border:1px solid var(--line)}

/* --- body v mapě --- */
.cat{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.cat summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;font-weight:600}
.cat summary::-webkit-details-marker{display:none}
.cat summary .cnt{margin-left:auto;color:var(--muted);font-weight:400;font-size:13px}
.cat summary::after{content:"+";font-family:var(--fd);font-size:20px;color:var(--muted);margin-left:6px;width:14px;text-align:center}
.cat[open] summary::after{content:"–"}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px var(--card)}
.poi{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.poi .nm{font-weight:600;font-size:15px;line-height:1.2}
.poi .vn{font-size:12.5px;color:var(--muted)}
.poi .ll{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ico{display:inline-flex;gap:6px}
.ico button,.ico a{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:var(--bg);text-decoration:none}
.ico svg{width:18px;height:18px}
.ico .w{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.02em}

.budget{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.budget>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 8px}
.budget .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--fd);font-weight:600}
.budget .v{font-family:var(--fd);font-size:18px;font-weight:700}
.budget .v small{font-size:11px;font-family:var(--fb);font-weight:400;color:var(--muted)}
.budget .tot{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.budget .tot .k{color:var(--bg);opacity:.7}
.budget .tot .v{font-size:24px}.budget .tot .v small{color:var(--bg);opacity:.7}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none;color:var(--ink)}
.links a.bk{border-color:#1a4fa0}.links a.ag{border-color:#c8342c}.links a.fb{border-color:#4267B2}.links a.map{border-color:#1E6644}.links a.ab{border-color:#FF385C}
.links .msgbtn{font-size:13px;padding:5px 10px;border:1px solid var(--accent);border-radius:999px;background:var(--card);color:var(--accent);font-family:var(--fb);font-weight:600}
/* ubytování */
.tipline{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--green);background:var(--soft);border-radius:0 10px 10px 0;font-size:15px}
.stays{display:grid;gap:12px;margin-top:12px}
.stay{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.stay.closed{opacity:.72}
.stay .ph{position:relative;aspect-ratio:16/7;background:var(--soft)}
.stay .ph img{width:100%;height:100%;object-fit:cover;display:block}
.stay .ph .strip{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stay .ph .strip::-webkit-scrollbar{display:none}
.stay .ph .strip img{flex:0 0 100%;scroll-snap-align:start;cursor:zoom-in}
.stay .ph .cnt{position:absolute;right:8px;top:8px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:6px;font-family:var(--fd);letter-spacing:.04em}
#lb{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.94);display:flex;flex-direction:column;color:#fff}
#lb .lbx{position:absolute;right:10px;top:8px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;line-height:1}
#lb .lbt{padding:14px 56px 8px 16px;font-family:var(--fd);font-weight:700;letter-spacing:.03em;font-size:17px}
#lb .lbs{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#lb .lbs::-webkit-scrollbar{display:none}
#lb .lbs img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:start}
#lb .lbc{text-align:center;padding:10px;font-size:13px;color:#ccc;font-family:var(--fd);letter-spacing:.06em}
.stay .ph .sc{position:absolute;left:10px;bottom:10px;background:#1a4fa0;color:#fff;font-family:var(--fd);font-weight:700;padding:4px 9px;border-radius:8px;font-size:14px;letter-spacing:.02em}
.stay .ph .sat{position:absolute;right:8px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px}
.stay .bd{padding:10px 12px 12px}
.stay .nm{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.02em;line-height:1.15}
.stay .nm small{display:block;font-family:var(--fb);font-weight:400;font-size:12.5px;color:var(--muted);letter-spacing:0;margin-top:2px}
.stay .vq{font-style:italic;margin:6px 0 0;font-size:14.5px}
.stay .vq .who{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-family:var(--fd);font-weight:600;margin-left:6px}
.stay .n2{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.stay .xtip{margin:6px 0 0;font-size:13.5px;color:var(--muted);border-left:3px solid var(--city);padding-left:8px}
.stay .xtip b{color:var(--city)}
.srow .sn .xb{color:var(--city);font-family:var(--fd);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.stay .warnp{margin:6px 0 0;font-size:13.5px;color:var(--accent);font-weight:600}
.stay .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stay .facts span{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.stay .facts span.ok{border-color:var(--green);color:var(--green)}.stay .facts span.bad{border-color:var(--accent);color:var(--accent)}.stay .facts span.warn{border-color:#c98a00;color:#a56b00}
:root[data-theme="dark"] .stay .facts span.warn{color:#e2b45a}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .stay .facts span.warn{color:#e2b45a} }
.stay .rv{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:13.5px;line-height:1.4}
.stay .rvh{font-family:var(--fd);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.stay .rvh small{font-family:var(--fb);font-weight:400;letter-spacing:0;text-transform:none}
.stay .rp{color:var(--green)}.stay .rm{color:var(--accent)}.stay .rn{color:var(--muted);margin-top:4px;font-size:12.5px}
.stay .price{margin-top:8px;font-size:15px}
.stay .price small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.stay .links{margin-top:10px}
.msgpre{white-space:pre-wrap;font-family:var(--fb);font-size:13.5px;background:var(--soft);border-radius:10px;padding:10px 12px;line-height:1.45}
.vtext{margin-top:12px}.vtext summary{cursor:pointer;color:var(--muted);font-size:14px}
.sgroup{margin-top:22px}
.sgroup h3{font-size:20px;text-transform:uppercase;letter-spacing:.04em;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.sgroup h3 small{font-family:var(--fb);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;text-transform:none;margin-left:8px}
.slist{display:grid;gap:8px;margin-top:10px}
.srow{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.srow.top{border-color:var(--green);background:var(--soft)}
.srow.closed{opacity:.6}
.srow.dim{opacity:.35}
.srow .sn{font-size:15px}
.srow .sn a{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.02em;color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted)}
.srow .sn .star{color:var(--green);font-family:var(--fd);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.srow .sn .vn{display:block;color:var(--muted);font-size:13px;font-style:italic;margin-top:2px}
.srow .sf{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.srow .sf span{font-size:12.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.srow .sf span.ok{border-color:var(--green);color:var(--green)}.srow .sf span.bad{border-color:var(--accent);color:var(--accent)}.srow .sf span.warn{border-color:#c98a00;color:#a56b00}
:root[data-theme="dark"] .srow .sf span.warn{color:#e2b45a}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .srow .sf span.warn{color:#e2b45a} }
.filt{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:14px}
.filt label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.legend{font-size:13px;color:var(--muted);margin-top:8px}
.pager{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
.pager .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.pager button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-family:var(--fd);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.pager button:disabled{opacity:.35}
.pager .mid{flex:0 0 auto;font-family:var(--fd);font-size:14px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;border:0;background:none;padding:10px 6px;border-radius:10px}
.pager .mid[data-today]{color:var(--accent);border:1px solid var(--accent)}

/* --- přehled --- */
.bigmap{width:100%;height:auto;display:block;border-radius:14px;background:var(--soft);border:1px solid var(--line);margin-top:12px}
.totals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.totals .fact .v{font-size:26px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.tl{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.tl th{text-align:left;font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--muted);padding:6px 6px;border-bottom:2px solid var(--ink)}
.tl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tl tr{cursor:pointer}
.tl td.n{font-family:var(--fd);font-size:18px;font-weight:700;width:36px}
.tl td.n i{display:block;width:100%;height:3px;border-radius:2px;margin-top:2px}
.tl .theme{font-family:var(--fd);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:14px}
.tl .r{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
.money{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin-top:10px;font-size:15px}
.money b{font-family:var(--fd);font-size:18px;text-align:right}
.money .hr{grid-column:1/-1;border-top:1px solid var(--line)}

/* --- znalosti --- */
.gcard{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:10px;overflow:hidden}
.gcard>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center}
.gcard>summary::-webkit-details-marker{display:none}
.gcard>summary .t{font-family:var(--fd);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.gcard>summary .s{font-size:13px;color:var(--muted)}
.gcard>summary::after{content:"+";margin-left:auto;font-family:var(--fd);font-size:24px;color:var(--muted)}
.gcard[open]>summary::after{content:"–"}
.gbody{padding:0 14px 14px}
.gbody h4{font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.gbody h4:first-child{border-top:0;padding-top:0}
.gbody ul{padding-left:18px;margin:8px 0}
.gbody li{margin:6px 0;max-width:68ch}
.gbody table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14.5px}
.gbody td,.gbody th{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.gbody th{font-family:var(--fd);letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.gbody td.vn{font-weight:700;letter-spacing:.02em}
.gbody td.pr{color:var(--muted);font-style:italic}
.gbody tr.grp td{font-family:var(--fd);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:12px;padding-top:10px;border-bottom:0}
.check{display:grid;gap:4px;margin:6px 0 12px}
.check label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:7px 8px;border-radius:8px;background:var(--bg);font-size:15px;line-height:1.35}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.check label.done{color:var(--muted);text-decoration:line-through}
.pbar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--green);width:0}

/* --- praktické --- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin-top:8px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.flight{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:8px}
.flight .code{font-family:var(--fd);font-weight:700;font-size:18px}
.flight .t{font-family:var(--fd);font-size:22px;font-weight:700;line-height:1}
.flight .t small{display:block;font-family:var(--fb);font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.flight .arrow{color:var(--muted)}
.callist{display:grid;gap:6px;margin-top:10px}
.callist a{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;font-size:14px}
.callist a b{font-family:var(--fd);font-size:18px}
.callist a .go{font-family:var(--fd);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}

<script id="vn26data" type="application/json">{"days":[{"n":1,"weekday":"neděle","date":"11. 10. 2026","theme":"HLAVNÍ MĚSTO","fromto":"Praha Hà Nội","km":"","time":"","profile":"","pois_pdf":[{"n":"STARÁ ČTVRŤ","d":"Absolutní centrum města, kde Hanoj v roce 1010 n.l. byla založena."},{"n":"JEZERO NAVRÁCENÉHO MEČE","d":"Ikona Hanoje - centrální jezero Navráceného meče."},{"n":"OMAMORI SPA","d":"Výborné masážní spa, kde pracují lidé s postižením zraku. V centru města má 2 pobočky."}],"program":["Gratuluji a vítejte! Dorazili jste do Hanoje - hlavního města Vietnamu! Právě v tomto 9 miliónovém městě (bez dalších miliónových aglomerací) začne vaše putování. Hanoj je svou velikostí na první pohled velmi rušná, zároveň si však oproti mnoha jiným vietnamským městům drží své kulturní kouzlo a vytváří tak jedinečnou atmosféru. Jistě pro vás první kontakt bude šok, ale věřte mi, že pokud tomuto místu dáte šanci, najdete v ní velmi mírumilovného ducha. Tak hurá do města objevovat místní život!","První věc: jak se dostat z letiště do centra? Mimo klasických autobusů a taxíků se ve Vietnamu obecně používá přepravní služba Grab (obdoba Uberu). Pokud chcete mít levnější a jistou cenu, stáhněte si a nainstalujte mobilní aplikaci Grab. Většina taxikářů se vás totiž bude snažit “natáhnout”. Platit však budete muset v hotovosti, proto si předem vyberte nebo rozměňte nějaké peníze na letišti. Možností také je do aplikace přidat platební kartu a směnit peníze tak můžete až přímo ve městě. Cena bude okolo 350 000 VND do centra s 4 místným Grabem. Letiště se nachází 25 km od centra města. Cesta trvá 30-60 minut podle zvoleného dopravního prostředku a také denní doby. V období ranní špičky (7-9h) a večerní špičky (17-19h) může cesta trvat až o půl hodiny déle.","Pro používání aplikace samozřejmě potřebujete mobilní data. Na letišti je zdarma wifi, ale můžete si zde v příletové hale rovnou koupit SIM kartu. Rozhodně volte vojenského operátora Viettel, který má především v odlehlých oblastech země nejlepší pokrytí signálem. 30 denní SIM karty s voláním a neomezenými daty (respektive s limitem 4GB denně nejvyšší rychlostí) stojí 350.000 VND (15$). SIM karta se dá samozřejmě koupit i přímo na pobočce operátora ve městě, ale tento tarif tam mají jen o něco málo levnější.","Peníze obecně si vyměňte ve městě v jedné z mnoha směnáren a klenotnictví v ulici Hà Trung. Na mapě je vyznačená směnárna Quang Dũng do které vždy osobně chodím. Vyměníte zde USD i EUR za aktuální střední kurzy bez komise. Pokud budete měnit bankovky starší nebo menší hodnoty, čekejte, že kurz bude o něco slabší.","Pokud jste po příletu unavení z dlouhé cesty, není nic lepšího, než dopřát tělu pravou vietnamskou masáž. Doporučuji Omamori Spa. Byl jsem tam již nesčetněkrát a zaručuji se za úžasný zážitek. Mohu doporučit všechny typy masáží, které nabízejí. Mou nejoblíbenější je však Omamori, Zen nebo masáž nohou. Velkým plusem je, že je to sociální projekt. Zaměstnanci jsou se zrakovým postižením a Omamori pro ně - vedle toho, že jim dává práci - pořádá mnoho výukových kurzů. Můžete si tak užít a zároveň udělat dobrý skutek. Věřte mi, že po této zkušenosti si Vietnam okamžitě zamilujete.","Dnešní zbytek dne stravte procházkou a prozkoumáváním centra města:","Stará čtvrť - staré centrum města, kde Hanoj vznikla z původních domů obchodníků všech různých cechů. Pokud se podíváte na mapu, tak je to velmi spletitá síť malých uliček. Každá z nich od počátku díky cechům sloužila a i dnes většina slouží k prodeji určitého druhu zboží. Ve starém městě se stačí jen tak procházet a zkoumat hlavní i zapadlé uličky. Zajímavá je především pestrá architektura míchající původní domy, francouzskou koloniální architekturu i zcela nové domy. Jistě si také všimnete výrazných kabelů a sloupů elektrického vedení, které jsou tak typické pro Vietnam. Zajímavým bodem je rozhodně hlavní rušná tržnice Đồng Xuân postavená právě Francouzi již v roce 1889. Skládá se z 2 velkých budov, kdy v první se prodává běžné zboží a oblečení a v té druhé jídlo, koření a ovoce. Hned vedle tržnice je i úzká jídelní ulička, která může být velkým zážitkem. Obecně procházku po staré čtvrti spojte s návštěvami kaváren a jídelen. V mapě je zadáno spoustu míst.","Jezero navráceného meče - ikona města s legendou, která praví, že když se zde v 15. století plavil vietnamský král Lê Lợi, vynořila se obrovská želva (želví bůh), která mu poskytla meč s kterým porazil čínskou dynastii Ming. Když se tu po válce plavil znovu, želva se opět vynořila a meč si vzala zpátky. Od té doby se praví, že pokud bude Vietnam v nesnázích, želví bůh přijde na pomoc. Nepřipomíná vám to něco? :)","Na jezeře se nachází ikonická pagoda Tháp Rùa zasvěcená právě želvímu bohu a dále známá pagoda Ngọc Sơn. Toto jsou opravdu jedny z nejdůležitějších památek ve městě. Návštěva jezera se dá dobře spojit s dalšími důležitými historickými místy v okolí. Rád dělám okruh dále k Hanojské opěře, slavnému koloniálnímu Hotelu Metropole, Národní bance a přes náměstí kolem sochy zakladatele města Lý Thái Tổ zpět k jezeru nebo rovnou do staré čtvrti. Kousek od jezera se také nachází slavná katedrála sv. Josefa. Večer - pokud nejste unavení - zajděte na pivo nebo za nočním životem do staré čtvrti, kde se nachází spoustu restaurací, barů a klubů. Nejhlavnější ulice jsou Mã Mây a Tạ Hiẹn Beer Street. Alternativnější možností jsou místa mimo centrum především v okolí Západního jezera, kde se nachází klidnější bary a lokální kluby."],"food":["V mapě je vyznačeno opravdu spoustu míst. Seznam níže jsou místa, která jsou absolutní hanojské klasiky. Vždy se ale můžete rozhodnout přímo podle mapy a toho, kde se zrovna nacházíte. Věřím, že žádné uvedené místo nezklame.","Phở 10 Lý Quốc Sư - jedno z nejznámějších hovězích phở bò v centru.","Phở Gia truyền Bát Đàn - další velmi staré a tradiční phở bò.","Phở xào Phú Mỹ - výborné smažené rýžové nudle phở s hovězím masem.","Phở trộn Hạnh - jedno z mých nejoblíbenějších jídel - rýžové nudle phở s trhaným slepičím vařeným masem, bylinkami, arašídy a omáčkou. Otevřeno mají pouze večer a je to typický streetfood na malých plastových židličkách na ulici. Objednejte si konkrétně jídlo phở trộn. Mají tu ale také i výborné kuřecí phở gà.","Bún bò Nam Bộ Bách Phương - klasika velmi známá z ČR - rýžové nudle bún s restovaným hovězím masem, bylinkami, zeleninou, arašídy, smaženou cibulkou a zálivkou.","Bánh cuốn gia truyền Thanh Vân - slané “palačinky” z rýžového těsta plněné mletým vepřovým masem a houbami. Namáčí se do rybí omáčky. Velmi typické severské jídlo. Ideální především k snídani nebo lehké večeři.","Bánh mì 25 - slavná vietnamská bageta s mnoha variacemi náplní.","Chả Cá Thăng Long - typicky hanojské vyhlášené jídlo oceněné v Michelin BIB Gourmand - grilované kusy ryby podávané s jarní cibulkou, koprem a dalšími bylinkami dohromady grilované na horké pánvi přímo na stole. Podávané s rýžovými nudlemi bún, arašídy a omáčkou.","Sinh tố Hoa Béo - na tomto místě dělají proslavené hoa quả dậm - miska se sezónním ovocem, kousky želé, ledovou tříští a vše zalité směsí kondenzovaného a kokosového mléka. Výborný osvěžující dezert. Mají více variací např. se zmrzlinou, v kokosu, topingem, atd.","Kem Tràng Tiền - nejznámější hanojská zmrzlina založena roku 1958.","Bún Chả 41 Cửa Đông - další velmi typické severské jídlo - nudle bún, grilované marinované kousky vepřového bůčku, směs bylinek a zálivka. Často se podává se smaženými krabími závitky.","Bún chả Duy Diễm - výborné bún chả, ale mimo centrum.","Bún cá Hồng Phúc - tradiční rybí polévka bún cá. Toto místo je otevřené 24 hodin denně a je nejlepší pro noční zahnání hladu nebo po propařeném večeru.","Phở cuốn Chinh Thắng - hanojské závitky phở cuốn z tlustšího rýžového těsta plněné kousky restovaného hovězího masa, salátu a koriandru. Namáčí se do rybí omáčky. Objednejte si zde také smažené taštičky phở chiên phồng s hovězím masem a vietnamským zelím pak choi. Jedno z mých nejoblíbenějších jídel. Nachází se kousek od Západního jezera.","Bò Nướng Xuân Xuân - populární hovězí gril za lidové ceny.","Sumo BBQ - all you can eat bufet konceptu grilu na stole a plátcích všech druhů syrových mas. Vyšší úroveň, výborné chutě, velký zážitek.","Cafe Nola - krásná kavárna přímo uprostřed centra.","Cộng Cà Phê - velmi známý řetězec kaváren v starém komunistickém stylu. Výborná káva, kvalitní servis a úroveň.","Oldtown Garden Café - známá kavárna v posledním patře úzké budovy kousek od jezera Navráceného meče. Hlavním lákadlem je právě terasa na střeše s výhledem na město a jezero. Vstup do kavárny je celkem úzkým nenápadným průchodem mezi domy, tak hledejte pozorně. Dělají zde hanojskou specialitu - kávu s našlehaným žloutkem.","Manzi Art Space - umělecký prostor Manzi s kavárnou nabízí příjemné prostředí pro poznání lokální současné umělecké scény.","Tranquil Books & Coffee - velmi klidná a hezká kavárna kousek od centra. Mnoho lidí si sem chodí spíše číst, pracovat a odpočívat. Nabízí výbornou kávu a 3 patra, kdy každé je vhodné k jiné aktivitě.","Oriberry coffee - kavárna u Západního jezera s nádherným výhledem na jezero z terasy ve 3. patře."],"stay":["V Hanoji vám doporučím 4 druhy ubytování v centru od základní až po ultra luxusní úroveň:","Serenity Diamond Hotel - levná, ale naprosto dostatečná úroveň ubytování. Booking/Agoda","Blue Hanoi Inn Hotel - střední kategorie hotelu s neuvěřitelně milým personálem. Booking/Agoda","Sap Hotel by Connek - výborný 4 hvězdičkový hotel a spa. Booking/Agoda","Sofitel Legend Metropole Hotel - 5 hvězdičkový ultra luxusní hotel. Je to první luxusní hotel v koloniálním stylu otevřený již v roce 1901. Toto je místní legenda, kde se od jakživa ubytovávají slavní lidé z celého světa jako např. Charlie Chaplin, američtí prezidenti nebo Angelina Jolie s Bradem Pittem. V nedávné době se zde konal summit mezi prezidenty USA a Severní Koreje. Booking/Agoda","Kategorie luxusních hotelů s výjimečnou lokalitou a vybaveností:","Rex Hanoi Hotel - 4 hvězdičkový hotel přímo v srdci Staré čtvrti s úžasným výhledem z terasy, baru a bazénu na centrum a jezero Navráceného meče. Booking/Agoda","San Grand Hotel - 4 hvězdičkový hotel stejně jako Rex Hotel leží v centru Staré čtvrti a nabízí úžasný výhled na město a jezero. Booking/ Agoda","V poslední době také využívám Airbnb, které nabízí krásné byty za podobné ceny hotelových pokojů. Nezapomeňte však klást důraz na to, aby byty měly své vlastní parkovací prostory.","Pro vyhledání z široké nabídky všech druhů ubytování klikněte na jeden z odkazů níže."],"budget":{"jidlo":400000,"ubytovani":300000,"benzin":0,"ostatni":150000,"celkem":850000,"pozn":"taxi z letiště"},"brief":"Přílet do Hanoje v 16:20. Půlden v Hanoji – lokální jídla a káva, hlavní památky v centru.","phase":"mesta","from":"Praha","to":"Hà Nội","vasek":"Prakticky večer po příletu a celý následující den pro průzkum Hanoje a aklimatizaci."},{"n":2,"weekday":"pondělí","date":"12. 10. 2026","theme":"KULTURNÍ SRDCE VIETNAMU","fromto":"Hà Nội Hà Nội","km":"","time":"","profile":"","pois_pdf":[{"n":"CHRÁM LITERATURY","d":"První hanojská univerzita."},{"n":"HO CHI MINOVO MAUZOLEUM","d":"Mauzoleum ve kterém se nachází balzamované tělo prezidenta Ho Chi Mina."},{"n":"ZÁPADNÍ JEZERO","d":"Obrovské městské jezero je klidnou oblastí ideální k “útěku” z rušného města."},{"n":"MUZEA","d":"Etnologické muzeum, muzeum umění, muzeum vietnamských žen."},{"n":"HANOJSKÁ PLÁŽ","d":"Unikátní “hippie” místo na ostrově pod mostem Long Biên může být dobrým místem k odpočinku a nahlédnutí do lokální subkultury."},{"n":"OMAMORI SPA","d":"Výborné masážní spa, kde pracují lidé s postižením zraku. V centru města má 2 pobočky."}],"program":["Vítejte v 2. dni v Hanoji. Dnes budete mít možnost poznat více specifická a i trochu méně turistická místa hlavního města. Při projití okruhu pěšky bez jakýchkoliv dopravních prostředků je to program na celý den. Pokud si místa budete chtít rozložit i na poslední dny v Hanoji po cestě na motorkách, tak doporučuji dnes navštívit Vietnamské muzeum etnologie, které vám dá ucelený kulturní vhled mimo jiné do etnických menšin žijících v horách severního Vietnamu, který budete podrobně během své cesty projíždět.","Jednou z nejvýznamnějších historických památek města, ale i vietnamské historie, je bez pochyby Chrám literatury - nejstarší vietnamská univerzita založená pravděpodobně v roce 1070, která je věnována Konfuciovi. V dnešní době je to turistická památka, ale stále se tu v období zkoušek a maturit scházejí studenti na focení v tradičních šatech. Je to hezká zkušenost pro poznání staré architektury. Od chrámu je to nedaleko k Ho Chi Minovo mauzoleu - dalšímu ikonickému a velevýznamnému místu nedávné historie. Nachází se na náměstí Ba Đình, kde 2. září 1945 Ho Chi Minh slavnostně přečetl deklaraci nezávislosti, vznikla tak Vietnamská demokratická republika a započal boj s francouzskými kolonialisty. Není tak symboličtější místo, kde by mohl být strýček Ho - jak mu Vietnamci přezdívají - pohřben. Naproti náměstí si jistě také všimnete velké moderní budovy. Nachází se v ní sídlo národního shromáždění.","Pokud budete mít čas a chuť uniknout z rušného centra, tak pokračujte dále na sever k Západnímu jezeru - největší městské jezero o ploše 5,3 km² a obvodu 17 km. Je to má oblíbená oblast v Hanoji, jelikož je zde na jinak rušné město opravdu ojedinělý klid. Podél celého jezera se nachází spoustu dobrých kaváren, hospod, barů a samozřejmě restaurací. Ty jsou z centra každopádně trochu dále a hodí se tak mít motorku nebo se dopravit taxíkem. Dá se ale komfortně udělat minimálně pěší procházka po východním břehu. Na něm se nachází hezká pagoda Trấn Quốc. Nejkrásnější je každopádně jezero koncem dne při západu slunce.","Projděte se dále pěšky a zajděte ochutnat hanojské vyhlášené závitky v Phở cuốn Chinh Thắng. Popis najdete níže v tipech na jídlo a pití.","Velmi málo známým místem je hanojská pláž. Místními nazývaný hippie ostrov se nachází pod mostem Long Biên. Na ostrov se dostanete schody na jižní straně mostu. Toto místo sleduji již od samého začátku mého pobytu ve Vietnamu - tedy 8 let. Dříve to bylo velmi lokálně udržované místo s podomácku vyráběnými židlemi a cvičícími nástroji. Každé ráno při východu slunce se zde koupe několik mužů bez plavek. Je to velmi úzká komunita lidí o které většina lidí dlouho nevěděla. Dnes jsem zde již viděl provázet i místní průvodce a především celá pláž je mnohem lépe provedena. Stále je to však dost hippie/hipster místo s unikátní, až vesnickou atmosférou.. Dalším programem může být navštívení některého muzea. Před samotnou cestou na sever je dobré se dozvědět něco o etnických menšinách tam žijících. Velmi zajímavé je Vietnamské muzeum etnologie, které vám dá rozsáhlý a komplexní pohled na četné vietnamské etnické menšiny. Muzeum se nachází 6 km od centra a prohlídka zabere okolo 2 hodin. V mapě jsou dále označené Národní muzeum umění a muzeum vietnamských žen. Všechny stojí za návštěvu."],"food":["V mapě je vyznačeno opravdu spoustu míst. Seznam níže jsou místa, která jsou absolutní hanojské klasiky. Vždy se ale můžete rozhodnout přímo podle mapy a toho, kde se zrovna nacházíte. Věřím, že žádné uvedené místo nezklame.","Phở 10 Lý Quốc Sư - jedno z nejznámějších hovězích phở bò v centru.","Phở Gia truyền Bát Đàn - další velmi staré a tradiční phở bò.","Phở xào Phú Mỹ - výborné smažené rýžové nudle phở s hovězím masem.","Phở trộn Hạnh - jedno z mých nejoblíbenějších jídel - rýžové nudle phở s trhaným slepičím vařeným masem, bylinkami, arašídy a omáčkou. Otevřeno mají pouze večer a je to typický streetfood na malých plastových židličkách na ulici. Objednejte si konkrétně jídlo phở trộn. Mají tu ale také i výborné kuřecí phở gà.","Bún bò Nam Bộ Bách Phương - klasika velmi známá z ČR - rýžové nudle bún s restovaným hovězím masem, bylinkami, zeleninou, arašídy, smaženou cibulkou a zálivkou.","Bánh cuốn gia truyền Thanh Vân - slané “palačinky” z rýžového těsta plněné mletým vepřovým masem a houbami. Namáčí se do rybí omáčky. Velmi typické severské jídlo. Ideální především k snídani nebo lehké večeři.","Bánh mì 25 - slavná vietnamská bageta s mnoha variacemi náplní.","Chả Cá Thăng Long - typicky hanojské vyhlášené jídlo oceněné v Michelin BIB Gourmand - grilované kusy ryby podávané s jarní cibulkou, koprem a dalšími bylinkami dohromady grilované na horké pánvi přímo na stole. Podávané s rýžovými nudlemi bún, arašídy a omáčkou.","Sinh tố Hoa Béo - na tomto místě dělají proslavené hoa quả dậm - miska se sezónním ovocem, kousky želé, ledovou tříští a vše zalité směsí kondenzovaného a kokosového mléka. Výborný osvěžující dezert. Mají více variací např. se zmrzlinou, v kokosu, topingem, atd.","Kem Tràng Tiền - nejznámější hanojská zmrzlina založena roku 1958.","Bún Chả 41 Cửa Đông - další velmi typické severské jídlo - nudle bún, grilované marinované kousky vepřového bůčku, směs bylinek a zálivka. Často se podává se smaženými krabími závitky.","Bún chả Duy Diễm - výborné bún chả, ale mimo centrum.","Bún cá Hồng Phúc - tradiční rybí polévka bún cá. Toto místo je otevřené 24 hodin denně a je nejlepší pro noční zahnání hladu nebo po propařeném večeru.","Phở cuốn Chinh Thắng - hanojské závitky phở cuốn z tlustšího rýžového těsta plněné kousky restovaného hovězího masa, salátu a koriandru. Namáčí se do rybí omáčky. Objednejte si zde také smažené taštičky phở chiên phồng s hovězím masem a vietnamským zelím pak choi. Jedno z mých nejoblíbenějších jídel. Nachází se kousek od Západního jezera.","Bò Nướng Xuân Xuân - populární hovězí gril za lidové ceny.","Sumo BBQ - all you can eat bufet konceptu grilu na stole a plátcích všech druhů syrových mas. Vyšší úroveň, výborné chutě, velký zážitek.","Cafe Nola - krásná kavárna přímo uprostřed centra.","Cộng Cà Phê - velmi známý řetězec kaváren v starém komunistickém stylu. Výborná káva, kvalitní servis a úroveň.","Oldtown Garden Café - známá kavárna v posledním patře úzké budovy kousek od jezera Navráceného meče. Hlavním lákadlem je právě terasa na střeše s výhledem na město a jezero. Vstup do kavárny je celkem úzkým nenápadným průchodem mezi domy, tak hledejte pozorně. Dělají zde hanojskou specialitu - kávu s našlehaným žloutkem.","Manzi Art Space - umělecký prostor Manzi s kavárnou nabízí příjemné prostředí pro poznání lokální současné umělecké scény.","Tranquil Books & Coffee - velmi klidná a hezká kavárna kousek od centra. Mnoho lidí si sem chodí spíše číst, pracovat a odpočívat. Nabízí výbornou kávu a 3 patra, kdy každé je vhodné k jiné aktivitě.","Oriberry coffee - kavárna u Západního jezera s nádherným výhledem na jezero z terasy ve 3. patře."],"stay":["V Hanoji vám doporučím 4 druhy ubytování v centru od základní až po ultra luxusní úroveň:","Serenity Diamond Hotel - levná, ale naprosto dostatečná úroveň ubytování. Booking/Agoda","Blue Hanoi Inn Hotel - střední kategorie hotelu s neuvěřitelně milým personálem. Booking/Agoda","Sap Hotel by Connek - výborný 4 hvězdičkový hotel a spa. Booking/Agoda","Sofitel Legend Metropole Hotel - 5 hvězdičkový ultra luxusní hotel. Je to první luxusní hotel v koloniálním stylu otevřený již v roce 1901. Toto je místní legenda, kde se od jakživa ubytovávají slavní lidé z celého světa jako např. Charlie Chaplin, američtí prezidenti nebo Angelina Jolie s Bradem Pittem. V nedávné době se zde konal summit mezi prezidenty USA a Severní Koreje. Booking/Agoda","Kategorie luxusních hotelů s výjimečnou lokalitou a vybaveností:","Rex Hanoi Hotel - 4 hvězdičkový hotel přímo v srdci Staré čtvrti s úžasným výhledem z terasy, baru a bazénu na centrum a jezero Navráceného meče. Booking/Agoda","San Grand Hotel - 4 hvězdičkový hotel stejně jako Rex Hotel leží v centru Staré čtvrti a nabízí úžasný výhled na město a jezero. Booking/ Agoda","V poslední době také využívám Airbnb, které nabízí krásné byty za podobné ceny hotelových pokojů. Nezapomeňte však klást důraz na to, aby byty měly své vlastní parkovací prostory.","Pro vyhledání z široké nabídky všech druhů ubytování klikněte na jeden z odkazů níže."],"budget":{"jidlo":400000,"ubytovani":300000,"benzin":0,"ostatni":0,"celkem":700000,"pozn":""},"brief":"Návštěva Chrámu literatury, Ho Chi Minova mauzolea a Západního jezera.","phase":"mesta","from":"Hà Nội","to":"Hà Nội","vasek":"Na ten druhý celý den bych vám naplánoval velkej pěší okruh po hlavních místech v okolí centra."},{"n":3,"weekday":"úterý","date":"13. 10. 2026","theme":"VZHŮRU NA CESTU!","fromto":"Hà Nội Xuân Sơn","km":"133 km","time":"3h 24m","profile":"dálnice, hlavní provinční tahy, vesnické cesty","pois_pdf":[{"n":"NÁRODNÍ PARK XUÂN SƠN","d":"Minimálně známý a navštěvovaný národní park pouhých 140 km od Hanoje. 2 vesnice v krásném izolovaném prostředí, možnosti přírodního koupání a treku k vodopádu Ngọc."},{"n":"BÃI TẮM BẢN CỎI","d":"Hlavní místní koupaliště s veškerou vybaveností."},{"n":"VODOPÁD NGỌC","d":"Vodopád uprostřed džungle s možností koupání. Dostanete se k němu hodinovým trekem."},{"n":"ČAJOVÉ PLANTÁŽE LONG CỐC","d":"Známé čajové kopcovité plantáže nabízející hezké výhledy."}],"program":["Cílem prvního dne je krásný a izolovaný Národní park Xuân Sơn. Turismus se zde začal rozvíjet teprve během Covidu, kdy Vietnamci poprvé ve větším měřítku začali vyhledávat izolované a přírodní destinace. Nyní je tak oblast turisticky dostupná, ale pravděpodobně díky obecné popularitě přírodní rezervace Pù Luông, kterou jste navštívili minule, je Xuân Sơn rozvinutý stále v minimální míře. Z Hanoje doporučuji vyrazit až po 9. hodině, kdy končí ranní špička a výjezd z města tak budete mít o dost jednodušší. Rezervaci motorek máte na 8:30, takže by to mělo vyjít tak akorát.","Z města je nejlepší vyjet podél dálnice CT08 směrem na západ. Jeďte podle trasy v mapě. Na kraji města, kde mimo jiné uvidíte, jakým směrem se Hanoj vyvíjí v současnosti, nemiňte vjezd do tunelu díky kterému podjedete tamní velmi rušnou křižovatku. Z tunelu vyjedete v podstatě hned na začátku dálnice. Na ní však mají motocykly vjezd zakázaný, takže budete muset sjet z dálnice na podélnou silnici, která vede celou dobu vedle.","Následně po zhruba 7 kilometrech odbočte mírně vpravo na severozápad, abyste nejeli rovně na město Hoà Bình. Držte se dále podle trasy v mapě. Cesty jsou zde rychlé a z místních aglomerací se tak dostanete zhruba za hodinu. Následně na křižovatce a bodu začátek horských cest již vjedete to typických nekonečných klikatých zatáček a začnete postupně stoupat výše do hor.","Pokračujte stále rovně po hlavní. Po cestě se můžete zastavit na pro místní klasickou pauzu u stánků s občerstvením u čajových plantáží. Nedaleko se nachází i dobrá restaurace Điểm dừng chân Đại Nam, která je za mě jediným nejlepším místem k obědu, pokud nechcete obědvat až v cíli.","O kousek dále dojedete na bod velká křižovatka s čerpací stanicí, kde se vydáte přímo rovně a sjedete již z velké hlavní silnice, odkud je to již zhruba poslední hodina cesty do Xuân Sơn. Pokud máte čas a zajímají vás čajové plantáže, tak za obcí Minh Đài si můžete odbočit mimo trasu a jet prozkoumat Čajové plantáže Long Cốc. Nachází se zde poměrně rozsáhlá oblast typických kopcovitých čajových polí, kde se můžete klidně projít a prozkoumat tyto specifické výhledy.","V Národním parku Xuân Sơn jako takovém se nabízí pár přírodních aktivit a Vietnamci se sem jezdí primárně koupat. Hlavní vesnicí protéká krásná řeka do které můžete libovolně vejít. V mapě jsou vyznačené 2 známé body řeka a koupání. Řekněme turističtějším místem ke koupání je koupání Bãi Tắm Bản Cỏi, což je malé jezírko s občerstvením. Měl by zde být přístup i do přilehlé jeskyně, kterou ale nemám vyzkoušenou.","Pro více dobrodružnější aktivitu se dá vydat do džungle k vodopádu Thác Ngọc. Dojedete na konec cesty pode Google Maps a následně je to zhruba hodinový trek. Vodopád nabízí velmi přírodní a izolované koupání v džungli. Po cestě se nachází i jeskyně Hang Na ke které se dá vystoupat, avšak podle Googlu je momentálně uzavřená.","Xuân Sơn je pro mě obecně přírodně vesnická oáza v zachovalém a klidném prostředí. Místní vás otevřeně vítají a je to tak ideální prostředí pro útěk z obrovské a uspěchané Hanoje."],"food":["Stánky s občerstvením u čajových plantáží - klasické zastávkové místo s jednoduchými stánky na hlavní silnici mezi čajovými plantážemi ideální na krátký odpočinek a pití během cesty.","Điểm dừng chân Đại Nam - dobrá „motorestová“ restaurace.","Căng Tin Cafe - hezká kavárna v obci Minh Đài.","Večeři budete mít na ubytování."],"stay":["Homestay Xuân Sơn 2 - hezký prostorný homestay v hlavní vesnici. Booking/Agoda","Quynh Nga Homestay - rozlehlý a klidný homestay ve vedlejší vesnici s klasickým spaním v dřevěném domě na kůlech nebo bungalowech. Facebook"],"budget":{"jidlo":400000,"ubytovani":150000,"benzin":70000,"ostatni":0,"celkem":620000,"pozn":""},"brief":"Cesta z Hanoje do Národního parku Xuân Sơn. Možnost koupání a návštěva vodopádu v parku.","phase":"hory","from":"Hà Nội","to":"Xuân Sơn","vasek":"Výjezd z Hanoje po ranní špičce po 9. hodině, přes 100 km, ale na čas rychlý a široký cesty. Až ke konci posledních zhruba 30 km už budete vyloženě v horských cestách při vjezdu do Národního parku Xuan Son. Park není bohužel zatím nijak turisticky extra rozvinutej, ale v místní vesnici se dá dobře vykoupat, dojít k vodopádu."},{"n":4,"weekday":"středa","date":"14. 10. 2026","theme":"PŘÍRODNÍ REZERVACE TÀ XÙA","fromto":"Xuân Sơn Tà Xùa","km":"115 km","time":"3h 37m","profile":"vesnické cesty, horské průsmyky, hlavní tah","pois_pdf":[{"n":"HORA HỒNG PHÙ YÊN","d":"Přes 1100m vysoká hora na kterou vede offroadová stezka. Ze shora se nabízí krásné výhledy do celého okolí a několik travnatých planin."},{"n":"PŘÍRODNÍ REZERVACE TÀ XÙA","d":"Překrásná vysoce položená horská oblast nabízející úchvatné výhledy do okolí. Místo zatím celkem skryté zahraničním turistům, avšak velmi rychle se rozvíjející těm vietnamským. Známé především díky možnosti ranního “cloud huntingu”."}],"program":["Dnes pojedete do již známé oblasti Tà Xùa, kdy trasa je poměrně krátká a pokud jste včera nestihli některé aktivity v Xuân Sơn, tak můžete učinit ještě dnes ráno. Do Tà Xùa se nabízí 2 možné trasy, které se obě potkávají v městě Phù Yên.","Trasa 1 vede nejdříve vesnickými cestami, které vás po 20km vyvedou z Národního parku Xuân Sơn na hlavní silnici QL32. V městě Thu Cúc odbočíte vlevo a zanedlouho začnete stoupat krásným průsmykem do kopce na jejímž vrcholu se nachází kavárna Gió Đèo Cón s krásným výhledem.","Po sjezdu průsmykem odbočte vlevo na ĐT114A, která vás po vedlejší silnici povede krásným vesnickým prostředím směrem na Phù Yên. Zajímavostí je zde průsmyk Đèo Dệt a to především proto, že se zde vyjet na přilehlou horu Hồng Phù Yên. Cesta je však kompletně offroadová a sami tak zvažte, zda se sem vydat, či ne. Je to výjezd zhruba 500 výškových metrů, z vrcholu se nabízí nádherné široké výhledy a také krásné travnaté planiny.","Trasa 2 vede zcela odlehlými cestami, údolími a vesnicemi a právě díky tomu je mou oblíbenější. Nabízí hezký výhled řeku a údolí s místními rybáři žijícími na plovoucích domečcích dole u řeky a průjezdy několika průsmyky a úzkými údolími. Rád tuto cestu podnikám přímo až do města Phù Yên, avšak na rozcestí na hlavní silnici ĐT114 se dá odbočit i vpravo a dojet do v Trase 1 zmíněného průsmyku Đèo Dệt a to především proto, pokud by byl zájem vyjet si na horu Hồng Phù Yên.","Trasa 2 má však menší úskalí a to 2 offroadové úseky do kopce, které ač jsou krátké, tak za mokrých podmínek poměrně složité na výjezd. První je hned pár kilometrů za Xuân Sơn vyznačený v mapě jako začátek offroadového úseku do kopce. Je to úsek dlouhý pouhých zhruba 500m, ale poměrně strmý a za mokra jílovitá půda opravdu velmi klouže. Druhé místo se nachází na bodu dřevěný most přes řeku, ke kterému sjedete po úzké nezpevněné cestě dolů a následně musíte vyjet nahoru. Podmínky jsou o to dobrodružnější, jelikož aktuální most je provizorní, jelikož původní byl smeten rozsáhlou povodní v roce 2025. Po průjezdu mostem budete také nejspíše velmi pravděpodobně zkasírováni místní paní, která nový provizorní most po povodni prý postavila. Za suchých podmínek tuto cestu každopádně doporučuji a je krásnou lehce dobrodružnou vložkou oproti běžné Trase 1.","Z města Phù Yên je cesta již velmi jednoduchá. Za městem pojedete poslední delší úsek širokou průsmykovitou silnicí mezi horami do města Bắc Yên před samotným stoupáním do Tà Xùa. Bude to trochu rušnější hlavní cesta, avšak stále pohodová. Výjezd do Tà Xùa je doslova úchvatný. Naskytne se vám spoustu nádherných výhledů dolů do údolí na celé město. V hezkém počasí budete jistě hodně stavět a kochat se místními dalekými panoramaty. Mou nejoblíbenější vyhlídku jsem v mapě vyznačil jako nádherný výhled do celého údolí. Samotná cesta je poměrně úzká a občas rozbitá, tak buďte opatrní.","Po výjezdu nahoru zjistíte, že jste dorazili do opravdu malé a chudé vesničky. Nevypadá zrovna dvakrát čistě, stále se zde něco staví, ale jste tu kvůli přírodě v okolí, která je nádherná a nabízí spoustu možností."],"food":["Nhà hàng Anh Yến - spolehlivá restaurace s klasickou rýží cơm v Thu Cúc.","Coffee - trà sữa Tít&Chíp - kavárna na křižovatce v Thu Cúc.","Quán ăn Đại Lộc - dobrá restaurace v městě Phù Yên.","Cơm Phở Nhất Long - malá restaurace s rýží a phở v vesnici Gia Phù.","Ve většině ubytování vám uvaří bohatou večeři v lokálním stylu. Přímo ve vesnici se pak nachází několik především turistických restaurací:","Cơm Phở MÙA MÁY - jedna z mála opravdu lokálních a původních jídelen s polévkami phở a bún. Ideální k snídani.","Vua lẩu nướng Tà Xùa - restaurace s grilem & hot potem.","Nhà hàng H'mông Tà Xùa - restaurace zaměřující se na lokální speciality.","A Phủ Restaurant - restaurace s venkovní terasou nad silnicí a částečným výhledem na údolí.","Velmi se zde také rozšířil trend dobrých kaváren s výhledy do údolí:","Thào Coffee Tà Xùa - nejznámější a pravděpodobně první kavárna ve vesnici s terasou a výhledem do celého údolí.","Tiệm cà phê Mị ơi - kavárna na hřebeni s výhledem na západ.","Chill Coffee - kavárna na hřebeni s výhledem na východ do údolí.","An's coffe Đỉnh gió Tà Xùa - nejnovější kavárna přilehlá k nově se stavějícímu ubytování. Terasa s krásným výhledem kousek dále od silnice."],"stay":["V celé oblasti se dnes již nachází poměrně mnoho ubytování, avšak pouze malá část z nich je na Bookingu. Většinou je tak nutné rezervovat přímým kontaktem přes Facebookovou stránku, nebo se jednoduše zeptat na místě. Ubytování tu je ale opravdu spousta a kromě státních svátků je nepravděpodobné, že byste tu ubytování nesehnali.","Obecně si vždy vybírejte ubytování s výhledem do hlavního údolí, kterých je tu poměrně dost, jelikož by byla škoda toho nevyužít. Dále doporučuji se pokoj vždy podívat předem. Jezdí sem primárně mladí Vietnamci/studenti a mnoho ubytování tak sice vypadají z venku hezky, ale uvnitř jsou velmi jednoduše a levně vybavené (tvrdé matrace, extrémně malé pokoje a koupelny, atd.). Dále je třeba upozornit, že homestay zde neznamená bydlení přímo s rodinou, jak je tomu běžné jinde po severu. Nečekejte tak autentické zážitky/kontakt s místními. Zde je pár mých osobních doporučení:","Tà Xùa Hills - místo ve kterém jsem několikrát bydlel nacházející se na separovaném malém malém kopci více v hlavním údolí pod vesnicí. Nabízí dřevěné chatky, pokoje a nově i glampingové stany. Vyšší ceny. Facebook","An Hill Homestay - hezký “homestay” s novými prosklenými chatkami a terasou s výhledem do údolí. Facebook","Pơ Mu homestay - velký “homestay” nabízející několik různých typů ubytování. Facebook","Tà Xùa Jade - Vừng Homestay - jediné ubytování na Bookingu. Booking","Tà Xùa Clouds Homestay - velký “homestay” s mnoha druhy pokojů i chatek. Nižší ceny a mnoho dalších homestay v okolí. Facebook","Homestay Tà Xùa Lu Trế - nové ubytování východně mimo vesnici postavené na vrcholu malého kopce nabízející výhled na 2 strany - do hlavního údolí i dolů na město Bắc Yên. V poslední době velmi populární “Instagramové” místo. Pokud sem pojedete, zaparkujte na parkovišti uprostřed kopce a dále musíte dojít pěšky, případně poprosit zaměstnance homestaye, aby pro vás přijeli. Facebook","Homestay Háng Đồng Ecolodge - ubytování dále za Tà Xùa, ale v těsné blízkosti k Dinosauřímu hřbetu. Kromě odlehlosti od turistického centra tak nabízí strategickou pozici pro ranní brzké vstávání pro sestup na vyhlídku. Booking/Agoda"],"budget":{"jidlo":400000,"ubytovani":300000,"benzin":60000,"ostatni":0,"celkem":760000,"pozn":""},"brief":"Výjezd zapadlými vesnicemi z národního parku. Výjezd do Tà Xùa.","phase":"hory","from":"Xuân Sơn","to":"Tà Xùa","vasek":"Výjezd z NP a cesta do vysoce položené oblasti a údolí Tà Xùa. Tady jsou prakticky 3 možné cesty, všechny okolo 100 km, různých typů a aktivit. Popíšu vám všechny možnosti a rozhodnutí bude na vás na místě."},{"n":5,"weekday":"čtvrtek","date":"15. 10. 2026","theme":"ZA HORKÝMI PRAMENY","fromto":"Tà Xùa Trạm Tấu","km":"49 km","time":"2h 27m","profile":"kvalitní hlavní tahy nebo offroad","pois_pdf":[{"n":"BĚŽNÁ TRASA","d":"Běžná trasa po hlavní silnici dlouhá 155km a 4h 55m. Rozhodně hezká, pohodová a v klidu zvládnutelná za den."},{"n":"ALTERNATIVNÍ TRASA","d":"50 km “zkratka”, kdy první polovina je překrásná fascinující horská oblast Xím Vàng s opuštěnými horskými úseky, výhledy, vodopády a rozsáhlými rýžovými poli. Druhá polovina je 23 km dříve poměrně náročný a kopcovitý offroad, který se dnes však přestavuje na novou dobře sjízdnou silnici."},{"n":"DINOSAUŘÍ HŘBET","d":"Slavná nádherná vyhlídka v Tà Xùa."},{"n":"VODOPÁDY","d":"Několik přírodních vodopádů po trase přes Xím Vàng."},{"n":"HORKÉ PRAMENY","d":"Slavné horké prameny v okolí vesnice Trạm Tấu."}],"program":["Nejdůležitějším úkolem dne a jedním z hlavních důvodů, proč jste tady, je vstát ráno brzy na východ slunce a zkusit zažít již zmiňovaný cloud hunting. Hlavní údolí je obrovské a je zde tak mnoho míst, odkud se dá vidět. Pokud nejste úplně ranní ptáčata, tak nejjednodušší způsob je ho sledovat přímo z ubytování.","Další možností je východ slunce sledovat z jedné z kaváren na nádherném výhledu z hřebene na obě strany, kam se snadno dostanete za 10 minut.","Nejpopulárnější a zároveň nejdobrodružnější volbou však je vydat se po severní straně údolí na místní proslulý Dinasauří hřbet - hřeben úzkého “výstupku” hory tyčícího se do údolí směrem přímo na východ. Právě toto místo celé Tà Xùa před lety proslavilo a odstartovalo místní turismus. Cesta po “hřbetu” je na pár místech velmi úzká a doporučuje se na ní chodit pouze pěšky. Odvážní a zkušení jezdci na ní však mohou dojet i na motorce. Buďte však opravdu velmi opatrní, jelikož v jednom úseku má cesta necelý metr a z obou stran hluboký sráz dolů. Na konci se nachází opravdu nádherná vyhlídka s téměř 360 stupňovým výhledem do celého údolí. Z hlavní vesnice sem je cesta dlouhá 13 km a zabere okolo 40 min + následný cca 15 minutový sestup na vyhlídku. Je tak třeba sem vyrazit brzy, ale pokud vám podmínky budou přát, budete stát přímo nad mraky, z obou stran obklopeni horami a před sebou hledět přímo na vycházející slunce. Opravdu jedinečné místo. Po východu slunce se vraťte na silnici, kde se mimochodem nachází kavárna Bản Coffee v které si můžete rovnou dát kávu a snídani ve formě instantních nudlí. Jistě si užijete i cestu údolím zpět, která je také krásná a pojedete jí nyní již za světla. Každopádně kdybyste sem nejeli na východ slunce, tak i během dne doporučuji na tuto vyhlídku si zajet.","Dnešním cílem budou úžasné horké prameny v horské vesnici Trạm Tấu, kde si budete moci řádně odpočinout a osvěžit tělo na další dny.","Z Tà Xùa se tam můžete dostat dvěmi cestami:","Bežnou trasou, která vede po hlavní silnici a museli byste se vrátit kousek po cestě po které jste přijeli včera. Je dlouhá 155km a necelých 5 hodin. Většina cesty je pohodová po klidné a kvalitní silnici méně i více obydlenými oblastmi. Na začátku cesty sjedete krásnou cestou dolů, kterou již znáte. Poté pojedete více klidnějším a vesnickým prostředím. Po cestě je pár hezkých údolí. V mapě jsem také vyznačil průsmyk Lũng Lô, který ale nemám osobně vyzkoušený. Bude to pravděpodobně zajímavé stoupání a tak zpestření během cesty. Po napojení se na hlavní tah QL32 začne být krajina více obydlená a rušnější. Stále se však budete nacházet ve velmi zemědělské oblasti s mnoha rýžovými poli. Za městem Nghĩa Lộ se vydáte krásným stoupáním do cílové vesnice Trạm Tấu. Celá vesnice leží v rovině obklopené horami a okolo je tak mnoho krásných rýžových polí vytvářející s okolím nádherná panoramata. Samotná cesta nahoru je velmi zábavná s pár krásnými výhledy. Touto cestou každopádně pojedete i další den zpět dolů.","Alternativní trasou si oproti běžné trase výše zkrátíte celou cestu o zhruba 100 km a především zažijete mnoho krásných výhledů v okolí Xím Vàng, což je obec a její přilehlé okolí severozápadně od Tà Xùa. Rozsáhlá údolí celá pokrytá rýžovými poli, dlouhé klikaté průsmyky, vodopády podél nich a nespočet opravdu nádherných výhledů do dalekého okolí. Toto je opravdu nádherná vyjížďka a jeden ze stále skrytých klenotů severozápadního Vietnamu. Celá cesta tam i zpět vám však zabere klidně i celé dopoledne, takže je vše třeba dobře naplánovat s ranním východem slunce, pokud se na jeho pozorování vydáte např. na zmíněný Dinasauří hřbet. Po zpevněné cestě můžete dojet nejdále až do vesnice v které se nachází malá jídelna Quán Cơm Phở Samu. Po celé trase je to totiž pravděpodobně jedno jediné místo, kde se dá najíst a tak se nevyplatí ho minout. V ideálním případě se právě sem snažte dojet v čase oběda, dát si jednoduchou nudlovou polévku, kterou zde vaří, poté se v klidu vrátit kus zpět a pokračovat rovně nahoru do kopce dle vyznačené trasy do Trạm Tấu.","Cesta odsud až do cíle je pouhých 23 km, které ještě donedávna bývaly celé offroadový úsek velmi oblíbený mezi vietnamskou motorkářskou komunitou. Cesta přes tuto zcela opuštěnou horskou oblast trvala 1,5-3 hodiny dle jezdeckých zkušeností. Dnes mám však informace, že je úsek již téměř celý přestavěný na zcela novou silnici. Celá oblast je opuštěná, bez mobilního signálu a stále zde jezdí opravdu pouze místní.","V Trạm Tấu samotném jsou hlavní aktivitou místní horké prameny. Ubytovat se dá přímo u nich, nebo v jednom z mnoha hezkých homestayů v okolí a k pramenům se dojet pouze vykoupat. Nachází se zde několik bazénů včetně studeného a celá oblast je dnes mezi Vietnamci velmi turisticky známá."],"food":["Na běžné trase je možnost se naobědvat v městě Phù Yên. Doporučuji zde restauraci Quán ăn Đại Lộc, kde mají dobrou rýži nebo phở.","V celé této ulici je kdyžtak spoustu dalších restaurací na výběr.","Dále po trase a především po silnici QL32 do Nghĩa Lộ jsou malá městečka s restauracemi. Bohužel si již přesně nepamatuji, kde jsem tam jedl. Nabídka ale rozhodně je.","Město Nghĩa Lộ se nabízí na velmi pozdní oběd, avšak s dobrou nabídkou jídel. Pro běžný bufet cơm bình dân zajděte do Quán phượt Sinh Cúc. Na dobré phở do Phở bò Nam Định. Jako lepší restauraci s širokým výběrem jídel doporučuji Cơm Niêu 123.","Na alternativní trase je vhodným místem k obědu Quán Cơm Phở Samu - malá jídelna na konci trasy přes Xím Vàng. Je to opravdu malé a velmi prosté vesnické bistro. Nečekejte zde tak žádnou vysokou gastronomii. Otevřeno mají pouze v časech obědů, takže si svou cestu sem dobře naplánujte.","Pokud budete velmi rychlí, tak můžete dojet až do Trạm Tấu, kde pár jídelen je. Obecně zde ale bývá nejlepší se najíst přímo v ubytování."],"stay":["Tram Tau Hot Spring - Velmi hezké ubytování v dřevěných chatkách v kopci nad bazény s horkými prameny. Celé se nachází v malém údolíčku posetém rýžovými terasovitými poli. Toto místo se proslavilo teprve před pár lety a prochází neustálým vývojem. Pouze za poslední rok a půl se v podstatě zdvojnásobilo a celé ubytování náleží k místním horkým pramenům. Počítejte tak, že zde bude rušno. Nejsou na Bookingu, ale lze napsat přímo “manažerovi” na jeho Facebook.","V blízkém okolí se pak nachází několik zbrusu nových hezkých homestay ubytování:","Zoni Home Trạm Tấu - Krásný homestay s milými majiteli. Booking","Na Thẩm Eco Hill Homestay - Hezký homestay nabízející i několik samostatných bungalowů. Booking","Xoè Homestay - Další z nových a kvalitních homestayů v oblasti. Více turistický. Booking"],"budget":{"jidlo":300000,"ubytovani":200000,"benzin":30000,"ostatni":0,"celkem":530000,"pozn":""},"brief":"Dlouhý okruh po silnici nebo nádhernou odlehlou krajinou a cestou do Trạm Tấu. Horké prameny v Trạm Tấu.","phase":"hory","from":"Tà Xùa","to":"Trạm Tấu","vasek":"Ranní/dopolední průzkum v oblasti. Uvedených 49 km je čistě cesta do Trạm Tấu. V realitě to bude víc a upravím to, až budu plánovat celý den podrobně. Každopádně to bude velmi pomalé tempo průzkumu „kolem komína“ a pak následně těch 49 km přejezd do Trạm Tấu, kde jsou super horký prameny za odměnu po aktivním dnu."},{"n":6,"weekday":"pátek","date":"16. 10. 2026","theme":"PŘEJEZD DO MÙ CANG CHẢI","fromto":"Trạm Tấu Khau Phạ","km":"85 km","time":"2h 23m","profile":"průsmykovité cesty, hlavní tah","pois_pdf":[{"n":"JESKYNĚ ĐỘNG TIÊN NỮ","d":"Poměrně hezká a barevně nasvícená náboženská jeskyně u městečka Tú Lệ."},{"n":"MÍSTNÍ POTOK","d":"Potok pramenící v horách protékající celým údolím. Kromě zdroje vody pro zavlažování místních polí, nebo místem pro koupání dětí v horkých dnech, je také neodmyslitelným prvkem utvářející atmosféru celého údolí."},{"n":"VODOPÁD CAO PHẠ","d":"Vodopád podél cesty v průsmyku Khau Phạ."},{"n":"VOJENSKÝ PAMÁTNÍK","d":"Monumentální památník připomínající boj v údolí s francouzskými kolonialisty."},{"n":"PRŮSMYK KHAU PHẠ","d":"Fascinující průsmyk dlouhý 30 km klikatící se podél celého údolí nabízející fascinující výhledy na terasovitá pole a místní vesnice."},{"n":"BBQ HILL","d":"Kopec v údolí nabízející krásný výhled do okolí. Hosté z ubytování od KPF si zde mohou objednat pořádání večerního BBQ."},{"n":"RÝŽOVÁ POLE","d":"Místa vybízející k vstupu do místních rýžových polí nabízející krásné pohledy a možnosti fotografování zblízka."},{"n":"SESKOČIŠTĚ PARAGLIDŮ","d":"Bod pod vrcholem průsmyku z kterého se především v období sklizně rýže seskakuje s paraglidem. Nachází se zde také rozhledna a jedna z nejhezčích vyhlídek na údolí vůbec."},{"n":"BYLINNÉ KOUPELE","d":"Dům pana Lăma, který kromě provozování malé sámošky nabízí také tradiční bylinné koupele (především koupele nohou)."},{"n":"LE CHAMP TÚ LỆ HORKÉ PRAMENY","d":"Menší komplex horkých lázní a 2 venkovních bazénů patřící k přilehlému luxusnímu resortu Le Champ Tú Lệ Resort v městečku Tú Lệ."},{"n":"VESNICE ÍT THÁI","d":"Vesnice v údolí, kde se nachází ubytování a služby organizace Khau Pha Friends (KPF), která zde provozuje tzv. Community based tourism. Tato vesnice a aktivity KPF jsou v podstatě centrem veškerého turistického dění v celém údolí."}],"program":["Čeká vás krásný přejezd do vyhlášené oblasti Mù Cang Chải. Na začátku dne sjedete zpět do nížiny do města Nghĩa Lộ. Odtud se vydáte na severozápad nádhernou a pohodovou cestou až do městečka Tú Lệ. Budete projíždět fantastickými širokými horskými cestami, kde je jízda jedna báseň. Jedna zatáčka bude střídat druhou, silnice je dostatečně široká, bezpečná a kvalitní. To vše v krásném horském prostředí. Cestou je i několik krásných kratších průsmyků a poté tradiční vesnice etnických menšin a okolní rýžová pole, které místní obdělávají. Další pohodová krásná cesta, kterými je tato oblast typická.","Před Tú Lệ se můžete zastavit na návštěvu náboženské jeskyně Động Tiên Nữ. Interiér je velmi pestře barevně nasvícen doplněn o malé sochy mýtických zvířat. Někomu se to může zdát jako kýč, ale toto je přesně styl, který místní mají rádi a mnoho jeskyní ve Vietnamu vypadá právě takto. Celá návštěva vám zabere okolo 30 minut. Hned naproti se také nachází horké prameny resortu Le Champ Tú Lệ. Luxusní a poměrně nový komplex nabízí pár soukromých dřevěných van s horkou minerální vodou. Venku se pak nachází jeden horký a jeden studený bazén s výhledem na potok a místní kopce. Pokud se sem vydáte, tak bych si osobně nejdříve zkontroloval, kolik se tam nachází lidí. Pokud lázně budou přeplněné hlučnými vietnamskými turisty, věřte mi, že to bude téměř jistě spíše otrava, než relax a potěšení.","Z Tú Lệ pokračujte již do dnešního cíle - průsmyku Khau Phạ a v něm vesnici Ít Thái. Držte se mnou vyznačené trasy v mapě, před obecním úřadem - UBND xã Cao Pha sjeďte z hlavní silnice doprava do údolí a překročte kamenný most. Vítejte v ráji. Toto místo je pro mě osobně velice speciální, protože během Covidu jsem zde několik měsíců žil a rok pracoval pro organizaci Khau Pha Friends (KPF), která zde v roce 2018 začala pracovat na vytvoření tzv. Community based tourism modelu, což je udržitelný model provozování turismu v kterém úhlavní rolí a středobodem zájmu je určitá místní komunita (v drtivé většině etnická menšina). Prací KPF tak od počátku je vyhledávání vhodných osob a rodin, kteří jsou otevření k vzdělávání se a následnému provozování služeb turistům za účelem získání lepší obživy, zdroje příjmů, prezentování své minoritní etnické kulturní identity a tím pádem i její ochraně a prezervaci. V dnešní době se na mnoha místech Vietnamu z důvodů masového turismu objevují případy postupného vytrácení bohatých kulturních tradic a identity lokálních etnických menšin. Ať už z důvodu postupného ekonomického rozevírání “nůžek” ve společnosti nebo příchodem bohatých investorů z velkých měst, kteří horské etnické menšiny v podstatě zneužívají jako kulturní atrakce a na místních levně skoupených pozemcích budují luxusní resorty s minimálním ohledem na prospěch tamním komunitám. Pokrok je velmi rychlý a v drtivé většině extrémně chudá a nevzdělaná populace nemá často jinou možnost, než podlehnout. Organizace právě jako KPF se s tímto problémem snaží bojovat a svými programy vzdělávání a tréninku v oblastech turismu, podnikání, ochraně přírody, ale i školství napomáhá k vytváření silných a schopných komunit hrdých na svůj původ a kulturu. Místní obyvatele tak sami sebe jen tak slepě nezaprodávají, ale naopak svou identitu drží pevně ve svých rukou a benefitují z ní v širokém měřítku.","Hlavním centrem dění je vesnice Ít Thái v které se nachází všechny 3 místní homestaye podporované KPF a také Khau Phạ House by KPF, které nabízí privátní ubytování, ale především je díky veřejné knihovně a nově vybudované kavárničce s ohništěm lokálním bodem setkávání. Ocitnete se najednou uprostřed údolí, na malých cestách a doslova na dosah rýžovým polím obdělávaných po generace obyvateli etnika Thái. Ano, nacházíte se na jejich území a v jejich kulturním prostředí, které, jak pevně věřím sami rychle ucítíte, jelikož je extrémně otevřené a pohostinné. Místní žijí po generace prostým životem farmářů v malé semknuté komunitě. Každý se zná s každým, obyvatelé jsou často provázáni rodinnými vazbami a navzájem si ve všem pomáhají, ať už s pravidelným obděláváním polí, několika měsíční stavbou dřevěného domu nebo prostým hledáním ztraceného buvola… Věřte mi, že zde se lidé k sobě chovají lidsky v dobrém slova smyslu.","Tolik na úvod a hurá k samotnému poznávání! Začněte prostým procházením vesnice a především místních rýžových polí. Na mapě jsem vyznačil 2 hlavní mikro oblasti s poli z kterých jsou krásné výhledy. Rozhodně se nebojte do polí vlézt, abyste získali pro vás tu nejhezčí perspektivu, anebo se dostali za místními, kteří zde budou zrovna pracovat. Rozhodně se nemusíte bát ani se ostýchat. Sice si s nikým nejspíše nepopovídáte, ale zvídavost prolamuje bariéry a místní jsou vážně přátelští. Dávejte jen velký pozor na kraje polí po kterých budete chodit. Jsou uplácané z bahna a někdy se mohou nečekaně propadnout. Rozhodně nečekejte, že se vrátíte s čistými botami. Přes pole se také dostanete k místnímu potoku podél, kterého můžete jít jedním, či opačným směrem. Fantazii se meze nekladou a zde máte opravdovou volnost a bezpečí se jen tak procházet, zpomalit a užít si toto mírumilovné prostředí.","Z vesnice se dále rozvětvují pouze 2 cesty a to jižním směrem nebo západním. Jakýmkoliv se vydáte, budete stoupat do kopce a výše položených menších vesnic, kde již žijí lidé etnika Hmong. Ty jasně poznáte podle jiných krojů (především sukní), které ženy nosí. Žádná z rodin tam však momentálně neposkytuje turistické služby, takže tam nejsou na návštěvníky tolik zvyklí.","Pokud se vydáte západní větví, brzy narazíte na BBQ Hill, což je malý kopec směřující do údolí nabízející opravdu krásný a široký výhled. Homestaye KPF zde pořádají večerní BBQ pro hosty, kteří si ho předem objednají. Pokud o to máte zájem, domluvte se včas na ubytování. Dorazit sem tak můžete až k pozdnímu odpoledni, užít si poslední paprsky světla a grilované pokrmy k tomu. Místo je k tomu jako stvořené. Dá se odsud každopádně vydat ještě výše. Doporučuji z “hlavní cesty” odbočit ostře doleva nahoru po úzké cestě. Po kratším stoupání se dostanete na vyhlídku, odkud je také hezký výhled. Místní průvodci zde pokračují dále a dělají okružní trasu zpět do vesnice z jižní strany. Musíte sestoupit po polích a podél stromů po levé straně prudce z kopce, překročit potok a postupně se podél něj dostat zpět na betonovou cestu. Na mapě cesta vyznačit nejde, ale na místě to jistě poznáte. Pokud chcete trošku toho horského “kozího” lezení, klidně se tudy vydejte. V opačném případě se v klidu vydejte zpět cestou, kterou jste přišli. Celý tento pěší program po vesnici a nejbližším okolí hravě zabere celé odpoledne.","Po večeři doporučuji zajít do Khau Phạ House by KPF, sednout si, dát si něco dobrého k pití, povídat si s ostatními návštěvníky nebo si vzít knížku. K tomu si ideálně ještě dát bylinnou horkou koupel nohou po prochozeném dni (koupel nejlépe objednávejte před večeří nebo ještě odpoledne, pokud je hostů více)."],"food":["V městě Nghĩa Lộ pro běžný bufet cơm bình dân zajděte do Quán phượt Sinh Cúc. Na dobré phở do Phở bò Nam Định. Jako lepší restauraci s širokým výběrem jídel doporučuji Cơm Niêu 123. Vhodnou zastávkou je t
