aké oblast mnoha různých jídelen naproti nemocnici.","Ideální zastávkou na oběd je však v městečku Tú Lệ, kde je dobrou restaurací Nhà hàng Phố núi.","Večeři budete mít v homestayi, takže nemusíte nic řešit."],"stay":["Khau Pha Friends momentálně v celém údolí nabízí 5 následujících ubytování a všechny si můžete zarezervovat přes Facebookovou stránku Khau Phạ CBT by KPF:","Quyết Đoản Homestay by KPF - První homestay na který narazíte hned po přejití lanového mostu. Quyết a jeho žena Đoản jsou především vyhlášení svým výborným kuchařským uměním. Před poskytováním ubytování zde provozovali místní “restauraci” a dodnes, kdykoliv je větší společenská akce, pořádá se zde. K tomu zde provozují sámošku s různým smíšeným zbožím. Inside story: pan Quyết je velmi šikovným obchodníkem. Vlastní mnoho pozemků v okolí, obchoduje s mnoha surovinami a je nejbohatším obyvatelem v celém údolí. :-)","Quân Pỏm Homestay by KPF - Quân a jeho žena Pỏm byli první, kteří se KPF nechali přesvědčit k provozování ubytování ve vesnici. Vkusně zrekonstruovaný dům nabízí komornější atmosféru. Highlightem je rozhodně výhled z horního patra.","Kiên Pành Homestay by KPF - Když Kiên viděl svého bratra Quâna, jak se mu daří, okamžitě se chtěl přidat. Se svou ženou Pành se tak k KPF přidali také a rychle starý dům opravili a přizpůsobili standardům k vítání hostů. Jejich dům je prostornější a vzdušnější, než bratrův. Oba jsou opravdu extrémně mili a nápomocní. Sám jsem právě u nich bydlel. Mají 2 syny, kdy hlavně starší je hodně společenský a určitě s ním zažijete nějaké vtipné historky.","Konghill Camping Site by KPF - Zcela nově otevřený projekt teprve 2.9.2022. Fantastické místo s budoucí ambicí vybudování glampingového místa. Nyní zatím pár míst k postavení běžných stanů.","Khau Phạ House by KPF - Původně komunitní knihovna, místo k setkávání a také luxusnější privátní ubytování v horním patře pro 6 osob. Nyní především kavárna, místo k setkávání a knihovna pro děti. Volně dostupné kdykoliv pro kohokoliv!","Kromě těchto možností se vyloženě v dolní části údolí nenachází nic jiného, co by stálo za doporučení. Sám jsem toto místo našel čirou náhodou tak, že jsem se musel přestěhovat z hrozného ubytování v průsmyku. Za zmínku maximálně stojí naopak luxusní Le Champ Tú Lệ Resort Hot Spring & Spa v městečku Tú Lệ. Nemám vyzkoušeno. Booking"],"budget":{"jidlo":300000,"ubytovani":150000,"benzin":50000,"ostatni":40000,"celkem":540000,"pozn":"vstup do jeskyně"},"brief":"Přejezd po hlavních tazích do oblasti Mù Cang Chải. Nádherné údolí Khau Phạ a vesnice Ít Thái.","phase":"hory","from":"Trạm Tấu","to":"Khau Phạ","vasek":"Přejezd do údolí Khau Phạ pod stejnojmenným slavným průsmykem. Toto je pro mě takový osobně důležitý místo, znám to tam velmi dobře a je to ideální místo k tomu projít si údolí a vesnici pěšky, interagovat s místními. Vše bude podrobně popsané v konkrétním itineráři."},{"n":7,"weekday":"sobota","date":"17. 10. 2026","theme":"HORKÉ PRAMENY","fromto":"Khau Phạ Mù Cang Chải","km":"104 km","time":"3h 11m","profile":"hlavní tah, vesnické cesty","pois_pdf":[{"n":"VODOPÁD CAO PHẠ","d":"Vodopád podél cesty v průsmyku Khau Phạ."},{"n":"VOJENSKÝ PAMÁTNÍK","d":"Monumentální památník připomínající boj v údolí s francouzskými kolonialisty."},{"n":"TRŽNICE NGÃ BA KIM","d":"Místní tržnice ve vesnici Púng Luông."},{"n":"PRŮSMYK KHAU PHẠ","d":"Fascinující průsmyk dlouhý 30 km klikatící se podél celého údolí nabízející fascinující výhledy na terasovitá pole a místní vesnice."},{"n":"OBLAST NGỌC CHIẾN","d":"Krásná a zapadlá oblast Ngọc Chiến známá především svými horkými prameny. Vesnice v obrovském údolí obklopená rýžovými i květinovými poli."},{"n":"VODNÍ PŘEHRADA NẬM CHIẾN","d":"Velká přehradní nádrž a vodní elektrárna za Ngọc Chiến."},{"n":"CBT NGỌC CHIẾN","d":"Community based tourism provozovaný ve vesnici. Možnost procházky a interakce s místními."},{"n":"TISÍCILETÝ STROM","d":"Tisíc let starý strom vedle fotbalového hřiště s výhledem je pomyslným centrálním bodem ve vesnici. Ideální místo na odpočinek nebo piknik."},{"n":"SESKOČIŠTĚ PARAGLIDŮ","d":"Bod pod vrcholem průsmyku z kterého se především v období sklizně rýže seskakuje s paraglidem. Nachází se zde také rozhledna a jedna z nejhezčích vyhlídek na údolí vůbec."},{"n":"HORKÉ PRAMENY V NGỌC CHIẾN","d":"Několik horkých pramenů ve vesnici, ať už pro turisty nebo i veřejných pro místní."},{"n":"RÝŽOVÁ POLE","d":"Rozsáhlá rýžová pole obklopující vesnici."}],"program":["Dnes se již vydáte směrem do centra oblasti Mù Cang Chải, kde už budete dnes spát, ale ještě vás zavedu do krásné vedlejší a méně navštěvované oblasti Ngọc Chiến. Hlavním průzkumem oblasti strávíte zítřejší celý den.","Z vesnice Ít Thái vyražte zpět nahoru na hlavní do průsmyku Khau Phạ. Čeká vás 10 km dlouhý a 300 metrů vysoký výjezd až téměř na vrchol průsmyku. K cestě toho není moc co říci. Jen abyste si užili jízdu a výhledy, kterých je opravdu mnoho. Hned na začátku se nachází 2 vyhlídky za které se ale musí platit. Dále pokračujte již přímo za nosem. Z motorkářského hlediska je to naprosto fantastická klikatící se cesta, kterou chcete jet více a více. Buďte však opatrní, protože hlavní silnice je opravdu hlavním meziprovinčním tahem na kterém jezdí velké autobusy, náklaďáky a kamióny. Dopravní nehody jsou tu běžné a to včetně těch smrtelných. Hlavním cílem je seskočiště paraglidů, odkud je úžasný výhled z výšky dolů do celého údolí. Nachází se zde větší plac s rozhlednou odkud je opravdu nádherný výhled. S největší pravděpodobností to zde bude přeplněné lidmi a tak popojeďte ještě za zatáčku kousek dále a odbočte doleva na cestu vedoucí na zcela novou vyhlídku, která je o dost větší.","Pokračujte dále průsmykem a za další 4 km dojedete až na vrchol. Nachází se tam vojenský památník věnovaný boji s francouzskými kolonialisty v údolí. Po přejetí vrcholu a následném sestupu dolů hned na jeho konci odbočte doleva, čímž započnete dnešní výlet mimo hlavní trasy. Cesty začnou být hned úzké, avšak všechny jsou zpevněné a primárně betonové. Ze začátku budete projíždět horskými borovicovými lesy a pár zapadlými lokálními vesnicemi. I zde se jistě pokocháte krásnými panoramaty a výhledy na rýžová pole, která místní obdělávají. Pole jsou zde obecně spíše rozprostřené v široké nížině a nemusí tak tvořit vysoké terasy, které jste viděli včera v hlavním údolí.","Zanedlouho dorazíte do vesnice Nậm Khắt na jejímž začátku odbočte vlevo, kde již najedete na silnici přímo do dnešního cíle. Cesta bude více méně opuštěná vedoucí přes pás hor, který budete muset vyjet a pak přes vyhlídku do celého údolí a průsmyku opět sjet dolů, čímž se dostanete do již zmíněné odlehlé oblasti. Cesta je to krásná a oproti prostředí v širokém okolí pro změnu i dost zalesněná. Po pár kilometrech sjezdu a průjezdu menší vesnicí se před vámi otevře krásný výhled na celé údolí a vesnici. Místní horský terén obklopující obydlí v jejich úpatí tvoří opravdu nádhernou scenérii a právě z tohoto místa je to vidět nejlépe. Dnešní den strávíte zde a budete tak mít možnost celé údolí pořádně prozkoumat.","Údolí se fakticky dělí na dvě hlavní části. První, kam jste právě dorazili, je vyloženě lokální a nenabízí moc turistických aktivit. Za návštěvu každopádně stojí místní fotbalové hřiště odkud je hezký výhled do údolí a na stranu z které jste přijeli. Nachází se zde i starý tisíciletý strom, pár přístřešků s lavičkami a hned pod nimi rýžová pole. Je to tak ideální místo na menší odpočinek, svačinu nebo piknik. Pokud se z vyhlídky podíváte směrem vlevo dolů, tak si všimnete, že kromě rýžových polí jsou zde i pole květinová. Díky vhodnému klimatu se zde pěstují především růže, které se poté prodávají do velkých měst.","Vraťte se zpět dolů na hlavní silnici a pokračujte dále na západ po vyznačené trase skrz údolí. Po malém výjezdu se dostanete do druhé části vesnice a to té více turistické. Důvodem jsou místní horké prameny. Především v chladných zimních měsících je toto místo velmi vyhledávané, ale i v létě, kdy v horském prostředí zas takové teplo není, se tu dá příjemně vykoupat. Bazénů je tu více o různých teplotách, takže se dá vybrat. Hned, jak dorazíte, jistě si nejdříve všimnete dvou veřejných horkých pramenů pro místní. Toto je v dnešní době již poměrně unikátní místo, jelikož se sem dodnes chodí místní koupat a to zcela nazí a veřejně. Po severním Vietnamu dříve bývalo takových míst běžně mnohem více, ale postupem času převažuje ostych a soukromí a tato místa tak postupně mizí. Při představě, že drtivá většina místních žijících v dřevěných domech nemají přístup k teplé vodě ke koupání jistě pochopíte, jak velkým bene fitem tyto prameny jsou. Především večer se zde koncentrují desítky místních, kteří se zde koupou.","Hned za veřejnými prameny vpravo se nachází Horké prameny Ngọc Chiến, které jsou zde největší a místo fakticky proslavily. Nachází se zde více bazénů, místnosti s betonovými vanami a vzadu i ubytování. Druhou možností je popojet kousek dále do Horkých pramenů Homestay Văn Tùng, které jsou menší, avšak z mého pohledu útulnější s hezkou zahradou a také homestayem.","Pokračujte dále a brzy se dostanete k místnímu lanovému mostu, který je pomyslnou vstupní branou do místní vesnice a komunity v které se stejně jako v Khau Phạ provozuje tzv. Community based tourism. Vesnička je však oproti Khau Phạ zcela jiná a domy jsou koncentrovány velmi blízko sebe. Nemá tím sice tak kouzelnou atmosféru, avšak místní jsou stejně milí. Hned za vesnicí se opět nachází rozsáhlá rýžová pole, která můžete prozkoumat a o kousek dále také místní turistický kýč - dřevěná vodní kola. Pokud máte čas a chuť, tak pokračujte ještě pár kilometrů dále a dorazíte k vodní přehradě Nậm Chiến. Vodních hydroelektráren se ve Vietnamu nachází opravdu spoustu a tvoří významnou složku v energetickém průmyslu země. Historie sahá do roku 1975, kdy díky spolupráci se Sovětským svazem začala stavba těchto projektů ve velkém a to primárně v horách severního a centrálního Vietnamu. Dnes Vietnam tyto nabyté znalosti a zkušenosti exportuje do okolních zemí.","Postupně se vracejte zpět stejnou cestou. Ve vesnici Nậm Khắt odbočte vlevo a vydejte se na výhled na kopečku, který je mým oblíbeným. Z vesnice pokračujte dále do vesnice Púng Luông, a následně užší cestou rovně nahoru do oblasti vesnice La Pán Tẩn do vybraného ubytování.","Pevně věřím, že jste si celou oblast užili na plno!"],"food":["Jelikož je místní oblast odlehlá, najít dobré jídlo je poměrně složitější. Níže je seznam pár míst, která mám vyzkoušená. Další možností je také zkusit si domluvit oběd v turistických místech jako např. v Horkých pramenech Homestay Văn Tùng. Není to však jisté.","Nhà Hàng thế hùng - restaurace v vesnici Nậm Khắt.","Cơm, phở bò - prosté bistro v Ngọc Chiến."],"stay":["Vždy jsem bydlel v homestayi Hello Mu Cang Chai Homestay, jehož hlavní sílou je naprosto fantastická poloha na malém kopečku s výhledem do úžasného údolí. Často bývá plný a tak si ho raději rezervujte předem. Cesta vás dovede na malé vybagrované parkoviště pod kopcem a poté budete muset s batohy kousek pěšky na ubytování. V případě potřeby zavolejte nebo napište majiteli. Umí celkem dobře anglicky. Booking/Agoda","Lapantan Paradise - poměrně nové hezké ubytování v dřevěných chatkách. Booking/Agoda","A Su Homestay Mù Cang Chải - velmi dobrý homestay na kopci s nádherným výhledem a výborným jídlem. Booking","Mu Cang Chai Big view homestay - nový homestay s krásným výhledem dále od vesnice La Pán Tẩn. Booking/Agoda","Ještě před Mù Cang Chải se nachází velmi luxusní ubytování Mu Cang Chai Ecolodge. Nachází se na krásném místě ve velmi zapadlém údolí. Pokud si chcete dopřát pohodlí v krásném prostředí, toto je jasná volba. Nabízí klasické společné homestay ubytování, ale i privátní dřevěné domky. Booking/Agoda","V celé oblasti se nachází mnoho ubytování. Zděné ubytovny jsou ve vesnici Púng Luông a homestaye, které v této oblasti obecně doporučuji, jsou rozeseté po celém okolí. Především pak v okolí severně od vesnice. Pro vyhledání klikněte na odkazy níže."],"budget":{"jidlo":250000,"ubytovani":150000,"benzin":60000,"ostatni":0,"celkem":460000,"pozn":""},"brief":"Cesta do Mù Cang Chải přes odlehlé a méně známé oblasti Ngọc Chiến známé svými horkými prameny, ale i krásnými vesnicemi a rýžovými poli.","phase":"hory","from":"Khau Phạ","to":"Mù Cang Chải","vasek":"Výjezd průsmykem Khau Phạ a následně sjezd do na terasovitá rýžová pole nejhezčí oblast Mù Cang Chải, kde strávíte 2 noci. Přejezd je poměrně rychlý a na oběd budete na místě. Tamní oblast je prakticky jedno velké táhlé údolí a na odpoledne vám naplánuju průzkum pravé strany údolí, kde budete i bydlet, takže bude všechno blízko."},{"n":8,"weekday":"neděle","date":"18. 10. 2026","theme":"RÝŽOVÁ TERASOVITÁ POLE","fromto":"Mù Cang Chải Mù Cang Chải","km":"59 km","time":"2h 50m","profile":"hlavní tah, vesnické cesty, offroad","pois_pdf":[{"n":"TRŽNICE NGÃ BA KIM","d":"Místní tržnice ve vesnici Púng Luông."},{"n":"VÝLET PO OKOLÍ PŘES LA PÁN TẨN A MÂM XÔI","d":"Minimálně 10 km okruh po horách přes vesnici La Pán Tẩn s možností navštívení mnoha vyhlídek a Hill of Wind."},{"n":"VÝLET ODLEHLÝMI VESNICEMI PO OKOLÍ","d":"Minimálně 13km okruh po vedlejších cestách podél okolních kopců mimo hlavní silnici v hlavním údolí oblasti Mù Cang Chải. Možnost vystoupat na vyhlídku Dinosauří hřbet."},{"n":"VYHLÍDKA KOŇSKÁ PODKOVA","d":"Nejkrásnější místo na západ slunce v celé oblasti."}],"program":["Dnes se vydáte prozkoumávat „srdce“ Mù Cang Chải - oblasti proslavené svými obrovskými terasovitými rýžovými poli. V posledních pár letech se právě toto místo stává alternativou k dnes již velmi přeplněné Sapě a postupně, ale jistě přebírá pomyslnou korunu jako “go to” destinace za rýžovými terasovitými poli v období jejich dozrávání - tedy na přelomu září a října. Oblast charakterizuje hlavní cca 11 km dlouhý hlavní průsmyk s terasovitými poli, kterým vede silnice QL32, a je z obou stran obklopená vysokými kopci s terasami. Místní kopce jsou velmi strmé a tudíž jsou rýžová pole poměrně krátká a hlavně vysoká. Vytváří tak překrásné kaskádovité scenérie. Spolu s pozorováním sklizně místními farmáři patřící k etniku Hmong je to vážně nádherná a zajímavá podívaná. Okolní kopce jsou mimo jiné “prolezlé” mnoha cestami dávající tak možnost opravdu důkladně prozkoumávat celé okolí a získávat tak spoustu krásných výhledů. Plán na dnešní den je rozdělen na několik menších tras, jelikož již výše zmíněný hlavní průsmyk se dá projet celkem rychle po hlavním tahu, avšak to nejzajímavější se skrývá výše v horách mezi vesnicemi a poli. Možností bude více a záleží jen na vás, kolik z toho budete schopní nebo chtít stihnout. Po cestě zažijete jistě mnoho “wow” efektů, které celý den mohou časově velmi ovlivnit.","Vesnice Púng Luông bude pomyslným výchozím bodem dnešního zkoumání. Pokud se vydáte rovně po hlavním silničním tahu QL32, vjedete přímo do hlavního průsmyku s terasovitými poli. Doporučuji však rovnou odbočit vpravo a vydat se na trasu Výlet po okolí přes La Pán Tẩn a Mâm Xôi (červeně značená trasa), která ihned nabídne více odlehlé cesty, vesnice, velké množství menších i větších vyhlídek a nakonec skončíte zpět na hlavním tahu v údolí.","Hned po odbočení vpravo začnete vyjíždět nahoru a brzy se dostanete do oblasti vesnice La Pán Tẩn. To se v posledních letech stává hlavním místem, kde se koncentruje obrovské množství místních homestay ubytování. Rozvoj je zde opravdu rapidní. V roce 2018 zde byl pouze jeden jediný homestay. Dnes jich jsou zde desítky. Atmosféra zde je však stále příjemná, jelikož oblast tvoří samostatné menší údolí s krásnými výhledy a obecně máte pocit, že jste všemu tak trochu blíže, než v hlavním údolí. Jednoduše se držte červené trasy a projíždějte vyznačené vyhlídky. Cesty se různě mění, občas narazíte na pískovou nebo štěrkovou cestu, ale obecně jsou všechny dobře sjízdné. Postupně se budou měnit úseky mezi vesnicemi, poli a stále dokola.","Po pár kilometrech odbočte mírně vpravo a hned za zatáčkou po levé straně budete mít fantastický výhled do hlavního údolí. Uvidíte zde přímo dolů na hlavní silnici QL32 a jeho okolí. Vidíte ten horský pás na druhé straně? I tam se dnes budete moci vydat, ale o tom až později. Pokud chcete a máte dost času (1-2 hodiny), pokračujte dále po vyznačené červené trase. Toto je odlehlejší cesta, kam už většina lidí zřídka zamíří. Cílem pro vás je Đồi của Gió (Hill of Wind), což je horský výběžek přímo uprostřed obrovských terasovitých polí a opět s výhledem dolů do hlavního údolí. Toto místo je jedno z mých absolutně nejoblíbenějších co se kombinace výhledu a blízkosti k polím týče. Dojít tam ale budete muset raději pěšky, jelikož cesta dolů je úzká a bahnitá. Bod, kde začíná cesta dolů je vyznačen jako odbočka dolů do polí. Teoreticky se kus ještě na motorce dá jet, avšak později jsou cesty pouze pěší. Záleží na vaší schopnosti jízdy v terénu a aktuálních podmínkách, ale nejjistější je nechat motorku nahoře u silnice a vydat se po svých. Cesta tam i zpět s kratším pobytem na místě vám zabere zhruba 1 hodinu.","Vraťte se pak tou samou cestou zpátky, odbočte doprava a pokračujte po červené trase. Dalším cílem je vyhlídka Mâm Xôi Viewpoint, což je místní absolutně nejznámější turistický bod vůbec. Je propagovaný po celé zemi i zahraničí, kvůli svým hezky zahnutým a obdělaným polím. Velmi fotogenické linie terénu pověst tohoto místa sice obhajují, avšak celkový fame hlavně o víkendech v období dozrávání rýže způsobují naprosto fascinující, až komické přeplnění turisty. Většina turistů se na toto místo dostává z parkoviště pro Mâm Xôi Viewpoint na hlavní silnici dole, kde začíná strmá a úzká cesta nahoru, kde se koncentruje obrovské množství moto taxikářů, kteří tam turisty vozí. Jednou jsem sledoval skoro neuvěřitelná videa, jak je tato několik kilometrů dlouhá úzká cesta doslova ucpaná motorkami s turisty tak, že se nedalo jet ani jedním směrem. Místní infrastruktura absolutně nevyhovuje masovému návalu především vietnamských turistů, kteří sem jezdí za lovením fotek v půjčených krojích etnických menšin. Vy každopádně přijedete z druhé strany, která je pouze pro místní nebo sólo cestovatele, takže se tomuto šílenství vyhnete. Příjezd by tak měl být jednoduchý, avšak na rovinu vás upozorňuji, že pokud bude koncetrace turistů vysoká, nejezděte tam a rovnou využijte možnost sjet dolů na hlavní a vynechat Mâm Xôi Viewpoint úplně. Již dosud jste viděli mnoho krásných výhledů a nezažijete zde nic převratně jiného. Pokud vás tedy vyloženě nezajímá vidět na vlastní oči, jak se reálně vietnamští turisté chovají.","Tak či tak, vrátíte se dolů na hlavní silnici a měli byste za sebou mít celé dopoledne. Vydejte se tak zpět do vesnice Púng Luông, kde si můžete dát bufetový oběd v Quán Thu Phương Qcp. Když jste tady, zkontrolujte si hladinu benzínu a případně dotankujte na místní čerpací stanici, jelikož další následující terén je členitý a spotřeba tak vyšší.","Dalším směrem je Výlet odlehlými vesnicemi po okolí (zeleně značená trasa), která vás povede na již zmíněnou druhou stranu údolí. Zde to bude delší, cesty užší, méně vesnic a v druhé polovině pouze offroadové cesty. Pokud jste červenou trasu zvládli snadno, tak se zde nemáte vyloženě čeho bát. Menší výzva to v některých úsecích ale jistě bude. Jsou 2 možnosti, jak tuto cestu započít. Vydat se od začátku po zelené, kde je cesta zpevněná a snadná, anebo vydat se po hnědé trase přes lanový most a následným offroadem lesem. Cesta každopádně není nijak strašná, respektive nic, co by se nedalo minimálně v pomalé rychlosti zvládnout. O ffroadů vás však dále bude čekat víc a víc, takže pokud chcete, můžete šetřit síly na později.","Pokračujte stále dále po zelené trase. Cestou opět budete projíždět krásné vyhlídky. Po pár dalších kilometrech narazíte na bránu a začátek offroadu pod malou přehradní nádrží. Vítejte v písku! Jezděte opatrně a vybírejte si dobrou stopu. V některých úsecích se pokud možno držte dále od kraje a dávejte především pozor na úseky, kde je mokré bahno, které opravdu velmi klouže. Nynějším cílem a obecně hlavním highlightem této trasy je tzv. Dinosauří hřbet. Ve Vietnamu se tak nazývají velmi úzké a strmé horské výčnělky připomínající právě hřbet dinosaura. Z pravidla tyto místa nabízejí překrásné výhledy a ani zde tomu není jinak. Dojeďte na začátek úzké cestičky, kde se můžete rozhodnout, zda zatočíte ostře vpravo, kde se dále nachází 2 opravdu hezké vyhlídky. Cesta je zde ale opravdu úzká, takže je zvážení jen na vás. Pokud se na to necítíte, pokračujte v klidu dále až na parkoviště, kde musíte nechat motorky a na vrchol “hřbetu” jít již pěšky. Toto místo je poměrně nové, avšak rychle získává na popularitě především od mladých Vietnamců cestující na motorce. Pár lidí tu tak jistě bude, ale nečekejte nic srovnatelného s Mâm Xôi. Po Dinosauřím hřbetu pokračujte dále, kde to již více méně bude sjezd dolů. Terén bude občas náročnější a prudší, tak brzděte více přední brzdou, případně sami zodpovědně zvažte, zda si na tento úsek troufáte, nebo se raději otočíte a vrátíte zpět. Pokud budete pokračovat dále, jeďte dolů rovně mezi poli až se dostanete k lanovému mostu za nímž najedete opět na hlavní silnici QL32 v údolí. Gratuluji!","Vzhledem k momentálnímu času a vaší náladě je třeba se rozhodnout, kam pokračovat dále. První možností je vyrazit dále po hlavní silnici a dojet na tzv. Koňskou podkovu, což je bez pochyby nejhezčí místo na pozorování západu slunce v celé oblasti. Druhou je se vydat směrem zpět a v podstatě tak konečně projet i vyhlášený hlavní průsmyk s terasovitými poli, kam jezdí drtivá většina lidí. Co se “Koňské podkovy” týče, tak je to opravdu krásné místo. Jde o malinkatý výsek terasovitých polí do tvaru koňské podkovy, nebo širšího tvaru písmene “U”, chcete-li. Směřuje absolutně na západ a dává tak ideální výchozí bod na pozorování západu slunce nad protější horou, přilehlým okresním městem Mù Cang Chải a samozřejmě samotnými rýžovými poli. Stejně jako Mâm Xôi i toto místo je turisticky extrémně profláklé. V hlavní sezóně jsem ho ještě nezažil, ale téměř jistě to zde bude také přeplněné. Cesta nahoru začíná na vjezdu na Koňskou podkovu a kopec je opravdu velmi, velmi strmý a navíc offroadový. Věřte mi, že i ve dvou na skútru se to dá vyjet jen tak tak s tím, že musíte jet plný plyn na jedničku. Z toho důvodu dole vždy stojí mraky moto taxikářů, kteří turisty nahoru vozí. Pokud nejste vyloženě zkušený jezdec a dobře neznáte možnosti své i stroje na kterém jedete, nevydávejte se tam po svých a využijte služeb moto taxi. Když jsem tam byl naposledy minulý rok, tak se horní úsek cesty každopádně opravoval (nenechte se zmást počátečním výjezdem, který byl vždy betonový, ale offroad začínal až za zhruba 3. prudkou zatáčkou). Je tak možné, že je již celá zpevněná a tak snáze průjezdná. I tak ale buďte opatrní a to především v těch nejstrmějších úsecích, kde kdybyste spadli, motorka začne jednoduše sjíždět dolů a rozjezd bude složitý.","Tak či tak, pokud zde strávíte západ slunce, musíte počítat, že následná cesta domů zpět bude po tmě. Neuvidíte tím také ty nejprofláklejší výhledy v hlavním údolí, avšak z mého pohledu to nevadí, jelikož jste viděli opravdu velké množství jiných během celého dne. Vezměte tak všechny tyto faktory v úvahu, zda se na Koňskou podkovu chcete vydat nebo ne. Pokud sem nepojedete strávit západ slunce, tak návštěva tohoto místa ztrácí smysl a raději jeďte stihnout hlavní průsmyk, který za měkkého podvečerního světla je také velmi krásný."],"food":["Obecně se dá najíst v vesnici Púng Luông nebo okresním městě Mù Cang Chải. V obou místech se nachází více menších restaurací a jídelen. Jistě i v hlavním průsmyku jsou zcela nové. Nemám je však prozkoumané, jelikož jsem zde vždy maximálně obědval a to v Quán Thu Phương Qcp - dobrá obědová restaurace v Púng Luông. Buďte zde ale v čase oběda, než jídla dojdou a zavře se na odpolední přestávkou."],"stay":["Vždy jsem bydlel v homestayi Hello Mu Cang Chai Homestay, jehož hlavní sílou je naprosto fantastická poloha na malém kopečku s výhledem do úžasného údolí. Často bývá plný a tak si ho raději rezervujte předem. Cesta vás dovede na malé vybagrované parkoviště pod kopcem a poté budete muset s batohy kousek pěšky na ubytování. V případě potřeby zavolejte nebo napište majiteli. Umí celkem dobře anglicky. Booking/Agoda","Lapantan Paradise - poměrně nové hezké ubytování v dřevěných chatkách. Booking/Agoda","A Su Homestay Mù Cang Chải - velmi dobrý homestay na kopci s nádherným výhledem a výborným jídlem. Booking","Mu Cang Chai Big view homestay - nový homestay s krásným výhledem dále od vesnice La Pán Tẩn. Booking/Agoda","Ještě před Mù Cang Chải se nachází velmi luxusní ubytování Mu Cang Chai Ecolodge. Nachází se na krásném místě ve velmi zapadlém údolí. Pokud si chcete dopřát pohodlí v krásném prostředí, toto je jasná volba. Nabízí klasické společné homestay ubytování, ale i privátní dřevěné domky. Booking/Agoda","V celé oblasti se nachází mnoho ubytování. Zděné ubytovny jsou ve vesnici Púng Luông a homestaye, které v této oblasti obecně doporučuji, jsou rozeseté po celém okolí. Především pak v okolí severně od vesnice. Pro vyhledání klikněte na odkazy níže."],"budget":{"jidlo":300000,"ubytovani":150000,"benzin":30000,"ostatni":0,"celkem":480000,"pozn":""},"brief":"Celodenní průzkum centra oblasti Mù Cang Chải notoricky proslavené nádhernými terasovitými poli.","phase":"hory","from":"Mù Cang Chải","to":"Mù Cang Chải","vasek":"Celý den bez batohů a pošlu vás prozkoumat levou stranu údolí, což je pomalým tempem na celý den. Masivní vyhlídky, rýžová pole, dám ti tam i tip na offroad, prostě spousta srandy. :)"},{"n":9,"weekday":"pondělí","date":"19. 10. 2026","theme":"K HRANICI S ČÍNOU","fromto":"Mù Cang Chải Lào Cai","km":"184 km","time":"4h 30m","profile":"kvalitní široké cesty, horské průsmyky, ke konci špinavější a rušnější úsek","pois_pdf":[{"n":"TRŽNICE V LÀO CAI","d":"Tržnice Kim Tân a A Cốc Lếu jsou 2 hlavní tržnice města."},{"n":"HRANIČNÍ PŘECHOD DO ČÍNY","d":"Nejznámější hraniční přechod s Čínou vedoucí z města přes most nad Rudou řekou na čínskou stranu."},{"n":"VÝLET ODLEHLÝMI VESNICEMI PO OKOLÍ","d":"13km okruh po vedlejších cestách podél okolních kopců mimo hlavní silnici v hlavním údolí oblasti Mù Cang Chải."},{"n":"ALTERNATIVNÍ TRASA PŘES SAPU","d":"Možnost jet do Lào Cai přes turisticky nejznámější a nejrušnější horskou oblast na severu - Sapu."}],"program":["Dnes vás čeká dlouhá cesta do hlavního pohraničního města severu s Čínou - města Lào Cai. Délka trasy je téměř 200km, což je v horách už blízko dennímu maximu. Stále je to však s brzkým ranním odjezdem zvládnutelné. Počítejte tak s tím a zbytečně se nezdržujte. Pokud jste včera nestihli a máte chuť a čas, můžete si stále udělat výlet odlehlými vesnicemi po okolí. Případně se nabízí všechny ostatní místa v oblasti Mù Cang Chải uvedené ve včerejším plánu.","Celá dnešní trasa bude v duchu hezkých, pohodových a poměrně rychlých cest. Zásadní pro vás bude si vybrat kudy do cíle pojedete, jelikož se nabízí 2 možné trasy:","1)Z bodu křižovatka odbočit doprava na východ a vydat se velmi odlehlou, krásnou a přírodní krajinou s autentickým vesnickým životem a minimálním provozem. Silnice prakticky kopíruje jižní stranu Národního parku Hoàng Liên s vysokými horami a nabízí tak krásné výhledy. V poslední době jezdím pouze tudy, jelikož místní čistá krajina je přesně to, co při cestování vyhledávám. Hned ze začátku nabízí krásný průsmyk Khau Cọ s pár hezkými výhledy a poté je to již jedna pohodová zatáčka za druhou. Na cestě narazíte jen na pár menších vesnic a až po 50 km přijedete do většího okresního města Văn Bàn. Odsud se vydáte na sever přímo do cíle a to přes zcela nový fantastický nový úsek, který stále drtivá většina lidí nezná, bude tu tak minimální provoz, hluboká údolí, budete kopírovat tentokrát východní stranu národního parku, a opět si tak můžete užít krásnou horskou krajinu nabízející mnoho výhledů.. Až na jejím konci se napojíte zpět na původní hlavní tah, kde kvůli obrovskému chemickému průmyslovému areálu jezdí více kamiónů a cesta je špinavá. Za nájezdem na dálnici to však již bude v pořádku a samotný příjezd do města je dlouhá a široká nová rovina. Celou tuto trasu většina lidí nejezdí, jelikož se všichni vydávají na sever na Sapu, což je druhá možnost. 2)Alternativní trasa přes Sapu je v podstatě identicky dlouhá, jako první možnost. Obecně je více rušnější a vede spíše horami, než vesnicemi. Cesta je kvalitní a lákadlem jistě může být skvělý a známý průsmyk Ô Quy Hồ těsně před městem Sa Pa. Sapa obecně je aktuálně epicentrum masového horského turismu v severním Vietnamu. Je absolutně neskutečné, jak dramaticky se dá jedna oblast přizpůsobit turismu. Městečko samotné je doslova přecpané hotely, resorty a bizarními stavbami. Všude je spousta turistů mačkajících se v autobusech a místních atrakcích - vodopády, terasovitá pole, nejvyšší hora Vietnamu Fan Si Pan s novou kabinovou lanovkou Dopplemayr. Já osobně jsem z tohoto místa po první návštěvě v roce 2016 neměl dobrý pocit. Poté jsem se tam 3x vrátil během Vietnamské jízdy, abych spolucestovatelům ukázal, kam až to může zajít. Dnes sem již nejezdím vůbec, jelikož ve srovnání se vším ostatním, co se během cesty po severu dá vidět, to za to opravdu nestojí. Tuto variantu tak zmiňuji pouze proto, pokud byste si chtěli vyloženě “odškrtnout”, že jste byli v Sapě. Z hlediska turistiky a poznávání to vzhledem k dalším místům, které jste navštívili a ještě navštívíte, nemá smysl.","Ať už se vydáte jakoukoliv cestou, tak v cílovém městě je největším zážitkem dojet se podívat na místní hraniční přechod do Číny. Budete jí mít doslova na dosah naproti přes Rudou řeku a přes most, který tvoří hraniční cestu, budete moci pozorovat lidi, kteří v kufrech převáží zboží z jedné strany na druhou. Převážně tedy z té čínské na vietnamskou. Velmi zajímavé je také pozorovat architektonický rozdíl budov obou stran. Nejblíže se k mostu dostanete z bodu výhled na hraniční přechod vedle kavárny Hồ Kiều Coffee, kde vám dovolí zaparkovat motorku a pěšky dojdete na vyhlídku vedle mostu."],"food":["Na oběd se můžete zastavit hned v první části cesty v Táo ẩm thực. Pokud se vydáte na Sapu, tak toto je poslední místo na jídlo, které znám. Od křižovatky dále si myslím již nic není.","Pokud se vydáte mou navrhovanou trasou, tak možnost k jídlu bude v městě Văn Bàn v klasické restauraci Nhà hàng Minh Chuyền nebo Lẩu Nướng 1990 BBQ, kde mají grily nebo hotpoty.","Místa, která mám vyzkoušená v Lào Cai:","Hồ Kiều Coffee - kavárna u výhledu na hraniční přechod.","Cà Phê Khánh Ly - další hezká kavárna ve městě u řeky.","Cơm bình dân Quyền 89 - klasický obědový bufet.","Bánh mì ba miền Lào Cai - vietnamské bagety.","Phở bò, phở xào, cơm rang - polévka phở, smažené nudle a rýže.","Město je opravdu velké a v podstatě všude narazíte na jídelnu nebo restauraci."],"stay":["V Lào Cai mám vyzkoušený Hướng Dương Hotel. Booking/Agoda","Ve městě se samozřejmě nachází obrovské množství hotelů všech úrovní. Doporučuji možná prozkoumat aktuální nabídku. Pro vyhledání klikněte na odkaz níže.","Pokud pojedete přes Sapu, tak dává smysl se zde ubytovat z důvodu kvalitnějších a luxusnějších hotelů, které jinde na severu nejsou."],"budget":{"jidlo":350000,"ubytovani":175000,"benzin":100000,"ostatni":0,"celkem":625000,"pozn":""},"brief":"Dlouhý přejezd do pohraničního města Lào Cai. Možnost jet přes turisticky nejznámější oblast v severním Vietnamu – Sa Pa.","phase":"hory","from":"Mù Cang Chải","to":"Lào Cai","vasek":"Opuštění oblasti Mù Cang Chải a celodenní přejezd dále na sever k hranici s Čínou a to pohraničního města Lào Cai. 184 km je dost, ale aby celý plán seděl dohromady, je třeba toto ujet. Každopádně, jak jsem psal už výše, tak po cestě nejsou vyloženě žádné extra zastávky a když si to člověk rozkouskuje na etapy zhruba po 40-50 km, tak odpoledne jste v pohodě na místě."},{"n":10,"weekday":"úterý","date":"20. 10. 2026","theme":"VÍTEJTE V HORÁCH SEVERNÍHO VIETNAMU!","fromto":"Lào Cai Mường Khương","km":"109 km","time":"3h 12m","profile":"město, horské průsmyky","pois_pdf":[{"n":"VODOPÁD TÀ LÂM","d":"Hezký vodopád u cesty před městem Mường Khương."},{"n":"HRANIČNÍ PŘECHOD DO ČÍNY","d":"Nejznámější hraniční přechod s Čínou vedoucí z města přes most nad Rudou řekou na čínskou stranu."},{"n":"TRŽNICE MƯỜNG KHƯƠNG","d":"Slavná velká tržnice etnických menšin v městě Mường Khương."},{"n":"PŘEKRÁSNÁ ÚDOLÍ PODÉL HRANICE S ČÍNOU","d":"Neuvěřitelná horská údolí v okolí Mường Khương podél hranice s Čínou."}],"program":["Cesta do města Mường Khương nabízí 2 trasy, kdy Trasa 1 je velmi rychlá po kvalitní a krásné silnici. Provoz bude minimální a místní prostředí velmi autentické. Na začátku ještě více v nížině budete projíždět kolem čajových plantáží, které tuto oblast proslavují. Dále před městem samotným naopak hory začnou být velmi členité a budete projíždět několika nádhernými obrovskými údolími. Jsou tu úžasné výhledy, vesnice etnických menšin a také mnoho různých cest mimo hlavní silnici. Pokud budete mít náladu, kdekoliv si dle pocitu odbočte a vydejte se prozkoumávat místní okolí. Hory jsou zde krásné a nabízí mnoho skrytých míst a různých perspektiv výhledů.","Trasa 2 je dvojnásobně delší a především vede mnohem odlehlejšími, až téměř zapomenutými oblastmi, které se až poslední dobou začínají trochu rozvíjet novými cestami a školami. Z Lào Cai se vydejte stejně, jako po Trase 1, avšak po hlavní silnici AH14 pokračujte dále. Následně kousek před vyznačenou čerpací stanicí odbočte vlevo severně směrem na Cốc Ly, kde se nachází známá vodní přehrada. Je zde velmi hezký výhled především z místního mostu. Cesta odsud dále je již prakticky neustálý výjezd do hor směrem do Mường Khương. Cesta je to velmi odlehlá využívaná pouze místními a mám jí rád i proto, že nabízí několik výhledů do úchvatného hlubokého údolí po pravé straně. Pár výhledů se naskytne přímo z cesty, avšak velmi doporučuji si za vesnicí Cao Sơn odbočit doprava a po pár kilometrech se vám naskytne mnoho širokých výhledů do údolí. Pokochejte se výhledy a pokud chcete, můžete si sjet ještě kousek níže do opravdu lokální vesnice Sảng Lùng Chéng.","Vraťte se zpět na vyznačenou trasu a pokračujte rovně až do města Mường Khương, které samotné je známé především místní poměrně velkou tržnicí. Nejvíce rušná je ale samozřejmě ráno a nejvíce v neděli. Jistě ale bude i tak zajímavou zastávkou kdykoliv jindy. Jistě ale bude i tak zajímavou zastávkou kdykoliv jindy.","Nejkrásnější část okolí ale začíná za městem směrem do městečka Si Ma Cai. Tady projedete podél opravdu ohromného údolí, které tvoří hranici Vietnamu s Čínou. Budete doslova koukat na druhou stranu mohutných hor, které již patří Číně. Jejich velikost, sklon a hloubka je fascinující. Celou cestu jsou to vážně krásné průsmyky s mnoha vyhlídkami. Máte dostatek času a tak doporučuji se v Mường Khương ubytovat a udělat si do této oblasti pohodlný výlet bez batohů. Pojedete tudy každopádně i zítra, ale tato oblast je tak nádherná, že rozhodně stojí za to tu zůstat déle a spontánně prozkoumávat celé okolí nebo se jen dlouze kochat výhledy."],"food":["Hồ Kiều Coffee - kavárna u výhledu na hraniční přechod v Lào Cai.","Cà Phê Khánh Ly - další hezká kavárna ve městě Lào Cai u řeky.","Cơm bình dân Quyền 89 - klasický obědový bufet v Lào Cai.","Bánh mì ba miền Lào Cai - vietnamské bagety v Lào Cai.","Phở bò, phở xào, cơm rang - polévka phở, smažené nudle a rýže v Lào Cai.","Restaurace v Mường Khương - hlavní ulice ve městě, kde je spoustu restaurací.","Bánh cuốn - dům č. 28 - velmi dobré bánh cuốn. Pravděpodobně prodává pouze k snídani."],"stay":["Online rezervace ubytování je zde nemožná. Je to tak odlehlé místo mimo turistické trasy, že zde žádné ubytování není na Bookingu ani Facebooku. Vše se tak musí domlouvat pouze telefonicky nebo přímo na místě. Možností ubytování tu však je poměrně dost.","Khách sạn Mường Khương - jednoznačně nejlepší ubytování a jediný opravdový hotel v Mường Khương.","Několik nhà nghỉ v Mường Khương - hlavní ulice ve městě, kde je několik jednoduchých ubytování “nhà nghỉ”. Vyberte si dle dostupnosti, ceny a pro vás vhodných/dostatečných pokojů."],"budget":{"jidlo":300000,"ubytovani":125000,"benzin":60000,"ostatni":0,"celkem":485000,"pozn":""},"brief":"Pohraniční město Lào Cai. Úchvatná a zřídka navštěvovaná horská oblast podél hranic s Čínou.","phase":"hory","from":"Lào Cai","to":"Mường Khương","vasek":"Zpět do kratších etap s tím, že ráno se dá prozkoumat město, kouknout přes řeku na druhou stranu do Číny a následně před polednem se vydat zpátky na cestu do hor."},{"n":11,"weekday":"středa","date":"21. 10. 2026","theme":"OBLAST HOÀNG SU PHÌ","fromto":"Mường Khương Vinh Quang","km":"143 km","time":"4h 15m","profile":"krásné průsmyky, krátký offroad, dobré průsmykovité cesty údolím, betonové","pois_pdf":[{"n":"TRŽNICE MƯỜNG KHƯƠNG","d":"Slavná velká tržnice etnických menšin v městě Mường Khương."},{"n":"TRŽNICE CỐC PÀI","d":"Tržnice etnických měnšin v městečku Cốc Pài."},{"n":"TRŽNICE VINH QUANG","d":"Tržnice etnických měnšin v městečku Vinh Quang."},{"n":"PŘEKRÁSNÁ ÚDOLÍ PODÉL HRANICE S ČÍNOU","d":"Neuvěřitelná horská údolí v okolí Mường Khương podél hranice s Čínou."},{"n":"OBLAST BẢN PHÙNG","d":"Krásná oblast s vysokými horami a terasovitými poli kousek od Vinh Quang."}],"program":["Dnes vstoupíte do jednoho z okresů provincie - Hoàng Su Phì, která je již dnes poměrně turisticky známá, ale na svůj opravdový boom teprve čeká. Nabízí nádherná široká údolí pokrytá rýžovými políčky a mezi nimi spoustou vesnic etnických menšin. Také je zde pár zajímavých možností na výlety po okolních vysokých horách, které se dají zkombinovat s ubytováním v jednom z mnoha homestay v oblasti.","Jelikož je zde více možností, je velmi důležité se rozhodnout, kterou kdy zvolíte a tomu přizpůsobit výběr ubytování - v městečku Vinh Quang, některém homestay po cestě nebo doporučeném cíli ve vesnici Thông Nguyên. Sem doporučuji dojet, pokud chcete mít klidnější den a užít si případné krásné ubytování tam. Jelikož je ale oblast pestrá na více různých aktivit, popíšu vám sem všechny možnosti, abyste se mohli sami rozhodnout podle aktuální chutě.","Ráno každopádně vyjeďte z města směrem do městečka Si Ma Cai, kde uvidíte pro mě jedny z nejúžasnějších údolí na severu vůbec. Pojedete podél opravdu ohromného údolí, které tvoří hranici Vietnamu s Čínou. Budete doslova koukat na druhou stranu mohutných hor, které již patří Číně. Jejich velikost, sklon a hloubka je fascinující. Celá další cesta jsou ale vážně krásné průsmyky s mnoha vyhlídkami. Po napojení se na silnici DT153 odbočte doleva, kde vede nová cesta až do Cốc Pài, kde se nezapomeňte zastavit na kafe nebo pivo v kavárně s výhledem na město. Cốc Pài také může být vhodnou zastávkou na oběd.","Pokračujte dále velmi pohodovou zatáčkovitou cestou směrem na Vinh Quang. Pár kilometrů před ním budete moci odbočit prozkoumat oblast Bản Phùng a Bản Phùng Viewpoint po cestě. Je to odlehlá oblast s krásnými výhledy, vysokými horami a obrovskými rýžovými terasovitými poli. Mimo jiné je to také stoupání z 400 do 1000 m.n.m. Cesta je dlouhá 14 km a trvá 35 min. Nahoře je případně i velmi prosté homestay ubytování na okraji údolí s nádherným a místním velmi známým výhledem. Bohužel však ubytování není rezervovatelné na internetu a tak pouze telefonicky nebo vyzkoušet osobně na místě. Ta oblast za to ale rozhodně stojí."],"food":["Více restaurací s phở a cơm rang v Si Ma Cai - malá boční ulice, kde je několik jídelen vedle sebe.","Kavárna s výhledem na město - krásná terasa nad městečkem Cốc Pài.","Ve všech městečkách a vesnicích po cestě je poměrně dost možností jídla. Nečekejte však vysokou nabídku a úroveň.","V Cốc Pài je dobrá restaurace Nhà hàng Tuấn Mẩu.","V Vinh Quang doporučuji restauraci Bia Hơi Tuấn Thuấn a na snídani Phở Vương Diu.","Každé homestay ubytování vám samozřejmě poskytne bohatou rodinnou večeři i snídani."],"stay":["V mapě jsem označil spoustu ubytování v celé oblasti.","Pokud budete potřebovat přespat už v Cốc Pài, tak doporučuji Nhà nghỉ Ngọc Sơn, nebo Nùng Gia HomeStay s hezkou terasou a výhledem do údolí.","V oblasti Bản Phùng doporučuji Trọng Phú Homestay.","V Vinh Quang Hotel Tay Con Linh nebo Thanh Vân Homestay.","V širším okolí Vinh Quang se nachází spousta homestay ubytování. Mezi mé tipy patří Nậm Lỳ Retreat Booking/Agoda, nebo o trochu vzdálenější, ale naopak strategicky blíže vrcholu hory Chiều Lâu Thi - Lagom Su Phì Homestay Agoda, nebo Long Chiều homestay.","Pro ubytování v celém kraji Hoàng Su Phì klikněte na odkazy níže."],"budget":{"jidlo":300000,"ubytovani":125000,"benzin":80000,"ostatni":0,"celkem":505000,"pozn":""},"brief":"Úžasná obrovská údolí a průsmyky, vesnice etnických menšin. Opravdový klenot této oblasti. Přejezd do horské oblasti Hoàng Su Phì proslavené svými kaskádovitými rýžovými terasami.","phase":"hory","from":"Mường Khương","to":"Vinh Quang","vasek":"Krásný opuštěný úsek podél hranice masivním údolím v první polovině. V té druhé je to pak svižnějších posledních zhruba 60 km táhlým údolím podél řeky do Vinh Quang, které je hlavním městečkem oblasti Hoàng Su Phi známé taky krásnými terasovitými poli, ale tady už tou dobou budou nejspíš sklizená."},{"n":12,"weekday":"čtvrtek","date":"22. 10. 2026","theme":"HORA CHIÊU LẦU THI","fromto":"Vinh Quang Vinh Quang","km":"112 km","time":"4h 50m","profile":"vesnické cesty","pois_pdf":[{"n":"HORA CHIỀU LÂU THI","d":"S vrcholem 2402 m.n.m. druhá nejvyšší hora provincie Hà Giang a severovýchodního Vietnamu. Přístupná z dvou stran po 15 km náročné offroad cestě a poté cca 30 minutový trek na vrchol."},{"n":"OBLAST BẢN PHÙNG","d":"Krásná oblast s vysokými horami a terasovitými poli kousek od Vinh Quang."}],"program":["Okolí městečka Vinh Quang je hlavním centrem tzv. oblasti Hoàng Su Phì známé především svými krásnými terasovitými poli. V celém okolí se nachází několik velmi rozsáhlých údolí obklopených vysokými horami tvořící tak nádherná panoramata a spousta příležitostí k průzkumu. Místní infrastruktura je stále řekněme „ve vývoji“. Ač se oblast v průběhu let postupně mění, tak tempo je oproti ostatním, či sousedním provinciím mnohem pomalejší. Často tu tak narazíte na rozestavěné cesty, což v místním velmi členitém terénu může být občas i výzva. Možná ale právě i toto je důvod proč tato oblast stojí za hlubší průzkum, protože přes občasné strasti na cestě vám pak všechny nádherné výhledy, pocit dobrodružství a autentická setkání s místními dají o to víc.","Osobně oblast rozděluji na 2 hlavní části a to na horu Chiều Lâu Thi a následně celou rozsáhlou oblast a údolí severně od ní v mapě vyznačené jako Krásná horská cesta průsmykem a vesnicemi.","Cesta na Chiều Lâu Thi je minimálně půldenní výlet a nabízí 2 možné trasy:","- První trasa vedoucí z východní strany hory je nová zpevněná cesta a za zhruba 2 hodiny se snadno dostanete pod vrchol. - Druhá trasa vedoucí ze západní strany měří z Vinh Quang 45 km a 2h 27m podle mapy. Prvních 30 km rovnou projedete krásnou horskou cestou táhnoucí se průsmykem a vesnicemi s poli etnických menšin nebízející překrásné výhledy na okolí.","Pravá výzva ale začne za odbočkou, kdy se posledních 15 km velmi dobrá zpevněná cesta změní v náročný offroad a v podstatě území nikoho. Šotolina, kameny a občasné bahno vás budou provázet celou cestu. Po pár kilometrech a opravdu chudých a prostých “osadách\" nepotkáte už nikoho, kromě krav a koz, které se tu volně pasou. Nebudete mít ani mobilní signál. Je to opravdová zkouška na řidičské, fyzické a pro mnoho lidí i morální schopnosti.","Až dojedete unavení na vrchol, tak zjistíte, že tam vlastně ještě nejste a posledních 100 výškových metrů musíte vyšplhat po svých. Na vrcholu se při dobrém počasí naskytne 360 stupňový výhled z výšky 2402 m.n.m. I když neuvidíte vyloženě hodně do dálky, tak je to stejně krásné místo a ve spojení s vybojovanou cestou sem ve vás jistě zanechá velký zážitek.","Počasí je zásadní a zvažte ho už před jízdou nahoru. Např. v dešti sem rozhodně nejezděte. Také zde samozřejmě není čerpací stanice. Pokud zde ale potkáte lokály, tak vám benzín pravděpodobně prodají nebo dovezou.","Pokud náročnější offroady nevyhledáváte, jeďte po první trasou po nově zpevněné cestě a následně se po ní vraťte zpět. Abyste se následně nemuseli vracet přes město, tak blízko Nậm Lỳ Retreat odbočte vlevo a vydejte se po v mapě vyznačené trase a bodu Užší kopcovitá cesta (přes Google Maps lze navigovat pouze jako trasa pro pěší, avšak v realitě je na motorce sjízdná a zpevněná) díky které se výrazně rychleji dostanete na již zmíněnou severní část od hory Chiều Lâu Thi.","Tamní oblast je opravdu malebná nabízející mnoho dalekých výhledů a také velmi autentická, co se místního života týče. Nebojte se zastavovat, odbočovat a jednoduše prozkoumávat dle libosti. Podél a hlavně pod cestou se nachází několik vesnic a místní lidé mají z cizinců vždy stále ještě radost a zážitek.","Po cestě jeďte stále rovně, minete výše popsanou Odbočku na 15 km offroad nahoru a dojedete až k Odbočce a sjezdu do údolí. Zde velmi klikatými cestami sjedete zhruba 600 výškových metrů dolů k řece v údolí a přes dlouhý lanový most se napojíte na hlavní silnici ĐT178 po které jste sem včera přijeli a velmi rychle se již dostanete zpět do Vinh Quang.","Pokud stále máte čas a včera jste během příjezdu nestihli, tak máte možnost vyjet do oblasti Bản Phùng popsanou v včerejším dni."],"food":["V Vinh Quang doporučuji restauraci Bia Hơi Tuấn Thuấn a na snídani Phở Vương Diu.","Oběd během dne je zde upřímně velmi složitý. V místních vesnicích jen občas narazíte na lokální jídelny, které však nemají otevřeno pravidelně každý den. Jelikož se nacházíte v odlehlé oblasti s minimem turistů, tak hygiena je další otázkou. Za sebe doporučuji vzít si něco na cestu, nebo akceptovat např. ovoce, či sušenky z místních sámošek po cestě. Pokud i tak narazíte na otevřenou jídelnu, tak doporučuji ideálně mezi 11.-12. hodinou, kdy je vše ještě čerstvé."],"stay":["V mapě jsem označil spoustu ubytování v celé oblasti.","Pokud budete potřebovat přespat už v Cốc Pài, tak doporučuji Nhà nghỉ Ngọc Sơn, nebo Nùng Gia HomeStay s hezkou terasou a výhledem do údolí.","V oblasti Bản Phùng doporučuji Trọng Phú Homestay.","V Vinh Quang Hotel Tay Con Linh nebo Thanh Vân Homestay.","V širším okolí Vinh Quang se nachází spousta homestay ubytování. Mezi mé tipy patří Nậm Lỳ Retreat Booking/Agoda, nebo o trochu vzdálenější, ale naopak strategicky blíže vrcholu hory Chiều Lâu Thi - Lagom Su Phì Homestay Agoda, nebo Long Chiều homestay.","Pro ubytování v celém kraji Hoàng Su Phì klikněte na odkazy níže."],"budget":{"jidlo":400000,"ubytovani":200000,"benzin":60000,"ostatni":0,"celkem":660000,"pozn":""},"brief":"Celodenní průzkum oblasti Hoàng Su Phì. Výjezd a výšlap na 2402 m vysokou horu Chiêu Lầu Thi.","phase":"hory","from":"Vinh Quang","to":"Vinh Quang","vasek":"Naplánoval jsem vám zůstat celý den v této oblasti ať už kvůli odpočinku, tak průzkumu oblasti (rýže sice už nejspíš nebude, ale místní výhledy a hory jsou masivní), tak možné aktivitě dojet pod vrchol 2402 m.n.m. vysoké hory a následně zhruba 30 min výšlap na vrchol s 360 stupňovým výhledem do okolí."},{"n":13,"weekday":"pátek","date":"23. 10. 2026","theme":"OBLAST NA HANG","fromto":"Vinh Quang Lâm Bình","km":"149 km","time":"4h 8m","profile":"hlavní cesty, vesnické cesty","pois_pdf":[{"n":"VODOPÁD SU PHÌ","d":"Vodopád po hlavní trase do Hà Giang."},{"n":"JEZERO NA HANG","d":"Jezero vzniklé díky vodní přehradě s krásnými vápencovými útvary."},{"n":"VODOPÁD KHUỔI NHI","d":"Vysoký vodopád na jezeře, který se dá navštívit v rámci plavby."},{"n":"VODOPÁD THÁC MƠ","d":"Menší turistický vodopád kousek za městečkem Na Hang."},{"n":"PŘÍSTAV NA HANG","d":"Hlavní přístav pro plavby po jezeře."},{"n":"CHRÁM PÁC TẠ","d":"Malý chrám nad jezerem, který se dá navštívit v rámci plavby."},{"n":"HOÁ CHÉO PHÌN","d":"Slibná zajížďka na krásné výhledy a terasy po cestě do Hà Giang. Nemám prozkoumáno."}],"program":["Dnes vás čeká dvoudenní tzv. objížďka dnes velmi proslavené oblasti Hà Giang, která se však bohužel kvůli stále se zvyšujícímu počtu dopravních nehod velmi zpřísňuje co se týče dopravních policejních kontrol s primárním zaměřením na řidičské průkazy. Povedu vás tak trasou zahraničním, ale i mnoha vietnamským turistům prakticky neznámou oblast jezera Na Hang, kdy se následující den dostanete do městečka Bảo Lạc a celou oblast Hà Giang tak v podstatě podjedete.","Za Vinh Quang vás čeká krásná pohodová cesta. Budete se moci rozhodnout ještě navštívit pro mě neprozkoumanou oblast Hoá Chéo Phìn, která by stejně jako Bản Phùng měla nabízet krásná zapadlá údolí a terasy. Odtud každopádně už zamíříte stále rovně dolů směrem na křižovatku s hlavní silnicí QL2 vedoucí mezi Hanojí a Hà Giang.","Přes křižovatku se vydejte rovně po vedlejších zapadlých silnicích, abyste se vyhnuli objízdnou trasou přes město Bắc Quang, kudy by vás normálně vedly Google Mapy a je zde větší pravděpodobnost policejní kontroly. Po menší objížďce se napojíte na silnici QL279, která už vede přímo do cílové oblasti a městečka Na Hang.","Jako místo k přespání každopádně oblast Lâm Bình severně nad městem, která je takovou malebnou zapadlou oázou v malém údolí s rýžovými poli mezi vápencovými horami. Nachází se zde spousta homestay ubytování nabízející autentické a velmi klidné vesnické prostředí.","Oblast a jezero Na Hang jako takové se začaly proslavovat teprve před pár lety díky své „zapadlosti“, autentické lokální kultuře a samozřejmě nádherné přírodě a fotogenickými útvary na jezeře, které se dají pozorovat během plavby po něm. Hlavní branou je tak Přístav Na Hang kousek od stejnojmenného městečka, které se od Lâm Bình nachází zhruba 20 km a 40 min jízdy. Součástí plavby je i návštěva místního malého chrámu Pác Tạ na kopci nad jezerem a tako krásného vysokého vodopádu Khuổi Nhi s jeskyní pod ním. Teoreticky alternativní možností, kterou však ale nemám zatím osobně vyzkoušenou je se na jezero vydat z přístav Truyền Thủy, který se nachází přímo v Lâm Bình. Tuto možnost je však ideálně třeba vykomunikovat s ubytováním, které vám s tím jistě pomůže. Pokud byste nestíhali a do cíle přijeli později odpoledne, dá se ubytovat také přímo ve městě a jezero navštívit hned ráno následujícího dne. Případně se dá samozřejmě využít i rezervní den."],"food":["Dobře najíst se za mě dá pouze na křižovatce s hlavním silničním tahem QL2 mezi Hanojí a městem Hà Giang. Nachází se zde pár klasických restaurací s cơm, kde vám udělají minimálně smaženou rýži cơm rang. Má oblíbená je pak Cơm phở Hạnh Thủy, kde mají i výborné phở."],"stay":["Jelikož oblast ještě není moc přizpůsobena pro vítání zahraničních turistů, tak jen minimum z nich se dá zarezervovat přes tradiční online platformy.","An's homestay - Krásný tradiční homestay u vody. Facebook","Homestay Triệu Cường - Hezký homestay mimo jiné se zděnými bungalowy. Facebook","Homestay Trọng Hiếu - Řekněme normální homestay, který se však dá zarezervovat na Bookingu a Agodě. Booking/Agoda","Laben Ecolodge - Krásný a moderně vybavený ecolodge s prostornou zahradou a malým jezírkem. „Nejluxusnější“ ubytování v oblasti. Booking/Agoda","V městečku Na Hang pak doporučuji:","Lam's House Motel - Malý čistý motel s příjemným majitelem, který mluví anglicky. Booking/Agoda","Khách Sạn Thắng Sen - Místní poměrně velký hotel.","Sao farmstay - Modernější ubytování a farma v malém uzavřeném údolí hned za městem. Booking/Agoda"],"budget":{"jidlo":300000,"ubytovani":200000,"benzin":80000,"ostatni":0,"celkem":580000,"pozn":""},"brief":"Přejezd do vesnice Lâm Bình v oblasti Na Hang proslavené řekou a jezerem v údolí s vápencovými útvary. Odpolední plavba lodí.","phase":"hory","from":"Vinh Quang","to":"Lâm Bình","vasek":"První z dvou dnů objízdnou trasou, abyste se vyhnuli včera zmíněné oblasti Hà Giang, kde se dneska nekompromisně kontrolují řidičáky. Jsou to tak 2 dny pro vás trochu delších přejezdů, ale po cestě opět kromě měnící se krajiny nejsou vyloženě žádné aktivity a ta hlavní je projížďka lodí na jezeře v Lâm Bình."},{"n":14,"weekday":"sobota","date":"24. 10. 2026","theme":"PŘEJEZD DO CAO BẰNG","fromto":"Lâm Bình Bảo Lạc","km":"165 km","time":"5h 8m","profile":"vedlejší cesty, hlavní tahy","pois_pdf":[{"n":"JEZERO NA HANG","d":"Jezero vzniklé díky vodní přehradě s krásnými vápencovými útvary."},{"n":"VODOPÁD THÁC MƠ","d":"Menší turistický vodopád kousek za městečkem Na Hang."},{"n":"VODOPÁD PÁC HẨU","d":"Vodopád podél silnice."},{"n":"OBLAST HỒNG THÁI","d":"Hezká mikrooblast s terasovitými poli a lokálním Community Based Tourism modelem."}],"program":["Dnešní trasa je více méně přejezdová, avšak nabízí několik krásných úseků po cestě. Pokud jste včera nestihli navštívit jezero Na Hang, tak od brzkého rána to lze teoreticky ještě stihnout.","Cesta následně nepotřebuje moc popisu a doporučuji si jí rozdělit na logické úseky. Za městečkem Na Hang můžete zastavit u 2 vodopádů Thác Mơ a Pác Hẩu. Hezký výhled je i z mostu Đà Vị za nímž projedete místní vesnicí a na rozcestí odbočíte vlevo. Zde začíná další úsek po levé straně hlubokého údolí v kterém se mimochodem nachází posledních pár let nově turisticky se rozvíjející oblast Hồng Thái a to především mezi vietnamskými „campery“, což je trend, který začal vznikat během Covidu. Nachází se zde i poměrně mnoho homestay ubytování napříč celou vesnicí. Za mě dává smysl zde primárně zastavit a případně volně prozkoumat oblast. Dále po cestě projedete městečkem Pác Nặm, které je nejlepší a logickou zastávkou na oběd. Za ním projedete kratším, ale krásným úsekem údolím a zanedlouho dojedete na hlavní silnici QL34, kde odbočíte doleva odkud je to už kousek do cílového města Bảo Lạc."],"food":["V městečku Pác Nặm doporučuji restauraci Cơm Sang Thu, kde v dopoledních hodinách mají bohaté bufety cơm bình dân.","V městě Bảo Lạc jsem vyznačil uličku s pár restauracemi. V té se nachází i nová, hezká a opravdu výborná restaurace Nhà hàng Lê Ngân. Nenechte se odlákat často prázdným přízemím, kde je vstup. Místní vždy sedí v podzemním nebo nadzemním patře, kam se dostanete po schodech na konci restaurace.","Ve městě je případně i dobrá kavárnička An Hung Cafe."],"stay":["V městě Bảo Lạc doporučuji skvělý hotel Khách sạn Đức Tài. Pro rezervaci však musíte zavolat, nebo napsat na telefonní číslo uvedené v Google Mapě.","V blízkém okolí je pár dalších možností hezkých hotelů. Online se dají zamluvit:","Viet Hoang Hotel Bao Lac. Booking/Agoda","Bao Lac Homestay & Hostel.","Đức Anh Hotel. Agoda","Ostatní hotely jsou Khách sạn Quý Anh a Thuy Duong 2 Hotel."],"budget":{"jidlo":300000,"ubytovani":200000,"benzin":90000,"ostatni":0,"celkem":590000,"pozn":""},"brief":"Přejezd po vedlejších cestách a provinční silnici do městečka Bảo Lạc. Začátek provincie Cao Bằng.","phase":"hory","from":"Lâm Bình","to":"Bảo Lạc","vasek":"Delší přejezd horami do Bảo Lạc, čímž dokončíte „objížďku“ a vstoupíte do oblasti a provincie Cao Bằng."},{"n":15,"weekday":"neděle","date":"25. 10. 2026","theme":"BOŽSKÉ OKO","fromto":"Bảo Lạc Núi Mắt Thần","km":"124 km","time":"3h 45m","profile":"horské cesty, průsmyky, kvalitní silnice","pois_pdf":[{"n":"PRŮSMYK MẺ PIA","d":"Táhlý “hadovitý” průsmyk o 14 zatáčkách."},{"n":"VODOPÁD BẢN GIÀNG","d":"Vysoký vodopád v těsné blízkosti městečka Trường Hoà."},{"n":"HORA NÚI MẮT THẦN","d":"Vápencová špičatá hora s velkou „dírou“ pod její špičkou v překladu znamenající „božské oko“."}],"program":["Dnes vjedete do další provincie a s názvem Cao Bằng, která je mimo jiné známá nespočtem vápencových hor a nekonečnem malých izolovaných údolí mezi nimi. Vaším cílem bude právě jedno takové, které v posledních pár letech získává na čím dál tím větší popularitě díky špičaté hoře s „dírou“ v její horní části. Obklopená dalšími horami a krásnými travnatými planinami s často pasoucími se koňmi nabízí krásný zážitek a panoramata.","První polovina cesty bude se bude táhnout stále v horách. Již kousek za městem budete projíždět pár opravdu krásnými údolími a výhledy do nich. Následovat bude v poslední době stále populárnější průsmyk Mẻ Pia, který je ve stylu klasických rakouských pas - překonání velké výšky na krátké vzdálenosti. Místní průsmyk za 2,5 km a 14 zatáček překoná 200 výškových metrů. Vedle motorkářského zážitku je průsmyk i velmi fotogenický. Pro dobrou celkovou fotku si ale budete muset vyšlápnout ještě cca 20 minut do kopce výše džunglí, než se dostanete na ideální vyhlídkový bod. Cesta začíná u občerstvení Nông Văn Ngoan, jehož majitel - již velmi starý pán - jí i sám vybudoval. Právem si tak za vstup vybírá i nějaké drobné a obecně jsou se svojí ženou velmi pohostinní. Vždy tam stavím minimálně na pití a dnes je celé občerstvení nově zrekonstruované.","Cesta dále vede krásnými a velmi klidnými horskými oblastmi. Provoz je tu opravdu minimální a pocit opuštěnosti o to vyšší. Kus cesty pojedete i rozbitým úsekem silnice, který ale měří jen pár kilometrů a končí ve vesnici s vyznačenou restaurací cơm, phở, která je ideálním místem na rychlý oběd v půli cesty. Vydejte se dále na sever, kde budete pokračovat krásnou odlehlou průsmykovitou oblastí, dokud nedojedete na začátek hlavního tahu na Cao Bằng. Jelikož budete těsně u čínské hranice, pokud budete mít zájem, můžete se jet podívat na nedaleký hraniční přechod Sóc Giang. Upřímně to není vyloženě nic zajímavého - běžný a klidný hraniční přechod, který ale někoho může zajímat.","Po hlavní silnici dále zanedlouho dojedete do městečka Trường Hoà, kde se dá např. natankovat, nebo, pokud jste ještě nejedli, se zde dobře naobědvat v restauraci Nhà Hàng Minh Hiển. Přímo u města se také nachází vysoký vodopád Bản Giàng padající z vysokých přilehlých hor.","Z městečka se vydejte kousek zpět a pokračujte po vedlejších vyznačených silnicích v mapě směrem na jihovýchod. Hned nad městem se nachází pár hezkých vyhlídek a dále je cesta primárně o velmi pohodové jízdě po místních velmi kvalitních silnicích skrz údolí a kochání se místní velmi klidnou krajinou.","V cíli samotném kromě hory Núi Mắt Thần a přilehlého údolí nic dalšího není. Je to primárně krásná a velmi klidná destinace v jejíž blízkosti se dá přespat ve velmi hezkém Nhà Mộc Homestay, případně ve dvou bungalowech k němu patřící. Podle toho v kolik hodin dorazíte si můžete údolí projet ještě dnes. Já osobně většinou dojedu pouze na začátek, pokochám se z vyhlídky na horu a údolí hned na začátku a následně jedu rovnou na homestay, který je krásný a strávím tam zbytek dne. Samotné údolí pak nechávám na ráno příštího dne Pokud byste zde náhodou nechtěli spát, nebo jednoduše chtěli dnešní večer raději strávit ve městě, tak nedaleké hlavní provinční město je možnou alternativou. Město Cao Bằng je poměrně velké (přes 100 tisíc obyvatel), ale i přesto na můj vkus dost klidné, až nudné. Slouží primárně jako správní a obchodní centrum provincie. Nabízí ale samozřejmě mnoho služeb, co se jídla a pití týče, a tak je večer dobré se projít po centru např. přes hlavní náměstí, navštívit místní tržnice anebo se jen projít po hlavní večerní ulici s restauracemi a kavárnami."],"food":["Občerstvení Nông Văn Ngoan - vhodná zastávka na občerstvení na konci průsmyku Mẻ Pia.","Cơm, phở - vhodná zastávka na rychlý oběd, kde dělají klasickou rýži nebo phở.","Nhà Hàng Minh Hiển - velmi dobrá restaurace v městečku Trường Hoà.","Město Cao Bằng:","Than Hoa BBQ - moderní BBQ.","Hạt Dẻ Quán - velmi dobrá moderní restaurace s cơm a mnoha lokálními specialitami.","Hlavní večerní ulice s restauracemi a kavárnami - hlavní večerní ulice s mnoha podniky všech druhů. Stačí se projít a vybrat si dle chuti.","Phở chua gia truyền Quyên - tradiční podnik, který vede již 4. generace. Paní majitelka - dnes stará dáma - zde jako první začala vařit v této oblasti vyhlášené phở s grilovaným kachním masem - “phở vịt”. Rozhodně doporučuji. Ideální také jako snídaně."],"stay":["Nhà Mộc Homestay - krásný a velmi vkusně zařízený homestay s dvěma bungalowy. Homestay má i hezkou zahradu s jezírkem, výhledem na hory a minimálně 5 přeroztomilých psů. Facebook","Město Cao Bằng:","Hotel 89 - klasický vietnamský hotel nižší kategorie. Booking/Agoda","Max Boutique Hotel Cao Bangl - skvělý hotel vyšší střední kategorie přímo v centru města. Booking/Agoda","Gia Quý Hotel - místní vyhlášený luxusnější hotel. Booking/Agoda","Mnoho dalších ubytování ve městě najdete po kliknutí na odkazech níže."],"budget":{"jidlo":400000,"ubytovani":200000,"benzin":70000,"ostatni":0,"celkem":670000,"pozn":""},"brief":"Výjezd průsmykem Mẻ Pia, krásná táhlá údolí provincie Cao Bằng a příjezd do údolí s horou Núi Mắt Thần v překladu znamenající „oko anděla“.","phase":"hory","from":"Bảo Lạc","to":"Núi Mắt Thần","vasek":"Postupně začnete lehce sjíždět z vysokých hor a ocitnete se více méně v rovině, ale v obklopení vápencových hor z ní vystupující. Cao Bằng je nádherná provincie, kam pořád jezdí minimum zahraničních turistů. Ubytování vám naplánuju u údolí a dnes čím dál tím více známější unikátní hory Núi Mắt Thần, kam se dá mimochodem sjet i na motorce a trochu se vyblbnout ježděním na travnaté planině. ;)"},{"n":16,"weekday":"pondělí","date":"26. 10. 2026","theme":"HRANIČNÍ VODOPÁD","fromto":"Núi Mắt Thần Bản Giốc","km":"69 km","time":"1h 34","profile":"kvalitní široké cesty","pois_pdf":[{"n":"VODOPÁD BẢN GIỐC","d":"Nejslavnější vietnamský vodopád Bản Giốc je nejen krásnou podívanou, ale i zajímavostí. Tvoří totiž hranici s Čínou, kdy jeden břeh je na vietnamské straně a druhý na čínské."},{"n":"JESKYNĚ NGUOM NGAO","d":"Rozsáhlá a hezká jeskyně."},{"n":"PAGODA PHẠT TÍCH TRÚC LÂM","d":"Nově vystavený buddhistický chrám na kopci s výhledem na vodopád Bản Giốc a celé údolí."}],"program":["Dnes to může být velmi krátký a rychlý přejezd k nejznámější atrakci celé oblasti - vodopádu Bản Giốc. Cesta měří 84 km a díky velmi kvalitní a poměrně rovné silnici do cíle můžete dorazit za 2,5 hodiny i s přestávkou. Cesta samotná nenabízí vyloženě žádné velké zajímavosti - samozřejmě kromě okolní krajiny, která je nádherná - a tak vyražte rovnou do cíle, kde toho na programu bude již mnohem více.","Pojedete pohodovou táhlou cestou údolím za kterým se napojíte na hlavní široký průsmykovitý tah s vyšším provozem. Jezdí zde poměrně mnoho dlouhých kamiónů a náklaďáků. Ve spojení s opakujícím se zatáčkovitým profilem cesty se zde často mohou tvořit menší kolony za pomalými a širokými náklaďáky. Pokud se tak nebudete chtít “táhnout”, bude nutné se postupně protlačovat dopředu. Dělejte tak však s maximálností opatrností, protože zatáčky jsou často slepé a auta jezdí rychle. Pokud si netroufnete, tak po pár kilometrech sjedete z hlavního tahu a cesta se rapidně uvolní. Celá pak již bude pokračovat pohodovou cestou krásnou rozsáhlou horskou krajinou.","Pokud máte chuť si cestu protáhnout a vydat se více do okolních vesnic, jeďte po Trase 2 v mapě, která vás povede hezkými údolími a následně po zcela nové široké silnici.","V samotném cíli jsou 3 hlavní místa, která stojí za návštěvu a dohromady vám zaberou cca 4-5 hodin. Doporučuji se nejdříve vydat do jeskyně Nguom Ngao, která je poměrně velká a z mého pohledu velmi hezká. Oproti jiným vietnamským jeskyním není nasvícená nespočtem různých barev (vietnamci to tak však mají rádi), ale vkusně a citlivě vůči prostředí. Na výběr bude ze dvou tras - krátké a dlouhé. První můžete jít zcela sami a okruh první částí jeskyně trvá maximálně 1 hodinu. Dlouhá trasa je s průvodcem a vede daleko jeskyní dále. Často jdete temnými úseky pouze s čelovkami a pouze hlavní síně jsou nasvícené. Je to nádherný zážitek, který rozhodně doporučuji. Počítejte, že celá cesta tam i zpět zabere 2-3 hodiny a místní průvodci nemluví Anglicky.","Po jeskyni se vydejte rovnou k vodopádu Bản Giốc. Dojeďte k bodu Parkoviště k vodopádu Bản Giốc, dále se vydáte pěšky přes stánky se suvenýry ke vstupu, kde si zakoupíte vstupenky a následně již vejdete dovnitř až přímo k vodopádu. Fakticky je to několik menších vodopádů vedle sebe. Všechny jsou však hezké. Hlavní vodopád má více pater, ale cesta nahoru je kvůli bezpečnosti uzavřená. Možné je si pronajmout místní “loďku” a nechat se svézt po řece až přímo pod vodopád. Velkým zážitkem samozřejmě je, že doslova koukáte do Číny kousek před sebou. Navíc i na čínské straně je mnoho turistů se kterými se budete moci fakticky pozdravit.","Poslední zastávkou bude nedaleká pagoda Phạt Tích Trúc Lâm po cestě zpět od vodopádu. Bude to výšlap po schodech nahoru, ale získáte krásný výhled na celé údolí i vodopád. V hezkém počasí je to ideální místo na západ slunce a zakončení dne."],"food":["Pokud jedete z města Cao Bằng a ještě jste nebyli, tak doporučuji na snídani Phở chua gia truyền Quyên - tradiční podnik, který vede již 4. generace. Paní majitelka - dnes stará dáma - zde jako první začala vařit v této oblasti vyhlášené phở s grilovaným kachním masem - “phở vịt”. Rozhodně doporučuji.","U vodopádu Bản Giốc se nachází zájezdová restaurace Nhà hàng Phương Cưu, která vaří opravdu výborně. Mnoho dalších malých jídelen najdete ve vesnici Đàm Thuỷ."],"stay":["Lan's Homestay - můj nejoblíbenější homestay dále od turistického Bản Giốc a navíc s přístupem k řece vhodné ke koupání. Booking/ Agoda","Riverside Homestay - podobný koncept, jako Lan’s Homestay, jen modernější a novější. Booking","Cestou k jeskyni Ngườm Ngao se nachází malá nově vybudovaná vesnička s homestay ubytováními. Níže je pár tipů:","Khuổi Ky Eco Homestay - klasický homestay. Booking/Agoda","Yen Nhi Homestay - další klasický homestay hned vedle. Booking/Agoda","Lan Rừng Homestay - homestay patřící majitelce Lan’s Homestay. Booking/Agoda","Khách Sạn So Oanh - nový hotel. Nelze však zamluvit online, proto si zavolejte nebo zamluvte přímo na místě."],"budget":{"jidlo":350000,"ubytovani":150000,"benzin":40000,"ostatni":100000,"celkem":640000,"pozn":"vstup na vodopád a do jeskyně, parkovné"},"brief":"Rychlý přejezd k hranici s Čínou, kterou tvoří slavný vodopád Bản Giốc. Návštěva jeskyně Nguom Ngao a pagody Phạt Tích Trúc Lâm.","phase":"hory","from":"Núi Mắt Thần","to":"Bản Giốc","vasek":"Rychlý přejezd k hranici s Čínou a to k známému a krásnému vodopádu Bản Giốc, který tvoří hranici. Nedaleko je i super jeskyně, kde se dá s průvodcem vydat na skvělou delší „Adventure“ trasu nádhernými síněmi a závěrečnou síní s „otvorem“ ven. Určitě doporučuju a skvělá aktivita."},{"n":17,"weekday":"úterý","date":"27. 10. 2026","theme":"DLOUHÝ PŘEJEZD","fromto":"Bản Giốc Bắc Sơn","km":"182 km","time":"5h 22m","profile":"hlavní tahy, kvalitní silnice, rozbitý úsek","pois_pdf":[{"n":"TRŽNICE BẮC SƠN","d":"Hlavní místní tržnice. Nemám prozkoumáno."},{"n":"BẮC SƠN VIEWPOINT","d":"Hora v údolí ze které se nabízí krásný 360 stupňový výhled na celé údolí. Nutný pěší náročnější trek na vrchol."}],"program":["Dnes máte v plánu dorazit do krásného údolí Bắc Sơn. Je to poměrně jedinečná oblast, ve které se v poloměru cca 40 km roviny nachází členité hory. V údolích se pěstuje především rýže a vytváří tak krásná panoramata rýžových polí uzavřených okolními horami. Cesta tam však bude dlouhá a bude to primárně o přejezdu, tak vyražte brzy, jelikož odpoledne se dá ještě stihnout výšlap na Bắc Sơn Viewpoint s krásným výhledem do celého okolí.","Z Bản Giốc pokračujte dále rovně podél čínské hranice. V podstatě celá cesta až do městečka Thất Khê je poměrně rychlá, střídá se zde několik údolí, průsmyků, hezká krajina a také pár typů cest od starších až po zcela nové, luxusní a široké. Bude to velmi “cruisovací”, ale dynamický den na pohodu.","Thất Khê je vhodnou zastávkou na oběd. Za městem vás pak již čeká poslední úsek cesty, který je hodně zatáčkovitý a možná až únavný vedoucí horskými průsmykovitými cestami. Již několik kilometrů před Bắc Sơn však začnete vjíždět do velmi členité horské oblasti, kvůli které sem jedete. Hory začnou být až kuželovitého tvaru jedna vedle druhé. Bude to zas změna oproti dřívějším prostředím. Pokud jste přijeli včas, vydejte se na západ slunce na pěší výlet na Bắc Sơn Viewpoint odkud se vám naskytne nádherný výhled na celé údolí, kvůli kterému jste tady a dělají tuto oblast slavnou. Dojděte nebo dojeďte motorkou na “parkoviště” - je to spíše soukromý dům - odkud vede cesta nahoru v křoví. Občas se dá přehlédnout, když je křoví hodně zarostlé, tak se orientujte přesně podle bodu v mapě. Je to velmi úzká, strmá a fyzicky náročná cesta nahoru po kamenech. V nebo po dešti je to hodně nebezpečné, jelikož jílovitá půda dost klouže. Vezměte si rozhodně pevnou obuv, vodu a případně čelovku/baterku na cestu zpět. Pokud již dnes nestíháte, dá se výšlap udělat i zítra ráno.","Na údolí je ale hezký pohled i z nížiny. Koukáte na pole, místní farmáře, létající volavky a hory v pozadí. Vyznačil jsem jedno mé oblíbené místo - výhled na pole a údolí."],"food":["Oběd je vhodné si dát v městečku Thất Khê. Vyznačil jsem restauraci Nhà hàng Toàn Hà od, ale spoustu dalších jídelen se nachází v centru města.","Večeři jsem vždy měl v homestay ubytování, které je doporučeno níže. V městečku Bắc Sơn však jistě bude spoustu restaurací. Pokud se vydáte na Bắc Sơn Viewpoint, tak pod horou se nachází velmi hezká kavárna Bống Cafe."],"stay":["Vřele doporučuji homestay Homestay Bắc Sơn s opravdu nádherným výhledem na místní pole a kopce přímo na západ slunce. Booking/ Agoda","Velmi dobrý je také Dương Công Chích Homestay. Booking/Agoda","Ve vesnici se pak nachází více homestay ubytování, avšak nejsou na Bookingu."],"budget":{"jidlo":300000,"ubytovani":150000,"benzin":100000,"ostatni":0,"celkem":550000,"pozn":""},"brief":"Celodenní přejezd do krásné oblasti Bắc Sơn. Odpolední výšlap na Bắc Sơn Viewpoint.","phase":"hory","from":"Bản Giốc","to":"Bắc Sơn","vasek":"Tady prakticky začne 2 denní delší sjezd z hor na jih zpět do nížiny a na závěrečný odpočinek na ostrově. Tento den je pořád v horách, bude rozdělený na 3 hlavní úseky, které se budou měnit jak krajinou, tak cestami. Je to delší, ale opět bez vyloženě možných zajímavých zastávek a když to jezdím já s motorkářema, tak při výjezdu v 9 jsme na místě mezi 14.-15. hod odpoledne a ještě stihneme strmej, ale ne moc dlouhej výšlap na místní kopec s výhledem do unikátního homolovitýho údolí v Bắc Sơn, kde by v této době měla akorát dozrávat rýže."},{"n":18,"weekday":"středa","date":"28. 10. 2026","theme":"VZHŮRU K MOŘI!","fromto":"Bắc Sơn Cát Bà","km":"216 km","time":"5h 29m","profile":"horské zatáčkovité úseky, okresní cesty, trajekt","pois_pdf":[{"n":"KRÁSNÁ PŘÍRODNÍ OBLAST","d":"Krásná a opět svým způsobem jedinečná hornatá oblast kousek za Bắc Sơn."},{"n":"PŘÍSTAV TUẦN CHÂU","d":"Přístav ve městě Hạ Long z kterého se trajektem dostanete na ostrov Cát Bà."}],"program":["Dnes zamíříte do veleznámé oblasti a zátoky Hạ Long patřící na tzv. seznam Nových 7 přírodních divů světa.","Cesta je poměrně dlouhá - celkem 216km, 5h 29m, z toho 194km a 4h 55m do přístavu Tuần Châu, odkud poslední trajekt na ostrov Cát Bà vyplouvá v 15:00 hod. Stihnout tento trajekt je tak vaším primárním a zásadním cílem dnešní cesty a spolu se zastávkami na cestě potřebujete vyrazit nejpozději v 8 hodin, ideálně již v 7 hodin ráno. Pečlivě si tak dnešní den naplánujte a připravte se na něj, jelikož kvůli poslednímu trajektu v 15 hod nebude moc prostoru pro změny a zdržování se na cestě.","Celá cesta je každopádně poměrně rychlá a ještě za Bắc Sơn si užijte posledních 50 km přírodou v této krásné přírodní oblasti. Jsou to v podstatě roviny, avšak s mnoha krásnými vápencovými horami a skalami. Dříve prakticky neznámá, avšak v posledních pár letech čím dál tím více populární oblast a to hlavně díky planině Đồng Lâm přitahující mnoho turistů za kempováním, které se obecně zpopularizovalo během Covidu. Planina je poměrně velká, celá obklopená horami tvořící spíše takové skryté údolí. Teče tudy potok, místní farmáři zde pasou koně, krávy a vodní buvoly. Během víkendů je zde až příliš mnoho lidí, ale v týdnu prakticky nikdo. Na motorce se sem dostanete jednoduše z odbočky na planinu Đồng Lâm přes místní parkoviště po úzké cestičce až přímo na planinu.","Dále to již opravdu bude muset být primárně „rychlovka“. Překonáte několik pohoří včetně průsmyku Hạ My a také 3 různé provincie. Cesty jsou spíše vedlejší/okresní, ale rychlé bez většího provozu. Doporučuji si cestu rozkouskovat na etapy spojené s tankováním a především obědem buď v Nhà Hàng Cường Sinh, nebo Nhà Hàng Tây Yên Tử o kousek dále.","Následně přejedete již zmíněný průsmyk Hạ My a pokud budete mít dostatek času, můžete se zastavit na pauzu v přírodě a to hezkou planinu u jezera vyznačenou v mapě. Poté je to již jen 35km a 50m do přístavu Tuần Châu, kde doporučuji být nejpozději okolo 14:30. Plavba trajektem na ostrov Cát Bà trvá zhruba 50 minut a lístek pro 1 osobu a 1 motorku stojí 80.000 VND. Okolo 16. hodiny tak dorazíte do přístavu Bến phà Gia Luận na ostrově a odsud je to již jen 22km a 34m do centra města, respektive podle toho, kde budete mít zarezervované ubytování, kterých je po celém ostrově, ale i na přilehlých ostrůvcích, spousta."],"food":["Nhà Hàng Cường Sinh - Větší klasická restaurace s cơm u hlavní silnice. Ideální zastávka na oběd, jelikož se nachází zhruba 110km a 3h jízdy z Bắc Sơn.","Nhà Hàng Tây Yên Tử - Velká a velmi dobrá restaurace s cơm a phở. Nachází se o 14km dále za restaurací Nhà Hàng Cường Sinh zmíněnou výše.","Po cestě bude spousta možností k jídlu. Především ve městech Bắc Giang a Bắc Ninh.","V městě Bắc Giang jsem nedávno objevil závitkovou restauraci Quán Cuốn, kde mají opět mé oblíbené čerstvé závitky s grilovaným fermentovaným masem z centrálního a jižního Vietnamu.","Za Bắc Ninh znám také výbornou jídelnu na phở s buvolím masem Nhà Hàng Trâu Lim Hà Anh."],"stay":["Přímo ve městě doporučuji tyto ubytování s výborným poměrem cena/kvalita:","Manh Vuong Hotel - dobrý hotel přímo na hlavní promenádě s pokoji s výhledem na moře. Booking/Agoda","New Horizon Hotel - hezký kvalitní hotel za dobrou cenu. Booking/Agoda","TOMMY HOTEL - hezký čistý hotel za dobrou cenu. Booking/Agoda","Na ostrově se také nachází krásná ubytování mimo město uprostřed přírody a hor:","Cat Ba Eco Lodge - Menší poměrně skromné ubytování spíše ve stylu typického homestay a pár bungalowů mezi stromy. Má bazén. Booking/Agoda","Cat Ba Holiday Retreat - Hezké větší ubytování uprostřed krásného údolí blízko skalnatým horám a lesům. Bazén a profesionálnější služby. Booking/Agoda","YEN Hidden Valley - Krásné, na místní poměry spíše luxusnější ubytování v tzv. Motýlím údolí ve vesnici Liên Minh. Toto je opravdu skrytý klenot ve větším izolovaném údolí nabízející travnatou planinu, v období dešťů se i částečně zaplavuje a vytváří přírodní jezírko, na místních skalách i možnost horolezectví. Booking/Agoda","Vyhledal jsem také 5 možných ubytování, které se nacházejí na přilehlých malých ostrůvcích a měly by tak nabízet klid, větší soukromí a vlastní pláž. Žádné z nich však nemá nijak závratně vysoké hodnocení (kromě Vạn Bội Ecolux Resort). Resorty se zdají být již lehce starší. Nečekejte tak vyloženě luxus. Jde zde především o místo.","Monkey Island Resort - hezký resort s dřevěnými bungalowy a hezkou pláží. Zdá se být klidným místem k odpočinku. Trochu starší vybavení. Hodnocení 7,4. Booking/Agoda","Cat Ong Beach Cottages - oproti ostatním hezky vybavené pokoje, hezká soukromá pláž. Výhled na hlavní ostrov Cát Bà a tak možný provoz lodí ve výhledu. Hodnocení 6,5. Booking/Agoda","Namcat Island Resort - poměrně hezké dřevěné bungalowy a chaty nad vodou. Pravděpodobně spíše pro backpackery. Hodnocení 6,9. Booking/Agoda","Cat Ba Sandy Beach Resort - resort hned vedle Namcat Island Resort výše. Zdá se být hezčí a kvalitnější. Odpovídají tomu i ceny. Hodnocení 6,5. Booking/Agoda","Vạn Bội Ecolux Resort - nejluxusnější volba z nabídky. Nové, hezké pokoje. Malý bazén na břehu s výhledem na moře. Hodnocení 9,1. Booking/Agoda","Pro vyhledání dalších ubytování na hlavním ostrově a celé oblasti klikněte na odkaz níže."],"budget":{"jidlo":400000,"ubytovani":300000,"benzin":120000,"ostatni":80000,"celkem":900000,"pozn":"trajekt"},"brief":"50 kilometrů přírodou a vesnicemi. Okresní silnice přes hory až do přístavu v Hạ Long a trajektem na ostrov Cát Bà.","phase":"hory","from":"Bắc Sơn","to":"Cát Bà","vasek":"Toto bude nejdelší a nejnáročnější etapa celé cesty - 216 km, přes 5 hodin v sedle a hlavně nutnost stihnout trajekt s tím, že poslední vyplouvá v 15:00. Vyjedete tak co nejdřív ráno a věřím, že mě za tenhle den nebudete proklínat. :D Na druhou stranu pak budete mít 3 celý dny relaxu na ostrově."},{"n":19,"weekday":"čtvrtek","date":"29. 10. 2026","theme":"DOVOLENÁ","fromto":"Cát Bà Cát Bà","km":"","time":"","profile":"","pois_pdf":[{"n":"ZÁTOKA LAN HA","d":"Místní alternativa k známé zátoce Hạ Long. Možnost projížděk lodí a kayakingu."},{"n":"NÁRODNÍ PARK CÁT BÀ","d":"Národní park Cát Bà zabírá většinu plochy ostrova a je jednou z hlavních místních aktivit. Nabízí možnosti hezkých treků a to buď krátkých a samostatných nebo s průvodcem klidně i na více dnů."},{"n":"VRCHOL NGỰ LÂM","d":"Vrchol v NP s krásným výhledem na džunglovité okolní hory."},{"n":"JESKYNĚ TRUNG TRANG","d":"Místní proslavená jeskyně s krásnými krápníky."},{"n":"JESKYNĚ ĐỘNG HOA CƯƠNG","d":"Menší jeskyně na severní straně ostrova."},{"n":"NEMOCNIČNÍ JESKYNĚ","d":"Historické místo - nemocnice vybudovaná v jeskyni využívaná během války."},{"n":"VOJENSKÁ PEVNOST","d":"Vojenská pevnost v městečku Cát Bà nabízí válečné artefakty a také krásný výhled na zátoku."},{"n":"PLÁŽE","d":"Městské pláže."}],"program":["Ostrov Cát Bà a jeho okolí nabízí poměrně dost aktivit, kterými se dá v pohodě strávit minimálně 2 celé dny. Nejznámější aktivitou a důvodem, proč lidé na Cát Bà jezdí je zátoka Lan Ha, která je alternativou k proslavené zátoce Hạ Long. Skládá se z více, než 300 krásných ostrovů mezi kterými se dají podniknout 1 a vícedenní plavby. Právě jednodenní plavby jsou nejběžnější a v ceně většinou bývá i kayaking. Alternativou je půjčit si kayak v městečku nebo na ubytování a vydat se tak na vlastní pěst.","Denní plavby bývá nejjednodušší si zamluvit přímo přes ubytování, která mají nejaktuálnější nabídky, srovnání a mnohdy i o trochu lepší ceny oproti internetovým nabídkám. Nejlepší internetové nabídky najdete momentálně na https://www.getyourguide.com,kde je samozřejmě nejširší výběr. Obecně jde primárně o to si dobře zvolit velikost lodě, což souvisí s počtem lidí na palubě a během celé plavby, a také kvality, respektive vybavenosti, které jsou od úplně základních až po luxusní např. s vířivkou, barem, apod. extra službami. Vyberete tak opravdu podle svých vlastních preferencí, jelikož nabídka je široká.","Plavby typicky začínají mezi 9.-10. hodinou a končí okolo 17. hodiny. Tato aktivita tak zabere celý den.","Kromě samotné zátoky, kterou si nechte na celý zítřejší den (plavbu si zarezervujte již dnes, pokud jste tak již neudělali předem), další nejvýznamnější atrakci na ostrově je bez pochyby Národní park Cát Bà, který pokrývá většinu ostrova. Hornatá a džunglovitá oblast ve které se dají podnikat treky džunglí i po horách. Vydat se můžete sami po značených stezkách nebo si rovnou pronajmout průvodce se kterým se dá dělat více denní trek nebo tzv. noční pozorování místních zvířat. Velmi lákavý je výšlap na horu Ngự Lâm, odkud je krásný výhled na okolí. Cesta nahoru trvá cca 45 minut a dolů 30 minut. Pro podrobnější informace o aktivitách v NP se vydejte do návštěvnického centra nebo koukněte na oficiální webové stránky http://catbanationalpark.vn.","Nedaleko centra parku se nachází známá jeskyně Trung Trang s mnoha krásnými krápníky. Pokud vás jeskyně vyloženě lákají, vydejte se ještě na severní stranu ostrova, kde se nachází jeskyně Động Hoa Cương.","Další velmi slavnou památkou podobného tématu je místní Nemocniční jeskyně. Třípatrová nemocnice vybudovaná v jeskyni dokonce s vlastním kinem a bazénem sloužila za války mezi lety 1965-1975. Celý objekt si můžete projít a poznat tak trochu pozůstatky války. Pokud vás téma vietnamské války zajímá více,
